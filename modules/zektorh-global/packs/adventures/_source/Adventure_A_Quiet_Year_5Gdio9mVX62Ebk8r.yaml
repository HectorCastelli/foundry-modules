            name: pileName,
            type: "pile",
            folder: folder.id,
            description: "Drawn pile for cards in The Quiet Year.",
            system: {}
          });
        } else {
          await pile.update({ folder: folder.id });
        }

        // 3. Setup Decks inside Folder
        for (const [index, seasonData] of quietYearData.entries()) {
          const dynamicDeckName = `${index + 1}. ${seasonData.season}`;
          let deck = game.cards.find(c => c.name === dynamicDeckName && c.type === "deck");

          if (!deck) {
            deck = await Cards.create({
              name: dynamicDeckName,
              type: "deck",
              folder: folder.id,
              description: `${seasonData.season} Deck for The Quiet Year`,
              system: {}
            });
          } else {
            await deck.update({ folder: folder.id });
          }

          const existingCardIds = deck.cards.map(c => c.id);
          if (existingCardIds.length > 0) {
            await deck.deleteEmbeddedDocuments("Card", existingCardIds);
          }

          const cardsToCreate = seasonData.cards.map(card => {
            const fullCardName = `${card.name} (${seasonData.season})`;
            return {
              name: fullCardName,
              type: "base",
              description: card.options.join("\n--- OR ---\n"),
              faces: [{ name: fullCardName, text: buildCardHtml(card, fullCardName), img: "icons/svg/card-hand.svg" }],
              face: 0,
              suit: seasonData.suit,
              value: card.rank
            };
          });

          await deck.createEmbeddedDocuments("Card", cardsToCreate);
        }

        ui.notifications.info("The Quiet Year folder, decks, and Drawn pile created successfully!");
      })();
