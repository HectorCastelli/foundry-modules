              { rank: 4, name: "4 of Hearts", options: ["What important and basic tools does the community lack?", "Where are you storing your food? Why is this a risky place to store things?"] },
              { rank: 5, name: "5 of Hearts", options: ["There is a disquieting legend about this place. What is it?", "Alarming weather patterns destroy something. How and what?"] },
              { rank: 6, name: "6 of Hearts", options: ["Are there children in your community? If there are, what is their role in the community?", "How old are the eldest members of the community? What special needs do they have?"] },
              { rank: 7, name: "7 of Hearts", options: ["Where does everyone sleep? Who is unhappy with this arrangement, and why?", "What natural predators roam this area? Are you safe?"] },
              { rank: 8, name: "8 of Hearts", options: ["An old piece of machinery is discovered, broken but perhaps repairable. What is it? What would it be useful for?", "An old piece of machinery is discovered, cursed and dangerous. How does the community destroy it?"] },
              { rank: 9, name: "9 of Hearts", options: ["A charismatic young girl convinces many to help her with an elaborate scheme. What is it? Who joins her endeavors? Start a project to reflect.", "A charismatic young girl tries to tempt many into sinful or dangerous activity. Why does she do this? How does the community respond?"] },
              { rank: 10, name: "10 of Hearts", options: ["There's another community somewhere on the map. Where are they? What sets them apart from you?", "What belief or practice helps to unify your community?"] },
