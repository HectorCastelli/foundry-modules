  - folder: NeuPNmkuk5bzjCLR
    name: Shuffle Decks
    type: script
    _id: okWO1RZhr1LTOmaq
    img: modules/game-icons-net/whitetransparent/card-exchange.svg
    scope: global
    command: |-
      (async () => {
        const seasonalDecks = [
          "1. Spring",
          "2. Summer",
          "3. Autumn",
          "4. Winter"
        ];

        for (const deckName of seasonalDecks) {
          const deck = game.cards.find(c => c.name === deckName && c.type === "deck");
          if (!deck) {
            ui.notifications.warn(`Deck "${deckName}" not found. Run Setup Macro first.`);
            continue;
          }

          // Shuffle the deck natively
          await deck.shuffle();

          // Place King of Spades (Frost Shepherds) at the bottom of the Winter deck
          if (deckName.includes("Winter")) {
            const kingOfSpades = deck.cards.find(c => c.value === 13);
            if (kingOfSpades) {
              const maxSort = Math.max(...deck.cards.map(c => c.sort || 0));
              await deck.updateEmbeddedDocuments("Card", [{
                _id: kingOfSpades.id,
                sort: maxSort + 100000
              }]);
            }
          }
        }

        ui.notifications.info("All seasonal decks shuffled! Frost Shepherds moved to the bottom of 4. Winter.");
      })();
