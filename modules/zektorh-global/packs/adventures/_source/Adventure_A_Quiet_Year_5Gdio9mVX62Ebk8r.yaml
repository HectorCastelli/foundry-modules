  - folder: NeuPNmkuk5bzjCLR
    name: Next Card
    type: script
    _id: exUxZLA0sEPytEb7
    img: modules/game-icons-net/whitetransparent/card-draw.svg
    scope: global
    command: |-
      (async () => {
        const pileName = "Drawn pile";
        const seasonalDecks = [
          "1. Spring",
          "2. Summer",
          "3. Autumn",
          "4. Winter"
        ];

        // 1. Get Drawn pile
        const drawnPile = game.cards.find(c => c.name === pileName && c.type === "pile");
        if (!drawnPile) {
          ui.notifications.error(`Pile "${pileName}" not found! Run the Setup macro first.`);
          return;
        }

        // 2. Find active season deck
        let activeDeck = null;
        for (const name of seasonalDecks) {
          const deck = game.cards.find(c => c.name === name && c.type === "deck");
          if (deck && deck.cards.size > 0) {
            activeDeck = deck;
            break;
          }
        }

        if (!activeDeck) {
          ui.notifications.warn("All seasonal decks are empty! The Quiet Year has ended.");
          return;
        }

        // 3. Draw top card into the Drawn pile
        const drawnCards = await drawnPile.draw(activeDeck, 1);
        if (!drawnCards || drawnCards.length === 0) return;

        const drawnCard = drawnCards[0];
        await drawnCard.update({ face: 0 });

        // 4. Handle King of Diamonds Rule (Summer)
        if (drawnCard.suit === "Diamonds" && drawnCard.value === 13) {
          const remainingCards = activeDeck.cards.size;
          const discardCount = Math.min(2, remainingCards);

          if (discardCount > 0) {
            await activeDeck.deal([drawnPile], discardCount);
            ui.notifications.info(`King of Diamonds Rule: Discarded top ${discardCount} card(s) from Summer!`);
          }
        }

        // 5. Output Card Details to Chat
        const cardFace = drawnCard.faces[0];
        ChatMessage.create({
          content: `<div>${cardFace.text}</div>`,
          speaker: ChatMessage.getSpeaker({ alias: "The Oracle" })
        });

        // 6. Handle King of Spades Rule (Winter)
        if (drawnCard.suit === "Spades" && drawnCard.value === 13) {
          ui.notifications.warn("The Frost Shepherds have arrived. The game is over!");
        }
      })();
