    img: modules/game-icons-net/whitetransparent/tabletop-players.svg
    scope: global
    command: |-
      (async () => {
        const folderName = "The Quiet Year";
        
        // 1. Get or create "The Quiet Year" folder for Cards
        let folder = game.folders.find(f => f.name === folderName && f.type === "Cards");
        if (!folder) {
          folder = await Folder.create({
            name: folderName,
            type: "Cards"
          });
          ui.notifications.info(`Created Folder: "${folderName}"`);
        }

        const quietYearData = [
          {
            season: "Spring",
            suit: "Hearts",
            cards: [
              { rank: 1, name: "Ace of Hearts", options: ["What group has the highest status in the community? What must people do to gain inclusion in this group?", "Are there distinct family units in the community? If so, what family structures are common?"] },
              { rank: 2, name: "2 of Hearts", options: ["There's a large body of water on the map. Where is it? What does it look like?", "There's a giant, man-made structure on the map. Where is it? Why is it abandoned?"] },
