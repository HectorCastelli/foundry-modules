          <div class="flexrow align-center">
            <hr class="flex1"/>
            <span class="flex0">or...</span>
            <hr class="flex1"/>
          </div>
        `;

        function buildCardHtml(card, fullName) {
          const formattedOptions = card.options.map(opt => `<p>${opt.replace(/\n/g, '<br/>')}</p>`);
          return `
            <div>
              <h3>${fullName}</h3>
              ${formattedOptions.join(flexDivider)}
            </div>
          `.trim();
        }

