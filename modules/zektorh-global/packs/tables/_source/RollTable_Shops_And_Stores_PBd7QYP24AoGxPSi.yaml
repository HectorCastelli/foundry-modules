      fountains to statues and headstones. He's expanded his business recently
      by offering smaller, personal busts of the client for a reasonable sum,
      depending on the quality of the stone. Ketterman typically sells to the
      upper class, but as long as you can pay he's more than willing to work
      with just about any customer. But here's the catch: Ketterman is actually
      an accomplished diviner as well. Every time he carves an eye into his
      stonework he can use those eyes to scry through at any time. Ketterman
      uses his vast network of eyes to spy on anyone within their gaze, and if
      he comes across something particularly noteworthy he sells that knowledge
      to the highest bidder, or uses it as leverage for blackmail under his
      assumed alias of 'The Emerald Pool' (because his eyes are green).
      Ketterman has been operating for almost two decades now, and his work has
      traveled far across the land. Odds are his stone eyes have seen something
      you didn't want to be seen. So tell me friend; what are you hiding?
