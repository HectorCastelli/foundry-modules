    name: ''
    description: >-
      The Prime Meridian: This store has one person inside with very, very shiny
      golden shoes. "These are my prime shoes" they say. They will sell you
      almost any item, and have it back to you within two days. However, there
      is a significant charge to getting the item, and some items might not come
      within two days. Unfortunately, before you can buy, the man tries to up
      sell you with a long list of items, and won't begin getting your item
      until bombarding you with the other items. Things like a bard service to
      follow you around with music, a chef service to cook you food, an
      enchanted rock that you can talk to, but also tells him your preferences
      in case you come back, a painting delivery service that sends you
      paintings every week for you to look at, but the paintings are pretty bad,
      like a child drew them. Each service costs 2-3x the cost of the item they
      are going to get in 2 days.
