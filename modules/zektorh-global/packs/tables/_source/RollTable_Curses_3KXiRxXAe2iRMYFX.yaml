    description: >-
      When the target of the curse next goes to sleep, they dream of a burning
      lake. The dreams progress, becoming nightmares over time. The target
      instinctively becomes aware of the direction of the lake, and must save vs
      Wis or spend that day trying to reach the lake. The target must save every
      day to prevent the condition progressing, taking a penalty to mental rolls
      for every stage it advances. To completely recover, the target must make 3
      saves in a row, if they fail a save it regresses to its initial condition,
      and if they fail 3 times in a row the target becomes maddened until they
      reach the lake. Upon reaching the lake they will see it is not engulfed in
      flames, and will take d6 Psychic damage for the number of days they have
