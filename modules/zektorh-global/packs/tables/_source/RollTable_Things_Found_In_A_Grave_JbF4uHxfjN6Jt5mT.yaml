    name: ''
    description: >-
      "Approaching the grave you see the ground has heaved up some not just
      above the grave, but for five feet on all sides as well. During your
      efforts to excavate the coffin, you find splintered wood, investigation of
      the wood reveals it to be from a coffin. Digging further down towards the
      rest of the coffin, you find a huge, hunched, mishapen skeleton. It
      appears, though twisted, to be posed as if it had been the one lain to
      rest in the coffin. Other uncovered parts of the coffin appear to be
      normal humanoid sized; coinpurse, tatters of clothing, even what remains
      of a pair of shoes near the huge skeleton’s feet are medium sized. Some
      jewelry lies broken among the bones, a necklace emanating fading
      transmutation magic near the skeleton’s neck with its chain snapped and
      two rings split from the inside laying upon the finger bones. The
      headstone reads to the effect of: ” Here lies our dear Gerald. He helped
      heal the hole in our family. We forgive you Gerald, for whatever you kept
      apologizing for.”"
