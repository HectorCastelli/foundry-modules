      "A slightly hunched skeleton rests peacefully within the coffin, several
      extremely desiccated bunches of flowers lie around it. The remains of some
      folded, mostly ruined pieces of paper lay where the occupant’s torso used
      to be. If you are able to make out any of the writing, the notes reveal
      that this was the much-loved, elderly mother of a large family. They wrote
      these notes and placed them in their mother/grandmother’s coffin. You feel
      incredibly guilty about disturbing this poor woman’s resting place."
