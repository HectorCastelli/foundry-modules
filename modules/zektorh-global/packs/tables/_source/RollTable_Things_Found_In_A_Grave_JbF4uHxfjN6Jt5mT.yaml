      - 39
    name: ''
    description: >-
      "A deathly pale, young humanoid that appears to be around twenty to thirty
      years of age. They are reclined comfortably in a deep, cushioned casket,
      reading a book. By the light of a magical smokeless candle they are very
      proud of, they beckon you down a hatch in the bottom of their casket to a
      small hidden cave. The cave, though dimly lit, is actually very homey. The
      walls are lined with over full, wooden bookcases, stacks of books line a
      narrow path to a comfortable chair. The youth explains that hundreds of
      years ago, they grew tired of being accused of vampirism just because they
      are immortal (they are very dismissive of the fact that they are immortal
      and don’t seem to know the source of their immortality themselves). They
      decided to gather as many books as they could, use the money they had put
      aside to construct this secret room and buy a comfortable coffin, then
      fake their death. Hundreds of years later they definitely don’t regret
      their decision, only pausing briefly before offering the party a quest for
      more books to fully restock the youth’s “library”, along with whatever
      reward is offered, the party gets all of the old books to do with as they
      please, as well as a small volume of surprisingly well written
      fanfiction."
