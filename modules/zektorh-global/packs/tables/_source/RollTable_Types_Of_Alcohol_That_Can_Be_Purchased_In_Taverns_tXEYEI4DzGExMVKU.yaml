    name: ''
    description: >-
      Gelatinous Gin: One curious and profitably end point in the wizardly
      experimentation of Curzan is this breed of gelatinous cube, bottled,
      intoxicating and relatively safe for consumption. This lively cousin of
      the Gelatinous Cube dances wildly in its bottle when it is given a little
      shake, as if it is sloshed itself. Sometimes brewers add flecks of
      precious metals like gold simply for visual effect and conspicuous
      extravagance. Typically served in a shot glass, the gelatinous drink goes
      down with a slightly paralyzing effect giving the drinker a signature
      raspy lisp. It is sweet from the molasses half-metabolized into alcohol
      (yes, it's technically a rum) and flavored by other organic material added
      in the brewing process—berries are popular, but some adventurous
      combinations include ghost peppers, whole octopi and cilantro. Left too
      long on its own, it has been known to sneak out of the glass and crawl off
      a bar.
