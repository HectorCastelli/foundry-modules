      physical form. I am merely floating consciousness, coalesced Will. None
      can see me, but I can see all. What I don't see, doesn't exist. And what
      comes into existence is the power of my omnipotent subconscious keeping me
      from being bored by keeping part of my Will hidden from me. This is what
      happens when I discover new things. Even though it's new, I already knew
      it. It exists because I made it exist, I just tricked myself into
      forgetting. I hate that part of my all-powerfulness. I must destroy new
      things to teach myself a lesson.
