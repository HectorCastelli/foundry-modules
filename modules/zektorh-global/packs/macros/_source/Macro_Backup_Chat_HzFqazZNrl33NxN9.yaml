command: >-
  // Saves all the chat content into a file/backup, creates a Journal entry with
  formatted HTML and a hidden JSON block, then cleans the chat.


  const messages = game.messages.contents;

  if (messages.length === 0) {
    return ui.notifications.warn("The chat is empty. Nothing to do!");
  }


  // 1. Use Foundry's native export chat log function (or trigger data export)

  // Foundry VTT has a built-in function on ChatLog or we can generate the
  export data directly.

  // Let's create the JSON data of all messages.

  const chatData = messages.map(m => m.toObject());

  const jsonString = JSON.stringify(chatData, null, 2);


  // Trigger a native file download backup as requested

  const filename = `chat-export-${new Date().toISOString().replace(/[:.]/g,
  "-")}.json`;

  saveDataToFile(jsonString, "text/json", filename);


  // Delete everything from the active chat

  await ChatMessage.deleteDocuments(messages.map(m => m.id));

  ui.notifications.info("Chat exported to JSON file and cleared.");
