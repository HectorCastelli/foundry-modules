name: Export All Settings
type: script
_id: b2MQHI7BbgTeqgFX
author: fxKESTgEBpcOTrSl
img: modules/game-icons-net/whitetransparent/card-pickup.svg
scope: global
command: |-
  (async () => {
    // Extract all registered game settings
    const allSettings = game.settings.settings;
    const exportedData = {};

    // Filter out core system & foundry settings, keeping only custom modules
    for (const [key, setting] of allSettings.entries()) {
      const { namespace, key: settingKey } = setting;
      try {
        const currentValue = game.settings.get(namespace, settingKey);
        
        if (!exportedData[namespace]) {
          exportedData[namespace] = {};
        }
        exportedData[namespace][settingKey] = currentValue;
      } catch (err) {
        console.warn(`[Module Exporter] Could not read setting: ${namespace}.${settingKey}`, err);
      }
    }

    // Format JSON payload
    const jsonString = JSON.stringify(exportedData, null, 2);
    const fileName = `module-settings-${game.world.id}-${new Date().toISOString().slice(0, 10)}.json`;

    // Trigger file download in browser
    saveDataToFile(jsonString, "application/json", fileName);

    ui.notifications.info(`Exported settings for ${Object.keys(exportedData).length} modules to ${fileName}`);
  })();
