name: Random Player
type: script
_id: 3tW7LB8N7QTe9pX7
author: 1Njz0vDEn4hXH4fV
img: modules/game-icons-net/whitetransparent/3d-meeple.svg
scope: global
command: >-
  // Filter for active non-GM users

  const activePlayers = game.users.filter(u => u.active && !u.isGM);


  if (activePlayers.length === 0) {
      return ui.notifications.warn("No players are currently connected!");
  }


  // Select one at random

  const randomPlayer = activePlayers[Math.floor(Math.random() *
  activePlayers.length)];


  // Announce in chat

  ChatMessage.create({
      content: `
      <h4>Fate has chosen...</h4>
      <p style="text-align:center;">
        <b>${randomPlayer.name}</b>
      </p>
      `
  });
