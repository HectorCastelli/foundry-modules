name: Magical Incense
formula: 1d6
description: >-
  <p>Cults are fond of rituals and often use them as a way to reinforce
  themselves, powered by the dark, nefarious entities backing them from behind
  the shadow veil. Incense is one of the ways they employ in order to embolden
  themselves. Meditating while under their influence has diverse results, and
  their lair's atmosphere often is saturated with the powerful smell of burning
  incense.</p><p></p>
