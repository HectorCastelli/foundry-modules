system:
  containerSpace: 1
  description: >-
    <p>Target someone nearby. Next to them an imitation appears. The imitation
    has the same equipment and attributes as the target, and does everything in
    it's power to kill the original.</p><p>Imitations should be considered
    hostile for all purposes, but rolls as if player controlled.</p><p>If the
    spell fails to be cast, an imitation of the caster appears instead. If the
    caster is killed by the imitation, it takes it's place in the
    group.</p><p>Can only be cast once per day.</p>
