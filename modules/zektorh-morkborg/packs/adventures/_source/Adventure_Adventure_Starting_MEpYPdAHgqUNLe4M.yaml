      - sort: 200000
        name: The New Gods
        type: text
        _id: HYUZqL878jgC8RRd
        system: {}
        title:
          show: true
          level: 1
        image: {}
        text:
          format: 1
          content: >-
            <p>As life was brought forth by the Five (but mostly Soultorn), some
            creatures showed more promise than others.</p><p>Those ambitious
            enough, sought out and accomplished feats that made the Original
            Five recognize them as a cut above the rest. Those were then given
            powers, gifts, boons, and sometimes banes from the jealous Five.</p>
        video:
          controls: true
          volume: 0.5
        src: null
        category: null
