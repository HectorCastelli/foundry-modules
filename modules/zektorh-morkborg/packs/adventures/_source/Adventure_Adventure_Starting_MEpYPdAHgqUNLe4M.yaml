      - sort: 2400000
        name: Bergen Chrypt
        type: text
        _id: 1k9JTeySBfcFT36Z
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <div class="eat-prey-kill creatures"><div
            class="region-title"><p>Bergen
            Chrypt@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.xi0xC6JMYXipFE1b]{Bergen
            Chrypt}</p></div><div class="two-cols"><div class="col"><div
            class="creature-image"><img title="Tunnel Sneak"
            src="modules/morkborg-cult-feretory/assets/eat-prey-kill/tunnel-sneak.webp"></div><div
            class="creature-block"><h2>Tunnel Sneak</h2><div
            class="description"><p><span class="num">1</span> <span
            class="text">The
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.0mW3ITO9AERnyb89]{Tunnel
            Sneak} <span class="text">moves silently through catacombs’ cracks
            and crevices seeking its next meal. Although the size of a grown
            man, its malleable form fits through the most unlikely
            openings.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 12,
            <strong>Morale</strong> -, <strong>Malleable form</strong> -d2,
            <strong>Claws</strong> d6</p><p><strong>Special:</strong> The PC
            with the highest Presence makes a DR14 test after tracking down a
            Tunnel Sneak. Failure means it found you first and a random party
            member is hit with a sneaky claw strike for d6+3
            damage.</p></div></div><p></p></div><div
            class="spacer-col"><p></p></div><div class="col"><div
            class="creature-block"><h2>Nephalix Monkeys</h2><div
            class="description"><p><span class="num">2</span> <span
            class="text">The
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.6EYUvbKB2DRGJuUV]{Nephalix
            Monkey} <span class="name rollable" data-roll="d4">D4</span> <span
            class="text">lived in the abyss for so long, the abyss grew tired of
            them and spat them out. Now they leap from peak to peak with their
            bony wings, tossing unfortunates down the cliffs to spite the rocks
            below, laughing all the while.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 7, <strong>Morale</strong>
            -, <strong>Scales</strong> -d2, <strong>Bite/Claws</strong> d6 +
            special</p><p><strong>Special:</strong> DR8 Strength test or be
            lifted up and flung through the air, landing 10’ away or somewhere
            far below.</p></div></div><p></p><div
            class="creature-block"><h2>Weakwill'd Whisperbird</h2><div
            class="description"><p><span class="num">3</span> <span
            class="text">The
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.hl2atKlFaCSlH3kU]{Weakwill'd
            Whisperbird} <span class="text">follows any master provided you kill
            the current one. Until then it fights tooth and beak to stop you. It
            looks so utterly pathetic that you must pass a DR 12 Presence test
            to fight back.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 2, <strong>Morale</strong>
            6, <strong>Beak</strong> d4</p><p><strong>Special:</strong> When
            encountering the bird roll its accompanying master: (d4)
            <br><br>1–2. Roll again on the hunting table<br>3. A flesh starved
            berserker (Rulebook, pp. 60)<br>4. A Lich looking for some goddamn
            peace and quiet (Rulebook, pp.
            63)<br></p></div></div><p></p></div></div><div class="centered"><img
            title="Vierwinged Falchon"
            src="modules/morkborg-cult-feretory/assets/eat-prey-kill/vierwinged-falchon.webp"></div><div
            class="two-cols"><div class="col"><div
            class="creature-block"><h2>Vierwinged Falchon</h2><div
            class="description"><p><span class="num">4</span> <span
            class="text">With four wings and a mean demeanor, the
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.wKLJ0si846BuCEjB]{Vierwinged
            Falchon} <span class="text">is the mountain skies’ undisputed
            despot. These massive birds’ arrogance brought them close to
            extinction as it eats only its own brood. It still kills other
            creatures to assert dominance.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 16,
            <strong>Morale</strong> -, <strong>Bite/Claws</strong>
            d10</p></div></div><p></p><div
            class="creature-block"><h2>Überwolf</h2><div
            class="description"><p><span class="num">5</span> <span
            class="text">Born during a full blood moon, the
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.yOERbodUIm45nG1p]{Überwolf}
            <span class="text">is three times the size of a
            @UUID[Compendium.morkborg-cult-feretory.feretory-actors.uQk6uloE0EKGqvN0]{Normal
            Wolf}, and there are usually </span><span class="name rollable"
            data-roll="1d10">(D6)</span> or more following close
            behind.</p></div><div class="stat-block"><p><strong>HP</strong> 18,
            <strong>Morale</strong> -, <strong>Thick fur</strong> -d2,
            <strong>Bite/Claws</strong> d8</p><p><em><strong><span
            style="text-decoration:underline">Regular
            wolf</span></strong></em></p><p><strong>HP</strong> 6,
            <strong>Morale</strong> 8, <strong>Bite</strong>
            d6</p></div></div></div><div class="spacer-col"><p></p></div><div
            class="col"><div class="creature-block"><h2>Ragpie</h2><div
            class="description"><p><span class="num">6</span> <span
            class="text">While resting the
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.FRPwsjTbciy4ytS2]{Ragpie}
            <span class="text">resembles a scrunched up bundle of cloth with a
            sprinkling of old bones closeby. When bringing down its prey it
            looks more like a dark cloak, enveloping the target in a deathly
            choke-embrace.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 8, <strong>Morale</strong>
            -, <strong>Thick skin</strong> -d2, <strong>Smother-cloak</strong>
            special</p><p><strong>Special:</strong> If defense fails you are
            embraced by the Ragpie, slowly choking and unable to act. Dealing d4
            damage/round until the Ragpie (1⁄2 of any damage dealt to it is
            dealt to the embraced) or a DR18 Strength test frees
            you.</p></div></div></div></div></div>
