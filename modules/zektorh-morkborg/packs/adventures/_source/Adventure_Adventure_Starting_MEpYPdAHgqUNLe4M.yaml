      - sort: 2200000
        name: Character Creation
        type: text
        _id: XWlBnlNte5oOK4rz
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <div class="the-game character-creation"><div class="top-block"><div
            class="title"><p>Create a Player Character
            (PC)</p></div><ol><li>Randomize your starting
            equipment.</li><li>Randomize weapon and armor.</li><li>Roll your
            abilities.</li><li>Roll your Hit Points (HP).</li><li>Name your
            character if you wish. It will not save you.</li></ol></div><div
            class="optional-rules"><p>Optional Rules:</p><div
            class="rules-grid"><div class="cross"><p>†</p></div><div
            class="rule"><p>Start by choosing or randomizing an optional class
            and follow the class’ instructions on rolling for equipment, weapons
            and armor.</p></div><div class="cross"><p>†</p></div><div
            class="rule"><p>Roll on the <em>Terrible Traits, Broken Bodies, Bad
            Habits,</em> and <em>Troubling Tales</em> tables.</p></div><div
            class="cross"><p>†</p></div><div class="rule"><p>Roll a number of
            Omens.</p></div></div></div><div class="create-block"><p>Or perhaps
            you'd like to trust the whim of the dice <br>and <span
            class="create-scvm"
            data-uuid="Compendium.morkborg.mork-borg-items.p693pMIVYXMSRl8S">Make
            One.</span></p></div></div>
