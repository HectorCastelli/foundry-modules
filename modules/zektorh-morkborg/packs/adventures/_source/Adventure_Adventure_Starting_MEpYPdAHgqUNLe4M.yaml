      - sort: 4000000
        name: Dead God's Prophet
        type: text
        _id: GFYR2Haam4lvr7RF
        title:
          show: false
          level: 1
        image: {}
        text:
          format: 1
          content: >-
            <div class="optional-classes dead-gods-prophet"><div
            class="two-cols"><div class="col"><div class="header-block"><img
            title="Dead God's Prophet"
            src="modules/morkborg-cult-feretory/assets/dead-gods-prophet/title.webp"><p
            class="subtitle"><span class="yellow-bg">A BLASPHEMOUS
            CLASS</span></p><p><strong>By</strong> Greg
            Saunders</p></div><p><strong>Voices in your head tell you what to
            do</strong> — at least you think so. You are the prophet of a god
            slain by the Basilisk SHE within Bergen Chrypt’s wretched peaks. Now
            no one wants to hear the words of your god, but you can still can.
            Day and night. Like hot wires through your brain. <span
            class="create-scvm"
            data-uuid="Compendium.morkborg.mork-borg-items.Item.BNOhaA4ebt6Bzx4E">[Make
            One]</span></p><p><span class="yellow-bg">Begins with <strong
            class="rollable" data-roll="1d6*5">d6×5s</strong> and <strong
            class="rollable" data-roll="1d3">d3
            Omens</strong>.</span></p><p><span class="yellow-bg rollable"
            data-roll="1d4"><strong>HP:</strong> Toughness +
            d4</span></p><p></p><div class="section-title"><p>Name your god ...
            (3d10)</p></div><div class="two-cols left-numbered"><div
            class="col"><p><br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10<br></p></div><div
            class="spacer-col"><p></p></div><div
            class="col"><p>@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.M1mJvkAZessYulT9]{Name
            your god... (1)}
            <br>Acrophoe<br>Elioch<br>Ekk<br>Ghzat<br>Gnost<br>Kvera<br>Malais<br>Varkka<br>Ääel<br>Öde</p></div><div
            class="spacer-col"><p></p></div><div
            class="col"><p>@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.jwBqpjmQbYvNo2Ab]{Name
            your god... (2)}
            <br>Beacon<br>Bearer<br>Bride<br>Child<br>Herald<br>King<br>Lady<br>Prince<br>Queen<br>Song</p></div><div
            class="spacer-col"><p></p></div><div
            class="col"><p>@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.5ckf2x3cwXGc9toL]{Name
            your god... (3)} <br>of Blood<br>of Death<br>of Decay<br>of
            Flies<br>of Impotence of Panic<br>of Rot<br>of Rust<br>of
            Unease<br>of the Flesh</p></div></div><p></p><div
            class="section"><div class="section-title"><p>Abilities</p></div><p>
            Obsessed, <span class="rollable" data-roll="3d6+2">roll 3d6+2</span>
            for Presence. Weak from neglect <span class="rollable"
            data-roll="3d6-2">3d6-2</span> for Toughness. Roll
            d4@DRAW[Compendium.morkborg.mork-borg-tables.qYznag89iDMdPH6A]{Starting
            Weapon}{1d4} on the weapon table and a
            d2@DRAW[Compendium.morkborg.mork-borg-tables.Cyg5IvubZiDmCCUk]{Starting
            Armor}{1d2} on the Armor table. You are literate and can use scrolls
            <strong>but must pass a DR12 Presence test or immediately attempt to
            destroy false gods’ words.</strong> If you start with a scroll,
            assume you passed the test. Roll randomly for two gifts from your
            dead god.</p></div></div><div class="spacer-col"><p></p></div><div
            class="col"><div class="section-title"><p>Two gifts
            (d8)@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.CedA8XBaPkHBUckx]{Gifts
            From Your Dead God}</p></div><div class="shape-title"><p>1. BLOOD
            TELLS</p></div><p>A flagellant, you regularly beat yourself to
            awaken your lost god. If you inflict d2 damage to yourself prior to
            combat, gain +2 to rolls equal to the lost HP.</p><div
            class="shape-title"><p>2. LORD OF NOTHING</p></div><p>You wear a
            bizarre arrangement of garments and scraps like a parody of a king
            or queen. Still, you gain +2 to rolls to impress the easily
            fooled.</p><div class="shape-title"><p>3. SMELL OF
            DECAY</p></div><p>Not only is your god dead but their decaying odour
            permeates you. +2 Defense roll bonus due to the gut-wrenching
            stench.</p><div class="shape-title"><p>4. INCOHERENT SOPHISTIC
            BABBLE</p></div><p>Concentrate to babble a disconcerting litany
            whose listeners must pass a DR10 Presence test or lose their next
            action.</p><div class="shape-title"><p>5. ICHOR OF
            ROT</p></div><p>Your rotting god’s foul fluids seep from your hands-
            a black stigmata. As a DR12 attack you can wipe your hands on an
            assailant’s bare skin, who must pass a DR12 Toughness test or
            descend into frothing spasms for two turns.</p><div
            class="shape-title"><p>6. MY BODY, A VESSEL</p></div><p>Your god may
            be dead but what is death to a god? Once a day you may allow you
            god’s ghost to enter your flesh and reveal a truth—one yes/no
            question to the GM which must be answered truthfully. The god
            departs leaving you weakened and frail.</p><div
            class="shape-title"><p>7. IN DEATH I LIVE</p></div><p>When you die,
            make a DR14 Presence test. If you pass, your god refuses your
            passage into the afterlife and you recover with 1HP. Otherwise, your
            body is consumed in holy flames.</p><div class="shape-title"><p>8.
            EYES OF HOLY FIRE</p></div><p>Your pupils burn with your lord’s
            soul. Once per combat you may attack (DR10) spurting fire from your
            eyes (d6 damage); blinding yourself for the fight’s
            duration.</p><p></p></div></div></div>
