        image: {}
        text:
          format: 1
          content: >-
            <div class="the-game starting-equipment"><p class="in-this-world">In
            this world there are those who seek riches or redemption. Some say
            the apocalypse is escapable, that it might even be stopped. And
            there you walk in discord and despair. One hand holds <span
            class="rollable rocker" data-roll="2d6*10">2d6 x 10</span> <span
            class="rocker">silver (s)</span>, the other holds a <span
            class="rocker">waterskin</span> and <span class="rollable rocker"
            data-roll="1d4">d4 days</span> worth of <span
            class="rocker">food</span>. Your soul and your silver are your own
            and equally easy to lose. To begin with, you are what you
            own:</p><div class="cols"><div class="col"><div
            class="roll-die"><p>d6@DRAW[Compendium.morkborg.mork-borg-tables.ByN7RI3Vc88ScBCj]{Starting
            Equipment
            (1)}</p></div><ol><li>nothing</li><li>nothing</li><li><em>backpack</em>
            for 7 normal-sized items</li><li><em>sack</em> for 10 normal-sized
            items</li><li><em>small wagon</em> or one item above of your
            choice</li><li><em>donkey</em>, not bad. Or one of the above of your
            choice</li></ol></div><div class="spacer-col"><p></p></div><div
            class="col"><div
            class="roll-die"><p>d12@DRAW[Compendium.morkborg.mork-borg-tables.o6wjXShp2CLQEr7X]{Starting
            Equipment (2)}</p></div><ol><li><em>rope</em> 30
            feet</li><li>Presence + 4 <em>torches</em></li><li><em>lantern</em>
            with oil for Presence + 6 hours</li><li><em>magnesium
            strip</em></li><li>random <em>unclean scroll</em></li><li>sharp
            needle</li><li><em>medicine chest</em> Presence+4 uses (stops
            bleeding/infection and heals d6 HP)</li><li><em>metal file and
            lockpicks</em></li><li><em>bear trap</em> (Presence DR14 to spot, d8
            damage)</li><li><em>bomb</em> (sealed bottle, d10 damage)</li><li>a
            bottle of <em>red poison</em> d4 doses (Toughness DR12 or d10
            damage)</li><li><em>silver crucifix</em></li></ol></div><div
            class="spacer-col"><p></p></div><div class="col"><div
            class="roll-die"><p>d12@DRAW[Compendium.morkborg.mork-borg-tables.rq8zq4VHY3px5hpF]{Starting
            Equipment (3)}</p></div><ol><li><em>life elixir</em> d4 doses (heals
            d6 HP and removes infection)</li><li>random <em>sacred
            scroll</em></li><li><em>small but vicious dog</em> (d6+2 HP, bite
            d4, only obeys you)</li><li>d4 <em>monkeys</em> that ignore but love
            you (d4+2 HP, punch/bite d4)</li><li><em>exquisite perfume</em>
            worth 25s</li><li><em>toolbox</em> 10 nails, tongs, hammer, small
            saw and drill</li><li><em>heavy chain</em> 15
            feet</li><li><em>grappling hook</em></li><li><em>shield</em> (-1 HP
            damage or have the shield break to ignore one
            attack)</li><li><em>crowbar</em> (d4 damage)</li><li><em>lard</em>
            (may function as 5 meals in a
            pinch)</li><li><em>tent</em></li></ol></div></div><p
            class="scrolls">Scrolls are the twisted magic of <span
            class="mork">MÖRK BORG</span>.<br>Read more on the Powers and
            Scrolls pages.</p></div>
