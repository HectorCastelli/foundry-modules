      - sort: 700000
        name: Traveling the Dying Lands
        type: text
        _id: 17ONluAhPx5LKd0E
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: "<div class=\"roads-to-damnation\"><div class=\"traveling-title\"><img title=\"Traveling the Dying Lands\" alt=\"Traveling the Dying Lands\" src=\"modules/morkborg-cult-feretory/assets/roads-to-damnation/traveling-the-dying-lands-title.webp\"></div><div class=\"these-are\"><p>These are <span class=\"yellow-highlight\">distancesin days spent traveling</span> between the harrowed land’s various locales. Traveling outside of known roads may take longer.</p></div><div class=\"world-map\"><img title=\"The Dying Lands\" alt=\"map of the dying lands\" src=\"modules/morkborg-cult-feretory/assets/roads-to-damnation/traveling-the-dying-lands.webp\"></div><div class=\"two-cols\"><div class=\"col\"><p>For a <strong>smaller world</strong>, halve the static modifier and drop the die size one step. For a larger one double everything.</p></div><div class=\"spacer-col\"><p>\_</p></div><div class=\"col\"><p>If the <strong>weather is unusually bad</strong>, travel can be slower than usual, doubling travel time.</p></div></div><p></p></div>"
