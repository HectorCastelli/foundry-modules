          content: "<div class=\"the-game powers\"><div class=\"content-wrapper\"><div class=\"title\"><p>Powers</p></div><p class=\"a-few\">A few so-called Powers are known and they are usually found written in scrolls.</p><div class=\"yellow-line\"><div><p>\_</p></div></div><p><span class=\"rollable\" data-roll=\"1d4\">Roll Presence + d4</span> every morning to determine how many times you can use Powers that day; choose from your available scrolls.</p><p></p><p>When reading a scroll, test <strong>Presence DR12</strong>. If you succeed, the Power is activated and you subtract one use from your daily total. If you fail, the Power doesn’t work, you <span class=\"rollable\" data-roll=\"1d2\">lose d2 HP</span> and you become dizzy for the next hour. During this time, Powers will always fail in the worst possible way.</p><p class=\"the-gm-decides\">The GM decides the effect on a Crit or Fumble, but there is an optional table of Arcane Catastrophes.</p></div></div>"
