      - sort: 6300000
        name: 6 - Occult Herbmaster
        type: text
        title:
          show: false
          level: 3
        image: {}
        text:
          format: 1
          content: >-
            <div class="the-game occult-herbmaster"><div class="title"><p>Occult
            Herbmaster</p></div><div class="intro"><p>Born of the mushroom,
            raised in the glade,<br>watched by the eye of the moon in a
            silverblack pool. <br><span class="create-scvm"
            data-uuid="Compendium.morkborg.mork-borg-items.59HKbdpBIXfiJt91">Make
            One</span></p></div><div class="begins-with"><p>Begins with <span
            class="rollable" data-roll="2d6*10">2d6 × 10s</span> and <span
            class="rollable" data-roll="1d2">d2 Omens</span>. HP: Toughness +
            <span class="rollable" data-roll="1d6">d6</span></p></div><div
            class="bottom-grid"><div class="abilities"><div
            class="abilities-title"><p>Abilities</p></div><p> Tough as wood,
            <span class="rollable" data-roll="3d6+2">roll 3d6+2</span>
            Toughness. Low in protein, <span class="rollable"
            data-roll="3d6-2">roll 3d6-2</span> Strength. Roll
            d6@DRAW[Compendium.morkborg.mork-borg-tables.qYznag89iDMdPH6A]{Starting
            Weapon}{1d6} on the weapons table and
            d2@DRAW[Compendium.morkborg.mork-borg-tables.Cyg5IvubZiDmCCUk]{Starting
            Armor}{1d2} on the armor table. You carry a portable laboratory and
            continually search for frequently expended ingredients. Daily you
            have the materials to create two randomly determined
            decoctions@DRAW[Compendium.morkborg.mork-borg-tables.9HXT5mQtNkSQB8lY]{Occult
            Herbmaster Decoctions} and can brew a total of <span
            class="rollable" data-roll="1d4">d4 doses</span>. If unused they
            lose vitality after 24 hours.</p></div><div
            class="decoctions"><ol><li><span class="name">Red Poison</span>
            Toughness DR12 or -d10 HP.</li><li><span class="name">Ezumiels
            Vapor</span> Pass a DR14 test or severe (and arguably fun)
            hallucinations for d4 hours.</li><li><span class="name">Southern
            Frog Stew</span> Vomit for d4 hours, pass a DR14 test or you can do
            nothing else.</li><li><span class="name">Elixir Vitalis</span> Heals
            d6 HP and stops infection. Can be habit-forming.</li><li><span
            class="name">Spider-Owl Soup</span> See in darkness, climb on walls
            for 30 minutes.</li><li><span class="name">Fernor’s Philtre</span>
            Translucent oil, must be dabbed right into the eye. Heals infection
            and gives +2 on Presence tests for d4 hours.</li><li><span
            class="name">Hyphos’ Enervating Snuff</span> Berserk! Two attacks
            per round but defend with DR14. Lasts one fight. Must be snorted,
            causes sneezing.</li><li><span class="name">Black Poison</span>
            Toughness DR14 or -d6 HP and blinded for one
            hour.</li></ol></div></div><div class="probably-raised-in"><div
            class="table-title"><p>Probably raised
            in...@DRAW[Compendium.morkborg.mork-borg-tables.LtCw0wObZAasFQkl]{Probably
            raised in}</p></div><p>1–3: calm isolation in the Sarkash
            dark.</p><hr><div class="table-title"><p>but may also come
            from</p></div><p>4: the illegal midnight markets of
            Schleswig.</p><p>5: the heretic isle of Crëlut,two nautical miles
            east of Grift.</p><p>6: the old frozen ruins not far from
            Alliáns.</p><p>7: a little witches cottage in Galgenbeck.</p><p>8:
            the ruins of the Shadow King’s manse, thick with memories of
            mushrooms and smoke.</p></div></div>
