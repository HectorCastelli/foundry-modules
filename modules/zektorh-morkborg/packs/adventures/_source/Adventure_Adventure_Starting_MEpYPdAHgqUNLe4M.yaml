            src="modules/morkborg-core/assets/gm-screen/traps-title.webp"></div><div
            class="you-triggered-the-trap"><div class="subtitle"><p>You
            triggered the trap
            by...@DRAW[Compendium.morkborg-core.core-tables.HtSmDkRgD90xqoaU]{You
            triggered the trap by...}</p></div><div
            class="trigger-grid"><div><p>... not leaving the room in
            time.</p></div><div><p>... talking too loudly.</p></div><div><p>...
            stepping on the wrong floor tile.</p></div><div><p>... taking a
            torch.</p></div><div><p>... touching a damned
            doorknob.</p></div><div><p>... opening a
            box/sarcophagus.</p></div><div><p>... pushing an alluring
            button.</p></div><div><p>... treading on the trip
            wire.</p></div><div><p>... turning the key.</p></div><div><p>...
            rattling your weapons.</p></div><div><p>... discussing a foul
            inscription.</p></div><div><p>... drinking Elixir Vitalis in a
            cursed room.</p></div><div><p>... stealing a prized
            item.</p></div><div><p>... lighting a lantern where gloom
            reigns.</p></div></div></div><div class="bottom-grid"><div
            class="whats-the-trap"><div class="subtitle"><p>What's the trap and
            its
            effect?@DRAW[Compendium.morkborg-core.core-tables.H73C7yvzUmPqyFCE]{What's
            the trap and its effect?}</p></div><ol><li><p><strong>Shimmering,
            bile-yellow poisonous gas.</strong> <br><em>Test Toughness DR18 or
            die. Test every minute.</em></p></li><li><p><strong>Poisonous darts
            shoot from wall-holes.</strong> <br><em>D2 damage. Test Toughness
            DR16 or die.</em></p></li><li><p><strong>Giant marble falls from the
            ceiling or from a ramp in an adjacent room.</strong> <br><em>Test
            Agility DR14 or die.</em></p></li><li><p><strong>Cruel creature is
            released from a hidden chamber.</strong>
            <br><em>Varying.</em></p></li><li><p><strong>Sharpened pole hits you
            from the side.</strong> <br><em> Fate decides. Roll a die: an odd
            result is d20 damage.</em></p></li><li><p><strong>Falling net.
            Something approaches.</strong> <br><em>Presence DR16 to
            escape.</em></p></li><li><p><strong>A Power affects you.</strong>
            <br><em>Varying.</em></p></li><li><p><strong>A pit opens under your
            feet.</strong> <br><em> 1-in-6 chance of impalement (instant death).
            Otherwise, d6 damage per 10’.</em></p></li><li><p><strong>Doors lock
            and water fills the room.</strong> <br><em>Better find a way
            out.</em></p></li><li><p><strong>Alarm goes off; something
            awakens.</strong> <br><em>Varying.</em></p></li><li><p><strong>The
            walls are closing in.</strong> <br><em>Better find a way out. 1-in-6
            chance that the walls get stuck ... if you’re
            lucky.</em></p></li><li><p><strong>Burning oil pouring from a
            ceiling cauldron.</strong> <br><em> Fate decides. Roll a die: an odd
            result is d12 damage.</em></p></li></ol></div><div
            class="right-col"><div class="who-or-what"><div
            class="subtitle"><p>Who or what built the
            trap?@DRAW[Compendium.morkborg-core.core-tables.JK10SXr6gxbuBCVu]{Who
            or what built the trap?}</p></div><ol><li>A slow, calculating
            grotesque.</li><li>An death-sentenced Uguth† mine-thrall.</li><li>A
            simple goblin.</li><li>A forgotten berserker king.</li><li>A
            deranged shadow being.</li><li>A bitter necromancer.</li><li>A dying
            troll mourning its mother.</li><li>A spiteful child from a torched
            village.</li><li>A slumbering, nebulous daemon.</li><li>A catacomb
            creatorʼs executioner.</li><li>An inveterate nail
            collector.</li><li>A cunning, crafty skeleton.</li><li>A bewildered
            wickhead.</li><li>A sickly, blind demigod.</li><li>A group of
            terrified goons.</li><li>A mindless death-cultist.</li><li>A witch
            lost in Labyrinth Lecht.‡</li><li>A bored, teeth-counting
            hermit.</li><li>A sadistic graveyard architect.</li><li>An anxious
            undead doll.</li></ol></div><div class="legend"><div
            class="flails"><img alt="flails"
            src="modules/morkborg-core/assets/gm-screen/traps-flails.webp"></div><div
            class="legend-grid"><div><p>†</p></div><div><p>A huge, no ...
            <em>ho-ha-MEGA</em>-catacomb in Bergen
            Chrypt.</p></div><div><p>‡</p></div><div><p>A mental labyrinth
            occasionally brought to semi-physical form by a creature’s prolonged
            pondering or mourning. Real enough for its traps and tricks to
            actually harm the creature.</p></div></div></div></div></div></div>
