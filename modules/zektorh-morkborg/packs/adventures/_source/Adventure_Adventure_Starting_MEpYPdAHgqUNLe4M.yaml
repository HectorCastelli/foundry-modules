      - sort: 5900000
        name: 4 - Wretched Royalty
        type: text
        title:
          show: false
          level: 3
        image: {}
        text:
          format: 1
          content: >-
            <div class="the-game wretched-royalty"><div
            class="title"><p>Wretched Royalty</p></div><div
            class="top-grid"><div class="intro"><p>Bowed down only by the
            memories of your own lost glory, you could never submit to anyone
            else. Not you, of noble blood! <span
            class="not-that-you-expect">(Not that you expect these peons to
            understand the depths of your sorrow.)</span> <span
            class="create-scvm"
            data-uuid="Compendium.morkborg.mork-borg-items.0h5xOAtzV4mm7X7D">Make
            One</span></p></div><div class="begins-with"><p>Begins with <span
            class="rollable" data-roll="4d6*10">4d6×10s</span> and <span
            class="rollable" data-roll="d2">d2 Omens</span>. HP: Toughness +
            <span class="rollable"
            data-roll="1d6">d6</span>.</p></div></div><div
            class="things-were-going-so-well"><div class="table-title"><p>Things
            were going so well, until...
            d6@DRAW[Compendium.morkborg.mork-borg-tables.5PHa1hE0xoXDp6zg]{Things
            were going so well until}</p></div><ol class="two-cols"><li>your
            Wästland palace was reduced to rubble.</li><li>your caravan kingdom
            of Tveland fell into penury.</li><li>King Fathmu IX’s brother
            Zigmund, your father, was murdered.</li><li>the southern empire of
            Südglans sank into the sea.</li><li>Anthelia demanded a gift of
            noble blood.</li><li>two young princes were kidnapped west of Bergen
            Chrypt and disappeared into the black crevasse of the eastern
            slopes.</li></ol></div><div class="abilities"><p>Painfully average,
            you adjust no abilities. Roll a
            d8@DRAW[Compendium.morkborg.mork-borg-tables.qYznag89iDMdPH6A]{Starting
            Weapon}{1d8} on the weapons table. Roll a
            d4@DRAW[Compendium.morkborg.mork-borg-tables.Cyg5IvubZiDmCCUk]{Starting
            Armor}{1d4} on the armor table but reroll if you receive heavy
            armor. You begin with two of the
            following:@DRAW[Compendium.morkborg.mork-borg-tables.DGt1ma2jv5VV6MRW]{Wretched
            Royalty Items}</p></div><div class="royalty-items"><div
            class="royalty-item"><div class="name"><p>1 The Blade of Your
            Ancestors</p></div><div class="text"><p>This magnificent and clearly
            magical talking sword is foppish, unreliable and quietly despises
            you. It taunts your failures and, if continually disappointed,
            develops a 1 in 6 chance to ‘accidentally’ attack you or your
            companions. Deals d6+1 damage. Attack/Defence DR is
            10.</p></div></div><div class="royalty-item"><div class="name"><p>2
            ‘Poltroon’ the Court Jester</p></div><div class="text"><p>While
            practically useless, personally irritating and an emotional drain,
            Poltroon’s capering actually makes enemies lose their focus in
            combat. For the first two rounds you and your allies get +2 on
            attack/defense.</p></div></div><div class="royalty-item"><div
            class="name"><p>3 Barbarister the Incredible Horse</p></div><div
            class="text"><p>Barbarister is magical, intelligent, arrogant and
            vain. He can also talk. If you can persuade him to care, Barbarister
            occasionally adds +2 to Presence tests involving logic and
            intellect. The horse may be smarter than you and is quite aware of
            this.</p></div></div><div class="royalty-item"><div
            class="name"><p>4 Hamfund the Squire</p></div><div
            class="text"><p>This intensely cowardly servant acts only as
            guardian for the scabbard of the cursed sword Eurekia. Once per
            combat, if Ham can be found, Eurekia may be drawn. The sword does
            2d6 damage, and for every swing of Eurekia roll a d6. On a 1 the
            squire is slain and Eurekia vanishes forever.</p></div></div><div
            class="royalty-item"><div class="name"><p>5 The Snake-Skin
            Gift</p></div><div class="text"><p>An expensive sandalwood box bound
            in snakeskin. It contains a seemingly ordinary dagger, wrapped in
            silk. The dagger does d4 damage but on a 1 the target dies
            immediately of deadly poison weeping from the
            blade.</p></div></div><div class="royalty-item"><div
            class="name"><p>6 Horn of the Schleswig Lords!</p></div><div
            class="text"><p>Once per day release a blare from this dented old
            trumpet and test Presence DR12. One creature may make their next
            non-combat test an automatic success.</p></div></div></div></div>
