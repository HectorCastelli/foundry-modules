          content: >-
            <div class="the-game carrying-capacity"><div
            class="content-wrapper"><div class="title"><p>CARRYING
            CAPACITY</p></div><p class="you-can-carry">You can carry <span
            class="pink-bg white">Strength+8</span> normal-sized items (<em>for
            example</em> crowbars, lard, scrolls, torches <em>but not</em>
            anvils, chests, ladders, corpses) without a problem. After that when
            testing Strength and Agility DR increases by 2 (from 12 to 14 etc.).
            It is impossible to carry more than twice
            Strength+8.</p></div></div>
