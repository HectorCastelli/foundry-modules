            <div class="eat-prey-kill creatures"><div
            class="region-title"><p>Kergüs@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.bgEjFHqHohjog5vy]{Kergüs}</p></div><div
            class="two-cols"><div class="col"><div class="creature-image"><img
            title="Tar-Pelted Goats"
            src="modules/morkborg-cult-feretory/assets/eat-prey-kill/tar-pelted-goats.webp"></div><div
            class="creature-block"><h2>Tar-Pelted Goats</h2><div
            class="description"><p><span class="num">2</span>
            @UUID[Compendium.morkborg-cult-feretory.feretory-actors.aEpdzhPc8gQ2x3Mx]{Tar-Pelted
            Goats} <span class="name rollable" data-roll="1d8">(D8)</span> <span
            class="text">have thick, warm charcoal-colored fur and smell of
            freshly tar-coated wooden ships. It’s a shame the meat tastes like
            sulfur and vomit.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 6, <strong>Morale</strong>
            7, <strong>Fur</strong> -d2, <strong>Horns</strong>
            d6</p></div></div><p></p><div class="creature-block"><h2>Molar
            Bear</h2><div class="description"><p><span class="num">3</span>
            <span class="text">Being eaten by a
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.8Q44CjQtw21XKkXd]{Molar
            Bear} <span class="text">is allegedly among the most grueling ways
            to go. Their teeth may not be made for biting but sure are made for
            chewing.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 16,
            <strong>Morale</strong> -, <strong>Thick fur</strong> -d4,
            <strong>Claws</strong> d8</p></div></div><p></p><div
            class="creature-block"><h2>Blubber Gulls</h2><div
            class="description"><p><span class="num">5</span>
            @UUID[Compendium.morkborg-cult-feretory.feretory-actors.q3X8PRfK6cZYjNWc]{Blubber
            Gulls} <span class="text">look like flying balls of fat but make
            good soup and you can use the gas-filled corpses as
            buoys.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 2, <strong>Morale</strong>
            -, <strong>Blubber</strong> -d2, <strong>Beak/Dive Bomb</strong>
            d2/special</p><p><strong>Special:</strong> When threatened either
            flees or dives (50%) towards its attacker, blowing itself up,
            dealing d8 damage to anyone within 5’.</p></div></div></div><div
            class="spacer-col"><p></p></div><div class="col"><div
            class="creature-block"><h2>Flail-Horned Muskox</h2><div
            class="description"><p><span class="num">1</span> <span
            class="text">The
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.tovQQ4cYmzHambia]{Flail-Horned
            Muskox} <span class="text">moves in herds of d12, dragging horns on
            keratin chains. Your best bet is going for the oldest and slowest in
            the back of the chain gang. So you won’t have to fight the entire
            herd but also means you fight the biggest horned
            one.</span></p></div><div class="stat-block"><p><strong>HP</strong>
            18, <strong>Morale</strong> 9, <strong>Fur</strong> -d2,
            <strong>Flail-horns</strong> special</p><p><strong>Special:</strong>
            Makes four attacks in a flurry of whirling chains and horns at
            randomly chosen targets:</p><div class="two-cols muskox-table"><div
            class="col"><p><strong>to
            avoid</strong><br>DR16<br>DR14<br>DR12<br>DR10</p></div><div
            class="spacer-col"><p></p></div><div
            class="col"><p><strong>damage</strong><br>d4<br>d6<br>d8<br>d10</p></div></div></div></div><p></p><div
            class="creature-block"><h2>Megasloths</h2><div
            class="description"><p><span class="num">4</span>
            @UUID[Compendium.morkborg-cult-feretory.feretory-actors.8gFk0DSflJ32v1O3]{Megasloths}
            <span class="text">are a rare sight on the ice fields and sometimes
            confused for snow-mounds. You’re not liable to make that mistake
            facing one in combat—they can run when they choose
            to.</span></p></div><div class="stat-block"><p><strong>HP</strong>
            30, <strong>Morale</strong> 9, <strong>Thick fur</strong> -d2,
            <strong>Scythe-claws</strong> d10</p></div></div><p></p><div
            class="creature-block"><h2>False Seal</h2><div
            class="description"><p><span class="num">6</span> <span
            class="text">The
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.cfLY9N11Qnhhhfo6]{False
            Seal} <span class="text">looks almost like a regular seal because it
            is one’s corpse housing a puppeteering seal-proportioned spider.
            Attacking the False Seal angers this very dangerous
            arachnid.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 22,
            <strong>Morale</strong> 9, <strong>Exoskeleton</strong> -d4,
            <strong>Bite</strong> d6 + special</p><p><strong>Special:</strong>
            Pass a DR16 Toughness test or your body rejects any food until you
            imbibe the spider’s venom- gland as
            antidote.</p></div></div></div></div></div>
