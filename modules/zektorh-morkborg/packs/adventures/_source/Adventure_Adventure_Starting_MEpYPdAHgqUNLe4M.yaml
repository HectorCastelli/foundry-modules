      - sort: -375000
        name: Forty city events
        type: text
        _id: 0XaKEgB7j5oPLfTf
        title:
          show: false
          level: 1
        image: {}
        text:
          format: 1
          content: "<div class=\"gm-screen forty-city-events\"><div class=\"title\"><p>Forty city events</p></div><div class=\"events-grid\"><div class=\"header\"><p>d4</p></div><div class=\"header\"><p>d10</p></div><div class=\"header\"><p>What filth does the city vomit?@DRAW[Compendium.morkborg-core.core-tables.YtncH6f4JwHsLybM]{Forty city events}</p></div><div><p>1</p></div><div><p>1</p></div><div><p>Exhausted corpse-carter heading for the graves with a full load.</p></div><div><p>\_</p></div><div><p>2</p></div><div><p>d4 nobles promenading, beating people beneath them with gilded clubs.</p></div><div><p>\_</p></div><div><p>3</p></div><div><p>Travelling weed-merchant asking for directions to the Seer’s.</p></div><div><p>\_</p></div><div><p>4</p></div><div><p>Urchin painting <em>“LISTEN!”</em> with goat’s blood on a wall.</p></div><div><p>\_</p></div><div><p>5</p></div><div><p>Passing wastecart/barge. The stench is unbearable.</p></div><div><p>\_</p></div><div><p>6</p></div><div><p>Melancholic melodies from a broke, starving gutter bard.</p></div><div><p>\_</p></div><div><p>7</p></div><div><p>There’s a dead body in the street. Not even the dogs seem to care.</p></div><div><p>\_</p></div><div><p>8</p></div><div><p>Poor child crying in a corner. Lost, cold and alone.</p></div><div><p>\_</p></div><div><p>9</p></div><div><p>The sudden cacophony of wings and croaks. A murder of crows.</p></div><div><p>\_</p></div><div><p>10</p></div><div><p>Heavy rain. The streets are cleared as people seek shelter.</p></div><div><p>\_</p></div><div><p>\_</p></div><div><p>\_</p></div><div><p>2</p></div><div><p>1</p></div><div><p>Fishmonger trying to fend off a pack of stray cats.</p></div><div><p>\_</p></div><div><p>2</p></div><div><p>Procession of masked flagellants. Cursing and screaming.</p></div><div><p>\_</p></div><div><p>3</p></div><div><p>Decadent acrobats, high and witless. Almost break their necks.</p></div><div><p>\_</p></div><div><p>4</p></div><div><p>Family desperately trying to rebuild their burnt hovel.</p></div><div><p>\_</p></div><div><p>5</p></div><div><p>Old man slumped against a wall. Panting, grabbing his heart.</p></div><div><p>\_</p></div><div><p>6</p></div><div><p>Hopelessly depressed farmer stares at the sky. Has lost everything.</p></div><div><p>\_</p></div><div><p>7</p></div><div><p>Heartbroken young fool seeking comfort in alley-found dregs.</p></div><div><p>\_</p></div><div><p>8</p></div><div><p>Huge load of trash and waste splashes down, thrown from a window.</p></div><div><p>\_</p></div><div><p>9</p></div><div><p>Old woman lying in the gutter. Someone stole her crutch.</p></div><div><p>\_</p></div><div><p>10</p></div><div><p>Drunken clerk stumbling, falling. Scrolls and maps everywhere.</p></div><div><p>\_</p></div><div><p>\_</p></div><div><p>\_</p></div><div><p>3</p></div><div><p>1</p></div><div><p>Rags-clad people fighting over bread. Guards watching. Placing bets.</p></div><div><p>\_</p></div><div><p>2</p></div><div><p>Peglegged sailor stops the PCs to brag about the Angloarfish.</p></div><div><p>\_</p></div><div><p>3</p></div><div><p>Laborers carrying a boat-size casket to an anonymous priest.</p></div><div><p>\_</p></div><div><p>4</p></div><div><p>Penniless carpenter (so they say) trying to sell a worn crutch.</p></div><div><p>\_</p></div><div><p>5</p></div><div><p>Patron violently escorted from a pub. Then robbed. Then stabbed.</p></div><div><p>\_</p></div><div><p>6</p></div><div><p>A chittering wave of a hundred rats scurry across the street.</p></div><div><p>\_</p></div><div><p>7</p></div><div><p>Group of ragtag scum playing Three Dead Skulls with weighted dice.</p></div><div><p>\_</p></div><div><p>8</p></div><div><p>Suddenly, a crossbow bolt hits a nearby door. Someone is practicing.</p></div><div><p>\_</p></div><div><p>9</p></div><div><p>Around the corner, a giant tree with a dozen hanged heretics.</p></div><div><p>\_</p></div><div><p>10</p></div><div><p>Twenty people keeping warm around a bonfire. <em>One is a Grift spy.</em></p></div><div><p>\_</p></div><div><p>\_</p></div><div><p>\_</p></div><div><p>4</p></div><div><p>1</p></div><div><p>People keeping distance from a rabid dog rummaging in the trash.</p></div><div><p>\_</p></div><div><p>2</p></div><div><p>Three hardened mercenaries pull a dead troll across the street.</p></div><div><p>\_</p></div><div><p>3</p></div><div><p>Severely hungover chaplain cursing the state of things.</p></div><div><p>\_</p></div><div><p>4</p></div><div><p>The smell of dry snuff, herbs and hash from a crowded market.</p></div><div><p>\_</p></div><div><p>5</p></div><div><p>Two monkeys eating what’s left of a dead raven.</p></div><div><p>\_</p></div><div><p>6</p></div><div><p>Explosion! Smoke and screams from a ruined alchemist’s workshop.</p></div><div><p>\_</p></div><div><p>7</p></div><div><p>Demagogue yelling about prophecy falsehood. Guards on their way.</p></div><div><p>\_</p></div><div><p>8</p></div><div><p>Devastated, eyeless peasant in a pillory. Begs for water.</p></div><div><p>\_</p></div><div><p>9</p></div><div><p>Well-used, rusty guillotine being repaired and cleaned.</p></div><div><p>\_</p></div><div><p>10</p></div><div><p>Occultist placing copper coins in intricate patterns.</p></div></div></div>"
