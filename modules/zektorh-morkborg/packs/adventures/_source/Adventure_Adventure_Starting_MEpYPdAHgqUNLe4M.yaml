      - sort: 5000000
        name: Arcane Catastrophes
        type: text
        title:
          show: false
          level: 3
        image: {}
        text:
          format: 1
          content: >-
            <div class="the-game arcane-catastrophes"><div
            class="title"><p>Arcane Catastrophes<span class="die-roll">
            d20@DRAW[Compendium.morkborg.mork-borg-tables.Zxq0ndUQsBDdc2HW]{Arcane
            Catastrophes}</span></p></div><div class="intro"><p>You read it
            wrong you illiterate fool! Effects in <em>pink italic</em> are
            things the caster might not immediately realize. A caster who rolls
            the same result twice explodes in screaming black fire in which the
            faces of the dead are seen. <span class="rollable"
            data-roll="1d6">D6 damage</span> each round. Water only feeds this
            fire.</p></div><ol class="catastrophes two-cols"><li>One by one your
            teeth fall out. Long, brittle fingernails replace them in your gums.
            <em>Your smile is horrific and you find it hard to
            eat.</em></li><li>You feel fine. It’s <strong>fine.</strong> <em>You
            pustulate with a magical STD. Those intimate with you will die of
            plague within d4 days then rise as woeful weeping zombies who track
            you down in your dreams before finding you in
            reality.</em></li><li>Your skeleton is possessed by some unearthly
            force and will do anything to kill you and escape. Drowning or
            piercing is preferred so the bones are not damaged. <strong>Test
            Strength DR10</strong> in stressful situations or take d4 damage.
            <em>When you die, you become a zombie.</em></li><li>The illusion of
            the celestial sphere is lifted, you now see what dwells beyond. And
            it sees you. Gazing upon a clear night sky drives you mad with
            fear.</li><li>Around you falls an unending snow of black ash which
            only you and the mad can perceive. <em>Water sickens you from this
            day on. Only ash, soot or burnt remains can quench your
            thirst.</em></li><li><p>The earth decays around you like wet flesh.
            You sink 3 feet and cannot climb out without help. Clinging to you,
            screaming and biting are d4 translucent, crayfish-like children with
            your face.</p><hr><p class="stat-block"><strong>HP</strong> 3
            <strong>Morale</strong> - <strong>No armor</strong>
            <strong>Bite/pinch</strong> d4</p></li><li>Your skin tatters like
            paper, your flesh melts like wax and your intestines bloat like
            balloons, bursting and falling out until all that is left is a
            walking, talking skeleton.</li><li>A gnashing gaptoothed mouth
            splits open on your neck. It spits out your secrets and inner
            thoughts <em>and can be silenced to sleep only with
            blood.</em></li><li>The sky warps and stars spin like wheels. Thrown
            one day into the future, you arrive vomiting Time as evaporating
            silver bile. <em>A Misery is fulfilled.</em></li><li>Light itself
            despises you. If you gaze upon a candle, lamp or torch it goes
            out.</li><li><em>Within d4 days a vile cocoon heaves from the
            ground, soon bursting and spawning your exact clone. It is
            unintelligent and begins to spread mischief and suffering. This
            happens every couple of days until the ground is cleansed with holy
            water or fire.</em></li><li>Your eyes burn with insufferable agony,
            bleeding heavily before loosening and falling from their gory pits.
            You continue to see through them wherever they are.</li><li>You and
            a random nearby creature pass out. <em>When you wake up, your souls
            have switched. Welcome to your new flesh.</em></li><li>Five twisted,
            skeletal arms burst from your back. The hands are mischievous,
            violent and terribly cruel.</li><li>Your skin pales then begins to
            emit a sickly greenish light. <em>Living things held close to you
            slowly fall ill. They weaken, their bones become brittle, their
            teeth and hair fall out.</em></li><li>The Power works, but fate or a
            demonic force perverts its effects to your precise
            disadvantage.</li><li>The scroll crumbles to tendrils of fine black
            powder which reach for your nose and mouth. Make a <strong>DR14
            Toughness test</strong> or lose d10 HP.</li><li>The Power pierces
            you like a knife, feeding on your anima. You are permanently gaunt
            and drawn, insatiably hungry. <em>When resting you restore only half
            of the rolled HP.</em></li><li><p>You fall through
            <strong>Refva</strong> into the esoteric dimension of Cube-Violet, a
            place of mythical obscurity. The walls are smooth, iridescent and
            cold. Above, an endless inferno. To leave (d4):</p><ol
            class="to-leave-refva"><li>Slay riddling Kulvan (strong goblin, page
            58) who holds three colorless pearls.</li><li>Poison a close friend
            with crumbled Sict-Shroom (Toughness DR16 or -d6 HP and
            hallucinations). They are found only within the cube.</li><li>Reach
            up through the fire to the golden key above. d4 fingers burn to
            ash.</li><li>The cube is perfect, and empty. You can only wait in
            maddening timeless silence until another fool
            arrives.</li></ol></li><li>Perhaps it’s for the best.
            <strong>HE</strong> emerges from the shadows. At least your
            suffering is short, almost instantaneous, as the two-headed basilisk
            devours you.</li></ol></div>
