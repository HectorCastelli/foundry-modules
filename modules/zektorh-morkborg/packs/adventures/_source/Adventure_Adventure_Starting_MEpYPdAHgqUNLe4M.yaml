      - sort: 3500000
        name: Rest, Reaction & Morale
        type: text
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <div class="the-game rest-reaction-morale"><div
            class="content-wrapper"><div class="section"><h2
            class="subtitle">Rest</h2><p>Catch your breath, have a drink.
            Restore <strong class="rollable" data-roll="1d4">d4 HP</strong>.
            <br>A full night’s sleep restores <strong class="rollable"
            data-roll="1d6">d6 HP</strong>. <br>Without food or drink no HP is
            restored when resting and after two days a starving PC loses <strong
            class="rollable" data-roll="1d4">d4 HP</strong> per day.</p><p
            class="indented"><span class="white">An infected character</span>
            does not benefit from resting. Instead, <strong class="rollable"
            data-roll="1d6">d6 HP</strong> is lost daily.</p></div><div
            class="section"><h2 class="subtitle">Reaction</h2><p>When meeting
            creatures whose reaction is uncertain.</p><p></p><p><span
            class="rollable" data-roll="2d6">Roll 2d6</span></p><div
            class="reaction-grid"><div><p>2–3</p></div><div><p>Kill!</p></div><div><p>4–6</p></div><div><p>Angered</p></div><div><p>7–8</p></div><div><p>Indifferent</p></div><div><p>9–10</p></div><div><p>Almost
            friendly</p></div><div><p>11–12</p></div><div><p>Helpful</p></div></div></div><div
            class="section"><h2 class="subtitle">Morale</h2><p>Most enemies will
            not fight to the last drop of blood. <br><span class="rollable"
            data-roll="2d6">Roll for morale</span> if <span class="white">the
            leader is killed <br>half the group is eliminated <br>a single enemy
            has only 1/3 of its HP left</span></p><p>If you roll greater than
            the creature’s Morale value with 2d6, it is
            <strong>demoralized</strong>. <span class="rollable"
            data-roll="1d6">Roll d6</span> to see if the enemy (1–3) flees or
            (4–6) surrenders.</p></div></div></div>
