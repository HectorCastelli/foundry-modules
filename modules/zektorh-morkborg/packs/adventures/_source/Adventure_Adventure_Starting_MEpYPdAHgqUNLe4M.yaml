        text:
          format: 1
          content: >-
            <div class="feretory what-is-this"><div class="page-title"><p>What
            is this?</p></div><div class="mork-borg-is"><p><span
            class="mork-borg-name">MÖRK BORG</span> is a roleplaying game about
            miserable bastards, tomb-robbers and heretics enduring a bleak and
            dying world. The MÖRK BORG CULT is our community content program
            where anyone can create stuff and send it our way. If we like it we
            edit it, make art and lay it out for free download on morkborg.com.
            MÖRK BORG CULT: FERETORY compiles such content, along with other,
            official things. Hope you like it.</p></div><div
            class="content-title"><p>CONTENT</p></div><div class="toc"><div
            class="col"><div
            class="toc-item"><p>@UUID[JournalEntry.PmTN25xmc2akx1tv.JournalEntryPage.sYoLwnn3coKZecip]{Monster
            Generator}</p></div><div
            class="toc-item"><p>@UUID[JournalEntry.PmTN25xmc2akx1tv.JournalEntryPage.ILegFyqOTofL9oD0]{Roads
            to Damnation}</p></div><div
            class="toc-item"><p>@UUID[JournalEntry.PmTN25xmc2akx1tv.JournalEntryPage.AvzH6BnbEzisjcK0]{Eat
            Prey Kill}</p></div><div
            class="toc-item"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-adventures.u9dm0XlgrwXorg44]{The
            Death Ziggurat}</p></div><div
            class="toc-item"><p>@UUID[JournalEntry.PmTN25xmc2akx1tv.JournalEntryPage.cYPBqmSDDz08rQBE]{d1oo
            Items and Trinkets}</p></div><div
            class="toc-item"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-adventures.IlitAjyeiS7pVbyE]{The
            Goblin Grinder}</p></div><div
            class="toc-item"><p>@UUID[JournalEntry.PmTN25xmc2akx1tv.JournalEntryPage.DLDIU7oA6XyhAoIr]{The
            Tenebrous Reliquary}</p></div></div><div class="col"><div
            class="toc-item"><p>@UUID[JournalEntry.PmTN25xmc2akx1tv.JournalEntryPage.Egh9DjZcQWJjtb6e]{The
            Grey Galth Inn}<span class="asterix">*</span></p></div><div
            class="toc-item"><p>@UUID[JournalEntry.PmTN25xmc2akx1tv.JournalEntryPage.87vl3LgSYAYF2hWi]{Cursed
            Skinwalker}</p></div><div
            class="toc-item"><p>@UUID[JournalEntry.PmTN25xmc2akx1tv.JournalEntryPage.5qhFeuzPiGefmAgR]{Pale
            One}</p></div><div
            class="toc-item"><p>@UUID[JournalEntry.PmTN25xmc2akx1tv.JournalEntryPage.GFYR2Haam4lvr7RF]{Dead
            God's Prophet}</p></div><div
            class="toc-item"><p>@UUID[JournalEntry.PmTN25xmc2akx1tv.JournalEntryPage.XtmR3ol8X21xadAI]{Forlorn
            Philosopher}<span class="asterix">*</span></p></div><div
            class="toc-item"><p>@UUID[JournalEntry.PmTN25xmc2akx1tv.JournalEntryPage.SAgxQFQhocf8FD2W]{Tablets
            of Ochre Obscurity}<span class="asterix">*</span></p></div><div
            class="toc-item"><p>@UUID[JournalEntry.PmTN25xmc2akx1tv.JournalEntryPage.i1CgZTqknNUhOnrS]{The
            Black Salt}<span class="asterix">*</span></p></div></div></div><div
            class="made-by"><p>MÖRK BORG is made by Pelle Nilsson and Johan
            Nohr. The content in this zine is made by a lot of talented people.
            Items marked with * are written by Pelle Nilsson and edited by
            Patrick Stuart. Art and graphic design by Johan Nohr. Proofreading
            and editing by Fiona Maeve Geist and Jarrett Crader of MoonRat
            Conspiracy.</p></div><div class="logos"><img title="MÖRK BORG"
            src="modules/morkborg-cult-feretory/assets/feretory/logos/mork-borg.svg"><img
            title="Ockult Örtmästare Games"
            src="modules/morkborg-cult-feretory/assets/feretory/logos/ockult-ortmastare-games.svg"><img
            title="Stockholm Kartell"
            src="modules/morkborg-cult-feretory/assets/feretory/logos/stockholm-kartell.svg"><img
