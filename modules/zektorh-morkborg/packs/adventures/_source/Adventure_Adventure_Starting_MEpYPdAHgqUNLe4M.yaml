      - sort: 1400000
        name: Grift
        type: text
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <div class="the-dying-world grift"><div class="content-wrapper"><img
            class="title" title="Grift" alt="Grift"
            src="modules/morkborg-core/assets/the-dying-world/grift-text.webp"><p>From
            ages past, Grift grew upon an eastern peninsula of the Endless Sea.
            Cut from the world by the bottomless Múr, the thriving city state
            can be reached only by three bridges of such might and cyclopean
            size it is said that only enslaved giants could have raised them.
            Grift was once a place of harmony and the light of reason, a shelter
            from the plaguewracked, war-torn world beyond.</p><p
            class="second">But the world turns and even the Múr cannot protect
            Grift from its inevitable fall.</p><p></p><p><strong>King Sigfúm the
            Kind</strong> is mocked in the street. Much of Grift has fallen into
            disrepair as vile creatures begin crawling from the dried, cracked
            earth. Each night the bridges scream and roar like great ships
            grinding upon rocks. Sigfúm is defeated. He knows the end is near,
            believes the prophecies of Verhu and so, kindly and calmly, prepares
            his people for death. Huge parchments dot the streets, calendars of
            despair marking each correct preparation and its time. Each day a
            leaf is turned and when the last page comes, Sigfúm will march his
            people to the cliff Terion to fulfill what was written. Terion, a
            thousand meters of vertical rock with the raging sea biting at its
            base.</p><p></p><p class="bottom">The inquisition of the Two-Headed
            Basilisks is not too keen on the heretical suicide scheme of Sigfúm
            the Kind.</p></div></div>
