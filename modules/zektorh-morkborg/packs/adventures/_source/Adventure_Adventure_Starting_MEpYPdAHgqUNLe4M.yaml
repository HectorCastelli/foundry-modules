        image: {}
        text:
          format: 1
          content: >-
            <div class="eat-prey-kill creatures"><div
            class="region-title"><p>Grift@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.bgGhaCBy9VfSN18r]{Grift}</p></div><div
            class="two-cols"><div class="col"><div
            class="creature-block"><h2>Uncommon Rats</h2><div
            class="description"><p><span class="num">1</span>
            @UUID[Compendium.morkborg-cult-feretory.feretory-actors.csP94XYwOajrb84j]{Uncommon
            Rats} <span class="name rollable" data-roll="1d4">(D4)</span> <span
            class="text">are commonly seen on Grift’s streets. Like large hounds
            with twice the spite and thrice the teeth.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 6, <strong>Morale</strong>
            -, <strong>Bite/Claws</strong> d8/d6</p></div></div><p></p><div
            class="creature-block"><h2>Cellar Crabs</h2><div
            class="description"><p><span class="num">2</span> <span
            class="text">Despite their name,
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.6gvKfiL6jJg27bpH]{Cellar
            Crabs} <span class="name rollable" data-roll="1d4">(D4)</span> <span
            class="text">are found in numerous cold, dark places. When you hear
            their 20 inch legs clickety clack on the stone floor you know it’s
            time to leave.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 6, <strong>Morale</strong>
            -, <strong>Shell</strong> -d4, <strong>Bite/Claws</strong>
            d6</p></div></div><p></p><div
            class="creature-block"><h2>Straw-Lion</h2><div
            class="description"><p><span class="num">4</span> <span
            class="text">The
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.UEEXay9gbDSEYsrR]{Straw-Lion}
            <span class="text">hides in piles of hay, waiting to use its pincers
            and grabby claws to pull its prey into its lobotomizing maw. It eats
            the brain and discards the rest.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 14,
            <strong>Morale</strong> -, <strong>Exoskeleton</strong> -d6,
            <strong>Pincers/Jaws</strong>
            special/d8</p><p><strong>Special:</strong> DR14 Agility test or be
            pulled into the Straw-Lion’s toothy jaws, taking d8 damage instantly
            and on every round until you pass a DR18 Strength test or the lion
            dies. If you’re broken or hit negative HP while inside the beast’s
            maws but are rescued that same round you’re not killed but a
            half-botched lobotomy grants -3 Presence.</p></div></div></div><div
            class="spacer-col"><p></p></div><div class="col"><div
            class="creature-image"><img title="Nameless &amp; Tameless Stray"
            src="modules/morkborg-cult-feretory/assets/eat-prey-kill/nameless-and-tameless-strays.webp"></div><div
            class="creature-block"><h2>Nameless &amp; Tameless Strays</h2><div
            class="description"><p><span class="num">3</span> <span
            class="text">Grift’s streets house many
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.SaVtu2vmUhlhgIOL]{Nameless
            &amp; Tameless Strays} <span class="name rollable"
            data-roll="1d8">(D8)</span> <span class="text">eating nothing, yet
            everything, given the chance.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 4, <strong>Morale</strong>
            -, <strong>Bite</strong> d4</p></div></div><p></p><div
            class="creature-block"><div class="description"><h2>Lentil
            Lice</h2><p><span class="num">5</span> <span class="text">No silly,
            </span><span class="name">LENTIL LICE</span> <span
            class="text">don’t eat you from the inside—until you’re dead! ‘Til
            then they wait. Oh, and they’re the size of rice, so you’ll need at
            least a corpse’s worth to feed a hungry party. Lucky you found one!
            Unlucky that someone else found it first. Now you’ll have to fight
            </span><span class="rollable name">d6</span>
            @UUID[Compendium.morkborg-cult-feretory.feretory-actors.QETv4Z7ObEofiHS2]{Starved
            Peasants} for the good stuff!</p></div><div
            class="stat-block"><p><strong>HP</strong> 4, <strong>Morale</strong>
            7, <strong>Knife/femur</strong> d4</p></div></div><p></p><div
            class="creature-block"><div class="description"><h2>Múrder
            Gull</h2><p><span class="num">6</span>
            @UUID[Compendium.morkborg-cult-feretory.feretory-actors.xrrq39jIkgfO6eHO]{Múrder
            Gulls} <span class="name rollable" data-roll="1d20">(D20)</span>
            <span class="text">dig hollows along the Múr’s banks with sawtooth
            beaks and sticky putty spewn from their
            gullets.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 2, <strong>Morale</strong>
            -, <strong>Beak</strong> d4</p></div></div></div></div></div>
