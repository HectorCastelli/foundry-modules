      - sort: 1800000
        name: Valley of the Unfortunate Undead
        type: text
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <div class="the-dying-world valley-of-the-unfortunate-undead"><div
            class="text-grid"><div class="top"><p class="intro">A place few wish
            to speak of is the</p><div class="title"><p>Valley</p><p
            class="of-the">of<br>the</p><p>Unfortunate
            Undead.</p></div><p>Rumors whisper the basilisk <span
            class="he">HE</span> is coiled within its crypts, a sight
            infrequently survived. Lies and legends enshroud the valley,
            obscuring any truth. Peddler’s tales say the soil, the very air, is
            lethal—bringing a sleepless, stumbling death. This is no clean fate
            but a slow-growing, fathomless despair, weighing down the traveler
            with poisoned memories and dark thoughts until the spark of life is
            mutated into a mournful, hopeless undeath.</p></div><div
            class="bottom-left"><p class="big-o">Others claim lost wanderers can
            fall and find themselves in the Realm of the Dead when the black
            soil hungrily drags them under the earth.</p></div><div
            class="bottom-right"><p class="pink">Those without hope travel here
            seeking an end to pain, a golden afterlife beyond this dark and
            ruined world. They gather in suicide cults and the valley’s few
            twisted trees begin to droop strange fruit from hempen rope. Others
            plumb the crypts seeking Verhu, believing they can persuade him of
            other fates. Some simply and stupidly leave gifts and sacrifices to
            a power they cannot comprehend. Gloom grows, obscuring the world
            like an oil-stained image.</p></div></div><img class="people"
            title="Valley of the Unfortunate Undead People" alt="Valley of the
            Unfortunate Undead People"
            src="modules/morkborg-core/assets/the-dying-world/valley-of-the-unfortunate-undead-people.webp"></div>
