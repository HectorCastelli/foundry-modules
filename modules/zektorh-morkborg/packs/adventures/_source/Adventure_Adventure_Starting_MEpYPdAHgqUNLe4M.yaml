      - sort: 1000000
        name: Travel tables (3)
        type: text
        _id: SQZGIZLrwOog8tj7
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: "<div class=\"roads-to-damnation travel-tables-3\"><div class=\"top-image\"><img title=\"Rider to Galgenbeck\" src=\"modules/morkborg-cult-feretory/assets/roads-to-damnation/rider-right.webp\"></div><div class=\"two-cols\"><div class=\"col\"><h2>Leaving the road, after half a day’s journey, you encounter (d12):@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.psU4oqxLxsENCYCi]{Leaving the road, after half a day’s journey, you encounter (d12)}</h2><div class=\"roll-table\"><div class=\"row\"><div class=\"row-num\"><p>1</p></div><div class=\"row-item\"><p><strong>A petrified forest.</strong></p></div></div><div class=\"row\"><div class=\"row-num\"><p>2</p></div><div class=\"row-item\"><p><strong>An ancient battlefield</strong> (full of half-buried rusty blades and wraiths).</p></div></div><div class=\"row\"><div class=\"row-num\"><p>3</p></div><div class=\"row-item\"><p><strong>A valley full of extinct animal bones.</strong></p></div></div><div class=\"row\"><div class=\"row-num\"><p>4</p></div><div class=\"row-item\"><p><strong>A pre-human god’s lichen-covered temple.</strong></p></div></div><div class=\"row\"><div class=\"row-num\"><p>5</p></div><div class=\"row-item\"><p><strong>An entrance</strong> to the deeper underworld.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>6</p></div><div class=\"row-item\"><p><strong>A cannibal village.</strong></p></div></div><div class=\"row\"><div class=\"row-num\"><p>7</p></div><div class=\"row-item\"><p><strong>Goblin-infested hills.</strong></p></div></div><div class=\"row\"><div class=\"row-num\"><p>8</p></div><div class=\"row-item\"><p><em><strong>A ruined abbey.</strong> (Guarded by a grotesque. Hidden in a crypt is a random occult artifact (inner cover).</em></p></div></div><div class=\"row\"><div class=\"row-num\"><p>9</p></div><div class=\"row-item\"><p><em><strong>A pumpkin patch.</strong> Sickly but sweet smell hanging heavily in the air. (Strongly hallucinogenic. Fiercely protective farmers harvest by night.)</em></p></div></div><div class=\"row\"><div class=\"row-num\"><p>10</p></div><div class=\"row-item\"><p><strong>The silhouette of a wyvern</strong> against the purple evening sky.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>11</p></div><div class=\"row-item\"><p><em><strong>A clock tower,</strong> chiming. (Heretic witches create unliving troll hybrids in its shadow.)</em></p></div></div><div class=\"row\"><div class=\"row-num\"><p>12</p></div><div class=\"row-item\"><p><em><strong>A vast bog.</strong> (Precarious to traverse. Ruled by a huge, bloated, tentacular thing that claims to once have been royalty.)</em></p></div></div></div></div><div class=\"spacer-col\"><p>\_</p></div><div class=\"col\"><h2>Nightly campsite events (d12):@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.l2PiAeWQblUqXhmn]{Nightly campsite events (d12)}</h2><div class=\"roll-table\"><div class=\"row\"><div class=\"row-num\"><p>1-5</p></div><div class=\"row-item\"><p><strong>Quiet night.</strong> For once.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>6</p></div><div class=\"row-item\"><p><strong>A wild beast</strong> (fox, wolverine, sludge-ape) steals d4 rations of food. The PC with the highest Presence tests (DR12) to notice.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>7</p></div><div class=\"row-item\"><p>Everyone is haunted by <strong>twisted dreams of the first random encounter for the next day</strong> (rolled now).</p></div></div><div class=\"row\"><div class=\"row-num\"><p>8</p></div><div class=\"row-item\"><p>A lurking <strong>coward</strong> steals an item from d3 PCs’ packs—DR14 Presence test to notice.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>9</p></div><div class=\"row-item\"><p><strong>A green and terrible moon</strong> shines on the campsite. All characters have one less omen the next day.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>10</p></div><div class=\"row-item\"><p>All <strong>dream</strong> of (d6):</p><ol><li>black stars imploding at the center of the dying cosmos.</li><li>infinite snow plains.</li><li>gothic charnel houses.</li><li>sterile hospitals from a future that will never come.</li><li>hunting game in primeval forests.</li><li>bright white nothingness.</li></ol><p> The next day, each PC has d6-3 omens (a negative total reduces their omens).</p></div></div><div class=\"row\"><div class=\"row-num\"><p>11</p></div><div class=\"row-item\"><p>A band of <strong>blind albino cultists</strong> pass by, quietly chanting eerie hymns to their alligator goddess.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>12</p></div><div class=\"row-item\"><p>d4+2 <strong>peddlers and their donkey</strong> travel slowly with sooty lanterns. (They are really robbers and might attack weak PCs).</p></div></div></div></div></div></div>"
