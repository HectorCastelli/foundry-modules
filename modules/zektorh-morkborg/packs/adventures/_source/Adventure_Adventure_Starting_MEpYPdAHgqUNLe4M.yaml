        image: {}
        text:
          format: 1
          content: >-
            <div class="the-game violence"><div class="content-wrapper"><div
            class="title"><p><span>Violence</span></p></div><div
            class="cols"><div class="col"><div><h2
            class="subtitle">Initiative</h2><div class="pink"><p><strong
            class="rollable" data-roll="1d6">Roll d6</strong></p><p>1–3 enemies
            go first <br>4–6 PCs go first</p><p><span class="rollable"
            data-roll="1d6">Agility + d6</span> for individual initiative or to
            determine who goes first within the group.</p></div></div><div
            class="flail-head-spacer"><p></p></div><div><p class="black">Crit
            (Natural 20)</p><p class="rule"><span
            style="text-decoration:underline">Attack:</span> Double damage,
            armor/protection is also reduced one tier. <br><span
            style="text-decoration:underline">Defense:</span> PC gains a free
            attack.</p></div><p></p><div><p class="black">Fumble (Natural
            1)</p><p class="rule"><span
            style="text-decoration:underline">Attack:</span> The weapon breaks
            or is lost. <br><span
            style="text-decoration:underline">Defense:</span> PC takes double
            damage and armor is reduced one tier. <br>When armor is damaged
            penalties to Strength and Agility tests are not modified.</p><p
            class="rule black">Armor reduced <strong>below 1st tier</strong> is
            ruined and cannot be repaired. For armor repair costs, see Equipment
            lists.</p></div><p></p><div><p class="rule black
            centered"><strong>Armor tiers:</strong> <br>-d6 (3rd tier) <br>-d4
            (2nd tier) <br>-d2 (1st tier)</p></div></div><div
            class="spacer-col"><p></p></div><div class="col"><div><p
            class="rule"><strong>Players</strong> roll for both their attacks
            and defences. Creatures and enemies don’t roll dice in combat.</p><p
            class="rule black">The DR for attacks and defence are modified as
            with any test.</p><p></p><h2 class="subtitle">Melee</h2><p
            class="pink">Test <span class="ability">STRENGTH</span>
            DR12</p><p></p><h2 class="subtitle">Ranged</h2><p class="pink">Test
            <span class="ability">PRESENCE</span> DR12</p><p></p><p></p><h2
            class="subtitle">Defense</h2><p class="pink">Test <span
            class="ability">AGILITY</span> DR12</p><p class="rule">If you fail
            the enemy hits you. Enemies attack once per round unless noted
            otherwise.</p><p></p><h2 class="subtitle">How long is a
            round?</h2><p class="rule">A round is enough time to make an attack
            (or use a Power) and traverse a normal-sized room. There are usually
            10 rounds in one minute.</p></div></div></div></div></div>
