        image: {}
        text:
          format: 1
          content: >-
            <div class="eat-prey-kill creatures"><div
            class="region-title"><p>Sarkash@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.eGLJI0LfyB36piZc]{Sarkash}</p></div><div
            class="two-cols"><div class="col"><div
            class="creature-block"><h2>Skelelk</h2><div
            class="description"><p><span class="num">1</span>
            @UUID[Compendium.morkborg-cult-feretory.feretory-actors.kpubRqYU7j7lvdAg]{Skelelk}
            <span class="name rollable" data-roll="1d4">(D4)</span> <span
            class="text">wear their bones on the outside of their otherwise
            elk-like bodies. Great for defence, although blunt weapons always
            deal maximum damage.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 9, <strong>Morale</strong>
            8, <strong>Exoskeleton</strong> -d6, <strong>Antlers</strong>
            d6</p></div></div><p></p><div
            class="creature-block"><h2>Dredgehog</h2><div
            class="description"><p><span class="num">2</span> <span
            class="text">The
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.0qu2Ib0SBhPgEMyA]{Dredgehog}
            <span class="text">has daggers on its back, which may be why it
            trusts no one and when provoked roll up into a big ball of
            murder.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 14,
            <strong>Morale</strong> 10, <strong>Daggerback</strong> -d6,
            <strong>Bite/Daggers</strong> d6</p><p><strong>Special:</strong>
            Missing an attack against them means you strike a dagger and suffer
            d4 damage.</p></div></div><p></p><div
            class="creature-block"><h2>Mulch-Squirrel</h2><div
            class="description"><p><span class="num">5</span>
            @UUID[Compendium.morkborg-cult-feretory.feretory-actors.da7ZxWI1XjIOBEXR]{Mulch
            Squirrel}<span class="name rollable" data-roll="1d4">(D4)</span>
            <span class="text">eat dirt and taste about the
            same.</span></p></div><div class="stat-block"><p><strong>HP</strong>
            1, <strong>Morale</strong> 3, <strong>Bite/Claws</strong> 1
            damage</p></div></div></div><div
            class="spacer-col"><p></p></div><div class="col"><div
            class="creature-image"><img title="Carrion Owl"
            src="modules/morkborg-cult-feretory/assets/eat-prey-kill/carrion-owl.webp"></div><div
            class="creature-block"><h2>Carrion Owl</h2><div
            class="description"><p><span class="num">3</span>
            @UUID[Compendium.morkborg-cult-feretory.feretory-actors.t8TpE502FqkiDTWH]{Carrion
            owls} <span class="text">only eat what died the night
            before.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 2, <strong>Morale</strong>
            -, <strong>Bite/Claws</strong> d4</p></div></div><p></p><div
            class="creature-block"><h2>Throat-Cutting Warbler</h2><div
            class="description"><p><span class="num">4</span> <span
            class="text">The tiny (attacks and defense are DR14)
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.rd2x1A9QIfvCghXQ]{Throat-Cutting
            Warbler} <span class="text">has the sharpest beak and the best aim
            of all Sarkash’s birds.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 1, <strong>Morale</strong>
            -, <strong>Beak</strong> d10</p></div></div></div></div><div
            class="two-cols"><div class="col"><div class="creature-image"><img
            title="Howler Bear"
            src="modules/morkborg-cult-feretory/assets/eat-prey-kill/howler-bear.webp"></div></div><div
            class="spacer-col"><p></p></div><div class="col"><div
            class="creature-block"><h2>Howler Bear</h2><div
            class="description"><p><span class="num">6</span> <span
            class="text">It’s believed
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.ClDkuLiOFwOzs2pe]{Howler
            bears} <span class="text">lure prey by wailing like dying men. Some
            even form words like “HELP” and “I’M BEING EATEN BY A HOWLER
            BEAR”.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 18,
            <strong>Morale</strong> -, <strong>Skin</strong> -d2,
            <strong>Bite/Claws</strong> d8</p></div></div></div></div></div>
