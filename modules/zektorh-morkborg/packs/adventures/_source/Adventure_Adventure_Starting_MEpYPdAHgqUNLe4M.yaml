      - sort: 4200000
        name: Forlorn Philosopher
        type: text
        _id: XtmR3ol8X21xadAI
        title:
          show: false
          level: 1
        image: {}
        text:
          format: 1
          content: >-
            <div class="optional-classes forlorn-philosopher"><img
            title="Forlorn Philosopher"
            src="modules/morkborg-cult-feretory/assets/forlorn-philosopher/title.webp"><div
            class="two-cols"><div class="col"><p><strong>Voices in your head
            tell you what to do</strong> — at least you think so. You are the
            prophet of a god slain by the Basilisk SHE within Bergen Chrypt’s
            wretched peaks. Now no one wants to hear the words of your god, but
            you can still can. Day and night. Like hot wires through your brain.
            <span class="create-scvm"
            data-uuid="Compendium.morkborg.mork-borg-items.Item.L9Vwzbx5o0OMdJm0">[Make
            One]</span></p><p><span class="yellow-bg">Begins with <strong
            class="rollable" data-roll="1d6*10">d6×10s</strong> and <strong
            class="rollable" data-roll="1d4">d4
            Omens</strong>.</span></p><p><span class="yellow-bg rollable"
            data-roll="1d4"><strong>HP:</strong> Toughness +
            d4</span></p><p></p><div class="section"><div
            class="section-title"><p>Abilities</p></div><p> Mental Focus, <span
            class="rollable" data-roll="3d6+2">roll 3d6+2</span> Presence. Too
            Much Reading! <span class="rollable" data-roll="3d6-2">Roll
            3d6-2</span> Strength. Ruthless Inquisition: test Presence DR 14 to
            <em>tear through others’ deceptions and delusions. Enough of these
            LIES!</em> Roll
            d6@DRAW[Compendium.morkborg.mork-borg-tables.qYznag89iDMdPH6A]{Starting
            Weapon}{1d6} on the weapon table and d2
            @DRAW[Compendium.morkborg.mork-borg-tables.Cyg5IvubZiDmCCUk]{Starting
            Armor}{1d2} on the armor table. You begin with one <strong>Tablet of
            Ochre
            Obscurity</strong>@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.htnphdR4B7LdzDyL]{The
            Tablets of Ochre Obscurity} and one of the following
            ----------&gt;</p></div><p></p><div class="section"><div
            class="section-title"><p>The Roots of your
            Dejection?</p><p>(d8)@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.ed2aR174UMIAAa7w]{The
            Roots of your Dejection}</p></div><ol><li>Your mother alternated
            praise and humiliation leading to grandiose self-image and burning
            self-hatred.</li><li>You wanted to be a warrior or great leader but
            you can’t! Stop! THINKING! STOP THE THOUGHTS!!</li><li>Ambient
            stupidity and bright lights cause your hypersensitive mental tissues
            to INFLAME.</li><li>You could save this doomed world! If only the
            unwashed masses would understand your GENIUS!</li><li>You fell
            victim to the mental virus of “love,” then the object of your
            affection went to live in a hole.</li><li>You encoded your
            omnivalent philosophy in a single tome for safekeeping and saw it
            burn as you fled. All is lost.</li><li>Udok cultists captured your
            family and forced you to debate with them while they devoured your
            parents alive.</li><li>You were Südglans’ most revered
            philosopher—which sank into the sea and now everyone ruthlessly
            mocks you.</li></ol></div><p></p><div class="section"><div
            class="section-title"><p>The dejection of your
            Roots</p><p>(d6)@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.zsHZ3CUF1OR3cFxa]{The
            dejection of your Roots}</p></div><ol><li>Raised by fanatical
            Theists in a temple beneath Grift’s bridges.</li><li>Born to a
            nameless mother in a Galgenbeck sanatorium.</li><li>Brought up by
            illiterate, pig-ignorant churls in a peaceful Wästland
            forest.</li><li>Raised by life-shaming cultists of the frozen Kergüs
            waste who think no one should be born into this dying
            world.</li><li>Abandoned in Bergen Chrypt’s
            catacombs.</li><li>Educated by the damned amongst the Valley of the
            Unfortunate Undead’s mud pits.</li></ol></div></div><div
            class="spacer-col"><p></p></div><div class="col"><div
            class="shape-title
            centered"><p>d6@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.P9VUqC2wFjSW0ip3]{Forlorn
            Philosopher Items}</p></div><div class="shape-title"><p>1. THORNS OF
            COMPREHENSION</p></div><p>When worn, thorns pierce your flesh (d2
            damage) and you Perceive All (-4DR to your next test and ignore the
            next two attacks to hit you as you weave aside). To regain the
            effect you must crown yourself anew. The damage steps up by one each
            time (d2 to d4 to d6 etc), until after a night’s rest.</p><div
            class="shape-title"><p>2. HEGELIAN OWL</p></div><p>This
            philosophical beast is a bitter, reluctant and hypersensitive
            assistant — persuaded with a DR12 Presence test. After two acts of
            aid it regards you with mute contempt. It can fetch small items,
            attack enemies and find traps. By night the owl delivers
            understanding of what you should have done today in dreams.</p><div
            class="owl-row"><div class="owl-image"><img title="hegelian-owl"
            src="modules/morkborg-cult-feretory/assets/forlorn-philosopher/hegelian-owl.webp"></div><div
            class="owl-text"><p><strong><span
            style="text-decoration:underline">HEGELIAN
            OWL</span></strong><br>Too quick to hit.<br>Claws/bite d4. Attacks
            are DR8.</p></div></div><div class="shape-title"><p>3. PRISM OF
            AMBIGUITY</p></div><p>An external light source and a Presence DR10
            test are needed to activate the prism. Its light may shine on up to
            two creatures healing d6 HP. For the next hour one of them lowers
            all test DRs by -2. If the test is failed they suffer d4 damage and
            their armor or a weapon is destroyed. You can use the prism twice
            per day.</p><div class="shape-title"><p>4. FLUTE OF
            TOSK</p></div><p>Once per combat, when a creature dies, you may play
            this bone flute’s Echoing Fugue. This deals an ‘echo’ of the fatal
            damage to a random enemy in the vicinity.</p><div
            class="shape-title"><p>5. SASH OF THE STYLITE</p></div><p>The MIND
            controls the body! Nothing is good or bad but thinking makes it so
            including calories and protein. Wearing this belt means you feel no
            hunger and only need to drink water to regain HP when resting.
            Wearing it for more than d4 days causes you to collapse. It takes a
            day to regain its power.</p><div class="shape-title"><p>6. MARKED BY
            OBSCURITY</p></div><p>An ever-shifting Tablet of Ochre Obscurity is
            tattooed on your flesh. Roll each morning which tablet it
            is@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.htnphdR4B7LdzDyL]{The
            Tablets of Ochre Obscurity}. The tablet can only be used once per
            day but automatically succeeds.</p></div></div></div>
