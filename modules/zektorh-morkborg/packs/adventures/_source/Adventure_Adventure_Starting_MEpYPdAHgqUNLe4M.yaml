        text:
          format: 1
          content: >-
            <div class="the-tenebrous-reliquary reliquary-11-16"><div
            class="wrapper"><div class="rel-item mercys-bane"><div
            class="num"><p><span class="yellow-bg">11.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.3wqJFmCgOLdExUYZ]{Mercy's
            Bane}</p></div><div class="credits"><p>by Ripley C.</p></div><div
            class="text"><p>Spiked Flail (d8). Deals an additional d6 damage to
            surrendering enemies.</p></div></div><div class="rel-item
            opium-hook"><div class="num"><p><span
            class="yellow-bg">12.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.4ql1uqGYOnZ1yob1]{Opium
            Hook}</p></div><div class="credits"><p>by Leander E.</p></div><div
            class="text"><p>Metal hook directly applied to an artery (d4
            damage). Gives twice the HP as temporary HP for 2h.</p><p>Effect
            like an opiate. Toughness DR10 test to resist dependency (every
            sober day deals damage as an infection).</p><p>DR rises with each
            failed attempt. Eventually the user is addicted and loses the
            temporary HP benefit.</p></div></div><div class="rel-item
            plasmatic-idol"><div class="num"><p><span
            class="yellow-bg">13.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.7iPH2KLIQtF7c0uB]{Plasmatic
            Idol}</p></div><div class="credits"><p>by Paul Wilde.</p></div><div
            class="text"><p>Spill blood over this profane idol while resting and
            roll a die. <br>Odd: spilled blood becomes red poison (Toughness
            DR12 or -10 HP). <br>Even: until next rest, Agility and Strength
            tests are +2 DR.</p></div></div><div class="rel-item
            rippers-blade"><div class="num"><p><span
            class="yellow-bg">14.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.VWWJj4LSYRdoQnuK]{Ripper's
            Blade}</p></div><div class="credits"><p>by Leander E.</p></div><div
            class="text"><p>Deals no damage but removes d4-1
            Armor.</p></div></div><div class="rel-item roses-of-winter"><div
            class="num"><p><span class="yellow-bg">15.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.hdEoOA9JyuckBAvH]{Roses
            of Winter}</p></div><div class="credits"><p>by Anders
            Arpi</p></div><div class="text"><p>A very rare, nearly extinct
            blood-red thorny flower—not an actual rose. A single petal
            completely numbs whoever eats it to pain for a few minutes. Damage
            is received normally but the wearer can’t be killed or broken during
            the flower’s effects.</p></div></div><div class="rel-item
            spine-of-god"><div class="num"><p><span
            class="yellow-bg">16.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.BloyhpwtdnWmHYvl]{Spine
            of God}</p></div><div class="credits"><p>by Dom Cohen</p></div><div
            class="text"><p>This shriveled, crusty length of vertebrae is warm
            to the touch. The bearer attracts the poor, their intentions unknown
            even to themselves.</p><p>If broken, the clouds part ending any
            weather effects as warm sunbeams pierce the heavens for the first
            time in a century.</p></div></div></div></div>
