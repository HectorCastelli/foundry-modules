      - sort: 3700000
        name: Getting Better
        type: text
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: "<div class=\"the-game getting-better\"><div class=\"title\"><p>Getting<br>\_\_better<span class=\"or-worse\">or worse</span></p></div><p class=\"the-game-master-decides\">The game master decides when a character should be improved. <br>It can be after completing a scenario, killing mighty foes or bringing home treasure.</p><p class=\"when-this-happens\">When this happens the following things occur:</p><div class=\"cols\"><div class=\"col\"><p class=\"subtitle\">More HP:</p><p><span class=\"rollable\" data-roll=\"6d10\">Roll 6d10</span>. If the result is equal to or greater than your current maximum HP, increase it <span class=\"rollable\" data-roll=\"1d6\">by d6</span>.</p><hr><p class=\"subtitle\">Left in the debris you find: d6@DRAW[Compendium.morkborg-core.core-tables.HgjQlJr6UxrbQXjK]{Left in the debris}</p><p>1–3 nothing <br>4 3d10 silver <br>5 an unclean scroll <br>6 a sacred scroll</p></div><div class=\"spacer-col\"><p></p></div><div class=\"col\"><p class=\"subtitle\">Ability changes:</p><p><span class=\"rollable\" data-roll=\"1d6\">Roll a d6</span> against every ability. Results equal to or greater than the ability increase it by 1, to a maximum of +6. Results below the ability decrease it by 1.</p><p></p><p><strong>Abilities from −3 to +1</strong> are always increased by 1 unless the d6 result is 1. The ability is then reduced by 1, but never below -3.</p></div></div></div>"
