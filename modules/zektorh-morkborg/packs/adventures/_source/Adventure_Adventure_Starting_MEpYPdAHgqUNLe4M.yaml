      - sort: 1100000
        name: Galgenbeck
        type: text
        _id: HdLNFS2SeewFkuX9
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <div class="the-dying-world galgenbeck"><p class="galgenbeck"><span
            class="title">Galgenbeck</span> in the land of
            <strong>Tveland</strong> is the greatest city that ever was. No King
            or Queen rules in Galgenbeck but an arch-priestess: <em>Josilfa
            Migol.</em> Deep beneath the Cathedral of the Two-Headed Basilisks,
            in a cool black chamber crossed by shards of light, lies her throne.
            <strong>Josilfa,</strong> old but <strong>still young,</strong>
            commoners gossip that she colludes with the god Nechrubel, who gave
            her eternal life. Nechrubel: the shadow that covers all. Nechrubel
            is melancholy, crop failure, conflict and war. It is said he
            whispered the apocalyptic prophecies in Verhu’s ear.</p><div
            class="even-shorter"><img class="skull" alt="skull"
            src="modules/morkborg-core/assets/the-dying-world/galgenbeck-skull.webp"><p>As
            time grows ever shorter the <em>Two-Headed Basilisks</em> become
            ever-more <strong>desperate</strong> in their recruitment. To take
            one’s own life is considered sinful cowardice. The road to salvation
            lies through mortification of the flesh; the apocalypse is to be met
            with eyes wide open. Only then can the soul be allowed passage to
            the Shimmering Fields. Heretics and apostates are hunted down and
            corrected, in public and at length, by the
            Inquisition.</p></div></div>
