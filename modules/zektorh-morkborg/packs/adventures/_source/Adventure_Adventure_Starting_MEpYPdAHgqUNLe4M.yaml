            src="modules/morkborg-cult-feretory/assets/feretory/logos/free-league-publishing.svg"><img
            title="Free League Workshop"
            src="modules/morkborg-cult-feretory/assets/feretory/logos/free-league-workshop.svg"></div><div
            class="copyright"><p>MÖRK BORG and MÖRK BORG CULT: FERETORY is ©
            Ockult Örtmästare Games &amp; Stockholm Kartell.</p><p>It is
            published by Free League Publishing. Check out <a
            href="https://www.morkborg.com/">www.morkborg.com</a> for more
            content.</p></div></div>
