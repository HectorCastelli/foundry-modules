    pages:
      - sort: 100000
        name: Original Gods
        type: text
        _id: C9tbx18tPk5rdMME
        system: {}
        title:
          show: true
          level: 1
        image: {}
        text:
          format: 1
          content: >-
            <p>The world as it exists today is the result of the influences and
            whims of five original gods.</p><p></p><p>They have been lost to
            history, by their own design, but are still very much present,
            lurking in the shadows and meddling with the world. They leave the
            adoration reach their children, minor gods of their own making, and
            meddle with the world unseen.</p>
        video:
          controls: true
          volume: 0.5
        src: null
        category: null
        ownership:
          default: -1
          fxKESTgEBpcOTrSl: 3
        flags: {}
