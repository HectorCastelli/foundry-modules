      - sort: 150000
        name: Sagsobuth - The tear of fortune
        type: text
        _id: LW92kAGHKIV1gkay
        system: {}
        title:
          show: true
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <p>They are a shapeless and ethereal tear in reality. A feminine
            face appears behind it, clouded by a vortex of light.</p><p>They
            appear in impossible situations, often when most needed, and meddle
            with fate for her own entertainment. She rewards those that have
            shown themselves useful, with a boom, usually in the form of a well
            placed item or piece of information.</p>
