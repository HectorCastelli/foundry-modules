      - sort: 8200000
        name: Even More Reasons to Risk One's Life
        type: text
        _id: xTqwwyAWb3vx07Wm
        title:
          show: false
          level: 1
        image: {}
        text:
          format: 1
          content: >-
            <div class="even-more-reasons"><div class="top-grid"><div><div
            class="title"><p>Even More Reasons to Risk One's Life</p></div><div
            class="where-do-you-wander"><p class="table-title">Where do you
            wander?<br><span
            class="die-roll">(d12@DRAW[Compendium.morkborg-core.core-tables.KlzvBhAqZ4rcBqFA]{Where
            do you wander?})</span></p><ol><li>On the barren fields of
            Kergüs</li><li>In the centre of Alliáns</li><li>On a beach not
            distant from Grift</li><li>On a dirty Schleswig street</li><li>In
            the poor Wästland countryside</li><li>At the city wall of
            Galgenbeck</li><li>In the untamed wilds of Tveland</li><li>Near the
            Valley of the Unfortunate Undead</li><li>Pretty much lost in
            Sarkash</li><li>At the Bergen Chrypt tree line</li><li>Onboard a
            ship on the Endless Sea</li><li>In a forgotten part of
            Graven-Tosk</li></ol></div></div><div class="who-contacts-you"><p
            class="table-title">WHO <em>(OR WHAT)</em> CONTACTS YOU? <span
            class="die-roll">(d20@DRAW[Compendium.morkborg-core.core-tables.WahlVLzZUPl7g5XW]{Who
            (or what?) contacts you?})</span></p><ol><li>One-eyed woman who
            rules the thieves</li><li>Bureaucrat with enemies and no
            honor</li><li>Badly burned priest</li><li>Noble child said to see
            dark visions</li><li>Warrior that switched loyalties</li><li>Faint
            whispers from the crypt</li><li>Remorseful hangman</li><li>Tortured
            traitor</li><li>Reccuring vision in a horrid
            nightmare</li><li>Hermit mocked by the other
            cave-folk</li><li>Demented elder</li><li>Sacrifice who escaped a
            death-cult</li><li>Monk who was bitten at night</li><li>Unshaved
            mystic at The Paunchy Swine</li><li>Devastated mother dressed in
            white</li><li>Sailor too long at sea</li><li>Scoundrel covered in
            ulcers</li><li>Drunk seeress with no teeth</li><li>Restless soul by
            the name of Ghast</li><li>Terrified soldier with broken
            knees</li></ol></div></div><hr><div class="adventure-spark"><p
            class="table-title">Adventure Spark <span
            class="die-roll">(d100@DRAW[Compendium.morkborg-core.core-tables.z7DGpWygMGva5jap]{Adventure
            Spark})</span></p><div
            class="spark-grid"><div><p>1–2</p></div><div><p>3–4</p></div><div><p>5–6</p></div><div><p>7–8</p></div><div><p>9–10</p></div><div><p>11–12</p></div><div><p>13–14</p></div><div><p>15–16</p></div><div><p>17–18</p></div><div><p>19–20</p></div><div><p>21–22</p></div><div><p>23–24</p></div><div><p>25–26</p></div><div><p>27–28</p></div><div><p>29–30</p></div><div><p>31–32</p></div><div><p>33–34</p></div><div><p>35–36</p></div><div><p>37–38</p></div><div><p>39–40</p></div><div><p>41–42</p></div><div><p>43–44</p></div><div><p>45–46</p></div><div><p>47–48</p></div><div><p>49–50</p></div><div><p>The
            undead-riddled Valley awaits</p></div><div><p>Thirteen priests are
            missing</p></div><div><p>Wrongly imprisoned for
            murder</p></div><div><p>66 sacrifices are
            needed</p></div><div><p>Children missing at Lake
            Onda</p></div><div><p>Sinkhole swallows half of
            Schleswig</p></div><div><p>Sabotage an unholy
            alliance</p></div><div><p>The count goes insane at
            night</p></div><div><p>Hunted by bloodthirsty
            death-cult</p></div><div><p>Trapped by an
            earthquak</p></div><div><p>Verhu’s prophecy is
            false</p></div><div><p>Rumors of a cursed
            treasure</p></div><div><p>Kidnapped blood-wizard</p></div><div><p>A
            dead demon is resurrected</p></div><div><p>Every grave is emptied
            one night</p></div><div><p>Enormous cave system near
            Grift</p></div><div><p>The dead refuse to stay
            dead</p></div><div><p>PCs are selected for ritual
            sacrifice</p></div><div><p>Anthelia falls severely
            ill</p></div><div><p>PC dopplegangers go
            berserk</p></div><div><p>Take part in a holy mass
            burial</p></div><div><p>The entire kingdom has
            nightmares</p></div><div><p>Something has infiltrated the
            court</p></div><div><p>Artifact must be
