      - sort: 1300000
        name: Palace of the Shadow King
        type: text
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <div class="the-dying-world palace-of-the-shadow-king"><div
            class="content-wrapper"><p class="intro">Rising over
            Graven-Tosk<br>like rage rising over pain is the</p><p><span
            class="title">Palace of the Shadow King</span></p><p
            class="middle">A gothic <strong>black castle,</strong> like a mirror
            to the Cathedral of the Two-Headed Basilisk in Galgenbeck. Most of
            the palace lies in crumbling ruins, home to unfortunate souls
            sheltering beneath its broken halls. None dare dream what might lie
            under the rubble covered catacombs and cellars. Tunnels sprawl
            beneath like writhing roots, digging deeper into the cold earth like
            cancerous veins. The inner wing still stands, acting as the home of
            the Shadow King, a being obscured by ritual. The slaves of the
            servants of the courtiers of the King come forth and do his
            will.</p><p class="bottom">The title is hereditary: sons are always
            born to the Shadow King. It’s whispered Princes of that line
            disguise themselves as ordinary men wandering the ruins engaging in
            games and tricking travelers, multiplying the miseries of their
            people.</p></div></div>
