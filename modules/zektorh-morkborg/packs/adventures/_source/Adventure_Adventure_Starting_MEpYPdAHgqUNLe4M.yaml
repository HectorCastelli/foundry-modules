      - sort: 1300000
        name: Introduction
        type: text
        _id: fdlW8Ls6FDeHr3CD
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: "<div class=\"eat-prey-kill introduction\"><div class=\"two-cols\"><div class=\"col\"><p><strong>When stomachs growl</strong> and there's no inn in sight, successfully test Presence to see what potential feasts you locate. <span class=\"yellow-bg rollable\" data-roll=\"1d6\">Roll a d6</span> on a region table. If you fail, don’t worry, you still may find things to kill, although there’s probably a mishap in there for you.</p><p></p><p><strong>Optionally,</strong> roll a <span class=\"rollable\" data-roll=\"1d8\">d8</span>/<span class=\"rollable\" data-roll=\"1d10\">d10</span>/<span class=\"rollable\" data-roll=\"1d12\">d12</span> instead and substitute 7+ with rabbits, stray dogs or boring, mundane prey.</p><p></p><p> Now <em><strong>kill</strong></em> and be merry.</p></div><div class=\"spacer-col\"><p>\_</p></div><div class=\"col\"><h2>How much meat is there?</h2><p> A creature provides rations equal to their HP or whatever feels reasonable—some beasts are less edible.</p><div class=\"subtitle\"><p>How many are there?</p></div><p> If there’s a die type in parenthesis roll it. Otherwise, probably one appears.</p></div></div></div>"
