            class="hit-points-skull" alt="skull"
            src="modules/morkborg-core/assets/the-game/hit-points-skull.webp"></div></div></div><div
            class="broken"><p>Broken
            (d4)@DRAW[Compendium.morkborg.mork-borg-tables.ncXwgtRMqoiREban]{Broken}</p><ol><li>Fall
            unconscious for d4 rounds, awaken with d4 HP.</li><li>Roll a d6: 1-5
            = Broken or severed limb. 6 = Lost eye. Can’t act for d4 rounds then
            become active with d4 HP.</li><li>Hemorrhage: death in d2 hours
            unless treated. All tests are DRhp16 the first hour. DR18 the last
            hour.</li><li>Dead.</li></ol></div></div></div>
