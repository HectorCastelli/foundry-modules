      - sort: 300000
        name: First Act
        type: text
        _id: CTYtXnSrx7kTmBHD
        system: {}
        title:
          show: true
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <h2>1 &amp; 2</h2><p>The group was sent into the Accursed Den to
            recover the 7th prince for the Shadow King.</p><p>After a close call
            with a guard, they found a black sarcophagus, which sent them to
            where the witch Lesdy was. This meeting was not graceful, and it
            ended with one of Lesdy's children, a Host, carrying the witches'
            corpse away thru the forests in the north.</p><p>Making their way
            back to the den, the group met with Sagsobuth shortly, before facing
            the Gutworm in the black pit.</p><p>Thankfully, they found the
            prince and led them to safety, outside. Once they delivered the
            royal to the guards, they were rewarded for their work, and let
            go.</p><p>This is when they decide to head south, to Galgenbeck,
            looking for clues to where Niduk's mother might be, where Vresi's
            goddess is, or some cheap food for Bral.</p><h2>3 &amp; 4</h2><p>The
            group runs into a tavern at the edge of Sarkash. There they befriend
            Mol, and help them rescue Harmung from the clutches of some
            cultists.</p><p>They use a ritual teleporter and are send
            underground, where a guardian toad chases the group and the
            remaining cultists.</p><p>After choking some poor cultist, and
            finally figuring out how the teleporter works, they leave the
            underground and break the teleportation circle.</p><p>Harmung offers
            a stable job in Kergus, under their old group "Duchess Irwin's
            Traveling Gladiators". The group is not very keen in approaching the
            realm of Anthelia.</p><p>Before leaving, they take some rest and
            prepare for the journey. Just as they go to crucify a cultist, a
            Psalm manifests, and the dead rise.</p><p>Fleeing the waking army of
            undeath, they take Mol and Harmung in an improvised carriage towards
            the city proper. Galgenbeck awaits.</p><h2>5</h2><p>The group enters
            Galgenbeck, the three ringed city of marble, and the two companions
            head to the Heavy Tiger, while the party chases after a familiar
            smell in the sewers: Maust's lair.</p><p>There, Maust tells them of
            a curse, an asylum where a doctor manufactures it, and a plan to
            find Niduk's shadowy assasin, Goroloth.</p><h2>6</h2><p>The group
            heads to the Heavy Tiger to regroup, but proceeds to cause chaos.
            They threaten the receptionist, insult the staff, and when things
            couldn't get worse, Vresi curses themselves into becoming a
            skeleton.</p><p>The ensuing fight is difficult, but a friend of
            their allies puts a stop to it. Bartrem, tries to recruit the group
            to help protect the city, in order to gain favor with the townsfolk
            and avoid a grim persecution for the heretical skeleton they harbor.
            This is not well received, and the group proceeds to assassinate
            Bertram before making a run for the inner circles of the
            city.</p><h2>7 &amp; 8</h2><p>The group leaves the Heavy Tiger in a
            hurry, without bothering explaining anything for Mol and Harmung.
            They are intercepted by inquisitors but make quick work of them. In
            a hurry, they pick up the essentials from their carriage and head
            out.</p><p>With the chaos of the undead army on the outside, the
            group is able to fool the guard and make it into the inner city,
            where Vresi proceeds to cause another magical disaster and summons
            translucent hellish crustaceans.</p><p>The group then enters the
            asylum Maust told them about, and are promptly fooled by an escaping
            Soultorn.</p><p>Meanwhile, zombies decimate the outskirts. A small
            number made it into the first ring, proliferating inside the city.
            The second ring held, but the higher echelon of the inquisition is
            staying put.</p><p>The group ventures deeper into the records room,
            so they can lock themselves and sleep. After some rest, they head to
            the trapped corridor, where Kvetin loses their leg for the first
            time. Vresi sacrifices his chances at recovering his flesh to put
            out an enchanting flame, igniting the room.</p><p>The group then
            heads to the research hall, where Kvetin's leg is attached, then
            promptly removed again. After a difficult fight, they rest some more
            before continuing into the containment room, but not before Bral
            releases the Black Salt into the world, losing a piece of shoulder
            in the process.</p><p>The next day, they head in and crack the
            puzzle. They realize what was being researched and that they let
            Soultorn escape. In the meantime, Galgenbeck has completely fallen
            to the zombie horde. Only the center of power, the Temple of the
            Basilisks stands. The zombie army, now enlarged by the city's
            population, marches southwards, to Schleiswig.</p><p>In the temple,
            the monarch awaits. Maust is nowhere to be seen. The scholarium is
            in ruins, and the mines have been broken into.</p><h2>9 &amp;
            10</h2><p>The group goes into the temple and can convince the others
            they are Bertram. They get some rest and head to the barracks to
            requisition some equipment. They bargain for food and gear, in
            exchange to clean the store room.</p><p>They try to enter it thru a
            trapdoor, but fall in and get hurt. They manage to win the fight,
            and instead of sharing the food stores with the rest, they just rest
            for the night.</p><p>Outside, the world falls into deeper despair.
            Schleiswig loses it's king, and Anthelia dies crushed under a
            falling rock. Those loyal to kings and queens everywhere turn to
            wolves. Only the disloyal and indifferent stand.</p><p>Back at the
            Gaol, the group proceeds to slay the wolves, and ransack the
            quarters. They find a drop into the Pale Quarry, but it is too deep
            to make it, so they turn upwards, back to the court rooms of
            Galgenbeck.</p><p>In the way, they get some clues from some
            mercenaries, then proceed to fight in the courtroom with some
            remaining nobles. Seeing as the violence doesn't pay off, they
            relent and climb back down. Time to check the clergy
            room.</p><p>Inside the church, they spot Niduk's mom. Niduk grabs
            her, runs into the nearby relic room, and explodes in glory. His
            shield protects him form death, but Vresi's recuperative Water of
            Life brings him back, at the cost of his sight.</p><p>Bral loots the
            remains of the treasure room and finds the original scriptures,
            while Kvetin finds a list of names (theirs). Niduk's name is crossed
            out.</p><p>As things settle down, Goroloth appears from the shadows
            and says that wait is over. Time to move.</p><h2>11</h2><p>The group
            follows Goroloth into the copper throne, where the five gods wait
            them impatiently.</p><p>The gods, surprised at their lack of memory,
            try to explain their position, but not before Niduk tries, and loses
            a duel to Goroloth, that claims their life.</p><p>Vresi, trying to
            turn things around, desperately uses the potions from Soultorn to
            regain their humanity, but is just serves to entice Soultorn into
            gaining interest, a dangerous proposition.</p><p>Pobelo takes Niduks
            and Vresi's souls, enough to complete their spell. But Guinevere is
            far too bored, so they attack and crush Bral.</p><p>Kvetin, the last
            one standing, tries to offer gold or a bargain, and Sagsobuth
            appreciates it, but denies it. Maybe on the next life.</p><p>As the
            curtains close on this existence, Sagsobuth shares the curse placed
            on the basilisks and promises that their souls will receive a boon
            on their next attempt. A small reward, but better than nothing.</p>
