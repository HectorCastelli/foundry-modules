      - sort: 6100000
        name: 5 - Heretical Priest
        type: text
        title:
          show: false
          level: 3
        image: {}
        text:
          format: 1
          content: >-
            <div class="the-game heretical-priest"><div
            class="title"><p>Heretical Priest</p></div><div
            class="top-grid"><div class="intro"><p>HUNTED BY <span
            class="basilisks">the Two-headed Basilisks</span> of the One True
            Faith, this heretic can be found raving in ruins, traipsing
            endlessly down dusty roads and desecrating cathedrals by night.
            <span class="create-scvm"
            data-uuid="Compendium.morkborg.mork-borg-items.8CTmhMvQ5BJlGD2o">Make
            One</span></p></div><div class="begins-with"><p>Begins with <span
            class="rollable" data-roll="3d6*10">3d6 × 10s</span> and <span
            class="rollable" data-roll="1d4">d4 Omens</span>. HP: Toughness +
            <span class="rollable" data-roll="1d8">d8</span></p></div></div><div
            class="unholy-origins"><p class="table-title">Unholy
            origins@DRAW[Compendium.morkborg.mork-borg-tables.Xyf2tsIpMjKm331T]{Unholy
            origins}</p><ol><li>Galgenbeck, near the cathedral of the Two-Headed
            Basilisks.</li><li>Massacred Alliáns cult, sole
            survivor.</li><li>The crypts of Grift.</li><li>Temple ruins in the
            Valley of the Unfortunate Undead.</li><li>One of the many
            Graven-Tosk thief-tunnels.</li><li>Secret Bergen Chrypt
            church.</li></ol></div><div class="abilities"><div
            class="abilities-title"><p>Abilities</p></div><p> Insightful, <span
            class="rollable" data-roll="3d6+2">roll 3d6+2</span> for Presence.
            Frail, <span class="rollable" data-roll="3d6-2">roll 3d6-2</span>
            for Strength. Roll
            d8@DRAW[Compendium.morkborg.mork-borg-tables.qYznag89iDMdPH6A]{Starting
            Weapon}{1d8} on the weapon table and
            d4@DRAW[Compendium.morkborg.mork-borg-tables.Cyg5IvubZiDmCCUk]{Starting
            Armor}{1d4} on the armor table, and may use Powers while wearing
            medium armor. You begin with one of the
            following:@DRAW[Compendium.morkborg.mork-borg-tables.oyzpiUs6PhtwadrG]{Heretical
            Priest Items}</p></div><div class="priest-items"><div
            class="priest-item"><div class="name"><p>1 Sacred shepherd’s
            crook</p></div><div class="text"><p>Its head a hook of human bone
            inscribed with overlapping anti-prayers. This crook hooks through
            other worlds. Staff does 2d4 damage except to faithless
            humans.</p></div></div><div class="priest-item"><div
            class="name"><p>2 Stolen Mitre</p></div><div class="text"><p>While
            wearing this holy hat the priest’s vile body fades, becoming hard to
            hit in combat (Defence DR10). If pulled over the ears outside of
            battle the priest becomes nearly invisible, testing stealth against
            DR8.</p></div></div><div class="priest-item"><div class="name"><p>3
            List of Sins</p></div><div class="text"><p>A long and accurate
            document cross- referenced against reality to discover unseen
            evil-doers. Successful Presence DR10: A strange light surrounds evil
            creatures. The list’s owner defends with +2 against any being
            discovered this way.</p></div></div><div class="priest-item"><div
            class="name"><p>4 The Blasphemous Nechrubel Bible</p></div><div
            class="text"><p>So intensely blasphemous even the Priests themselves
            can only peruse it once per day. When read, roll a die. Even result:
            For the rest of the day PCs heal d4 HP after just five minutes of
            rest. Odd result: The priest is plagued by demonic hallucinations.
            The DM may invent d3 things that only the Priest can see and
            describe them to the player as if true. This effect ends with
            sunrise.</p></div></div><div class="priest-item"><div
            class="name"><p>5 Stones Taken from Thel-Emas’ Lost
            Temple</p></div><div class="text"><p>Cast the stones on the ground.
            Their pattern reveals if danger lurks in an adjacent room. The
            stones can lie. The priest tests Presence DR10 to see if they are
            true but after failing they cannot test again until the sun has
            set.</p></div></div><div class="priest-item"><div
            class="name"><p>666</p><p class="upside-down">(wrong Jesus)
            crucifix</p></div><div class="text"><p>The crucifix can be used in
            encounters with the undead as well as lesser trolls and goblins.
            Check morale (add or subtract the priest’s Presence modifier) to see
            if the creatures bow and kindly remove
            themselves.</p></div></div></div></div>
