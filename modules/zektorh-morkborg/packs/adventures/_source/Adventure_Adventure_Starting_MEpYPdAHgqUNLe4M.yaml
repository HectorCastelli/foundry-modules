        text:
          format: 1
          content: >-
            <div class="the-grey-galth-inn page-2"><div class="two-cols
            page-cols"><div class="col"><div class="skew-minus-2"><div
            class="white-block three-dead-skulls"><p class="centered"><span
            class="rollable" data-roll="1d4">d4 gambling dregs</span> want to
            play</p><div class="three-dead-skulls-title centered"><p><span
            class="rollable" data-roll="3d6">Three Dead
            Skulls</span></p></div><ul><li>💀 Bet an extra 10-30s to <span
            class="rollable" data-roll="1d6">reroll any number of dice</span>
            adding this to the total bet. You can do this only once.</li><li>💀
            You can use a “coward” to <span class="rollable"
            data-roll="1d6">reroll once more</span>. Put aside <span
            class="rollable" data-roll="1d6*5">d6×5 silver</span> which are not
            added to the total bet but returned if you win.</li><li>💀 If you do
            not score a combination, you lose the bet. If the lowest die shows a
            1 someone saw you trying to cheat and the gambling dregs want a
            fight. <span class="rollable" data-roll="1d6">Roll another
            d6</span>: on a 1 you are stabbed to death.</li></ul><p
            class="centered"><strong>Winning combinations</strong></p><div
            class="combo-grid"><div class="combo"><p><span class="die">1</span>
            <span class="die">1</span> <span class="die">1</span></p><p>Bet ×1.5
            back</p></div><div class="combo"><p><span class="die">1</span> <span
            class="die">2</span> <span class="die">3</span></p><p>Bet ×1.5
            back</p></div><div class="combo"><p><span class="die">2</span> <span
            class="die">2</span> <span class="die">2</span></p><p>Bet ×1.5
            back</p></div><div class="combo"><p><span class="die">3</span> <span
            class="die">3</span> <span class="die">4</span></p><p>Bet ×2
            back</p></div><div class="combo"><p><span class="die">4</span> <span
            class="die">4</span> <span class="die">4</span></p><p>Bet ×2 back
            and a sword!</p></div><div class="combo"><p><span
            class="die">5</span> <span class="die">5</span> <span
            class="die">5</span></p><p>Bet ×2 back and d4 doses of life
            elixir</p></div><div class="combo"><p><span class="die">4</span>
            <span class="die">5</span> <span class="die">6</span></p><p>Bet ×2
            back and a hardy tame rat</p></div><div class="combo"><p><span
            class="die">6</span> <span class="die">6</span> <span
            class="die">6</span></p><p>Bet ×2 back and a Zweihänder and d4 hardy
            tame rats.</p></div><div class="combo"><div class="outer"><div
            class="inner die"><p>other straights<br>(2-3-4
            etc):</p></div></div><p>Bet back<br><span class="rollable"
            data-roll="1d6">5–6 on d6</span>: you are accused of cheating. The
            gambling dregs want to fight!</p></div></div><div
            class="two-cols"><div class="col"><div><p
            class="creature-name">Gambling Dreg</p><p><strong>HP</strong> 5,
            <strong>Morale</strong> 7, <strong>Layers of rags</strong> −d2,
            <strong>Dull knife</strong> d2, one has a <strong>Sword</strong>
            d6</p><p>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.xzRy43zeM2QZkK5S]{Gambling
            Dreg}</p></div><p></p><div><p class="creature-name">Hardy Tame
            Rat</p><p><strong>HP</strong> 3, <strong>Morale</strong> –*,
            <strong>Shaggy fur</strong> −d2, <strong>Bite</strong> d4 (1-in-6
            chance of biting the carotid, instantly fatal)</p><p
            class="smaller">*Unreliable animal that only obeys provided 1⁄2 a
            day’s food daily. Each feeding there is a 1-in-6 chance it leaves.
            The rat feels it could do a lot better
            elsewhere.</p><p>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.S0B8Y7R6PF9wrYVH]{Hardy
            Tame Rat}</p></div></div><div class="col booze-col"><img
            title="Booze"
            src="modules/morkborg-cult-feretory/assets/the-grey-galth-inn/booze.webp"></div></div></div></div></div><div
            class="spacer-col"><p></p></div><div class="col lost-souls-col"><div
            class="white-block even-more-lost-souls"><div class="title"><p>Even
            more lost souls</p></div><p class="smaller">Name the innkeep, the
            treacherous gamblers and the other patrons. Or your new
            PC.@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.0ZD88btrT4IHqJMA]{Even
            More Lost Souls}</p><p>d4/d8</p><ol
            start="11"><li>Skelh</li><li>Burder</li><li>Jaurk</li><li>Thron</li><li>Tarvl</li><li>Yvtuk</li><li>Urkin</li><li>Gretil</li></ol><ol
            start="21"><li>Lirk</li><li>Galt</li><li>Oren</li><li>Morgar</li><li>Fegan</li><li>Wakta</li><li>Sunn</li><li>Gaust</li></ol><ol
            start="31"><li>Gravuld</li><li>Krangel</li><li>Gneth</li><li>Kluvrist</li><li>Mardul</li><li>Qift-Mol</li><li>Klovan</li><li>Dölun</li></ol><ol
            start="41"><li>Vükkan</li><li>Loga</li><li>Senkil</li><li>Domn</li><li>Herkavul</li><li>Kathan</li><li>Drugel</li><li>Schlefzum</li></ol></div></div></div></div>
