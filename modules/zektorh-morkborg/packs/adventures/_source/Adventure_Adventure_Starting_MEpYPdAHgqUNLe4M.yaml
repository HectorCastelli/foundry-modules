        image: {}
        text:
          format: 1
          content: >-
            <div class="eat-prey-kill creatures"><div
            class="region-title"><p>Tveland@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.3wET4Qg1Ul28IB4r]{Tveland}</p></div><div
            class="two-cols"><div class="col"><div
            class="creature-block"><h2>Antideer</h2><div
            class="description"><p><span class="num">1</span>
            @UUID[Compendium.morkborg-cult-feretory.feretory-actors.FtjEIIpCSH8M5OqY]{Antideer}
            <span class="name rollable" data-roll="1d6">(D6)</span> <span
            class="text">tastes like venison, but isn’t.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 7, <strong>Morale</strong>
            6, <strong>Tough skin</strong> -d2, <strong>Antlers</strong>
            d6</p><p><strong>Special:</strong> After eating Antideer meat pass a
            DR12 Presence test to live with yourself. If not, the unknowledge of
            what you’ve done weighs on you (-1
            Presence).</p></div></div><p></p><div class="creature-image"><img
            title="Flayed Vulture"
            src="modules/morkborg-cult-feretory/assets/eat-prey-kill/flayed-vulture.webp"></div><div
            class="creature-block"><h2>Feral Horses</h2><div
            class="description"><p><span class="num">4</span>
            @UUID[Compendium.morkborg-cult-feretory.feretory-actors.6LVNvo9b7nygrLPi]{Feral
            Horse} <span class="name rollable" data-roll="1d4">(D4)</span> <span
            class="text">are more than wild—for they know and love the taste of
            flesh.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 8, <strong>Morale</strong>
            -, <strong>Tough skin</strong> -d2, <strong>Bite/kick</strong>
            d6</p></div></div><p></p><div class="creature-block"><h2>Steppe
            Wolfe</h2><div class="description"><p><span class="num">5</span>
            <span class="text">The lanky
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.9YHwFOiBYgvPTJf0]{Steppe
            Wolfe} <span class="text">has long legs but short patience. Outlast
            </span><span class="rollable" data-roll="1d4">d4 rounds</span> and
            the pack (<span class="rollable" data-roll="1d8">d8</span>) may
            leave you alone.</p></div><div
            class="stat-block"><p><strong>HP</strong> 8, <strong>Morale</strong>
            10, <strong>Tough skin</strong> -d2, <strong>Bite</strong>
            d6</p></div></div></div><div class="spacer-col"><p></p></div><div
            class="col"><div class="creature-image"><img title="Antideer"
            src="modules/morkborg-cult-feretory/assets/eat-prey-kill/antideer.webp"></div><div
            class="creature-block"><h2>Flayed Vulture</h2><div
            class="description"><p><span class="num">2</span>
            @UUID[Compendium.morkborg-cult-feretory.feretory-actors.8PHkKsIQKW0MvsTd]{Flayed
            Vulture} <span class="name rollable" data-roll="1d8">(D8)</span>.
            <span class="text">Flightless but fearless
            climbers.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 3, <strong>Morale</strong>
            -, <strong>Tough skin</strong> -d2, <strong>Bite/Claws</strong>
            d4</p></div></div><p></p><div
            class="creature-block"><h2>Ratbit</h2><div
            class="description"><p><span class="num">3</span> <span
            class="text">In a human-sized hole made with 10 inch claws lived a
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.0a9mx7UFCMp1BwWL]{Ratbit}.</p></div><div
            class="stat-block"><p><strong>HP</strong> 6, <strong>Morale</strong>
            -, <strong>Claws</strong> d8</p></div></div><p></p><div
            class="creature-block"><h2>Tusked Bison</h2><div
            class="description"><p><span class="num">6</span>
            @UUID[Compendium.morkborg-cult-feretory.feretory-actors.euuUzQwsehvLivX0]{Tusked
            Bison} <span class="text">are among the kindest creatures—as long as
            you stay well away from them and their own. Fighting one brings d4
            more.</span></p></div><div class="stat-block"><p><strong>HP</strong>
            16, <strong>Morale</strong> -, <strong>Tough skin</strong> -d4,
            <strong>Tusks</strong> d8</p></div></div></div></div></div>
