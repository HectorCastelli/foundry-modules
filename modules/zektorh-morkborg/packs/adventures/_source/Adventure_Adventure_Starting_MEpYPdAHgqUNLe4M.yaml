      - sort: 2000000
        name: The Nameless Scriptures
        type: text
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <div class="the-dying-world the-nameless-scriptures"><div
            class="top-line"><p>The Calendar of Nechrubel – The Nameless
            Scriptures. Transcribed by Anuk Schleger the monk.</p></div><div
            class="cols"><div class="col"><div class="psalm"><div
            class="psalm-name"><p>PSALM I</p></div><div class="verse"><p>1:1 The
            City shall be made hollow. Of those who rest in hollowness, they
            shall not be seen.</p></div><div class="verse"><p>1:2 And the earth
            shall shake and be riven. And from the cracks shall rise a poisonous
            mist, and in ten days it will shroud the world.</p></div><div
            class="verse"><p>1:3 Of those who build mightily, stone by stone, so
            shall they fall, stone by stone.</p></div><div class="verse"><p>1:4
            And the depths of the underworld shall bring forth flying spectres
            and crawling beasts. In their passing the worm grows fat, the
            vulture weary.</p></div><div class="verse"><p>1:5 Doubt is crowned.
            The loyal shall turn their blades on those who silver
            gave.</p></div><div class="verse"><p>1:6 And blood-cough shall
            spread like fire across the wastelands of the
            drought.</p></div></div><div class="psalm"><div
            class="psalm-name"><p>PSALM II</p></div><div class="verse"><p>2:1 As
            at the beginning, so at the end, all manner of fly and wasp shall
            fill the air.</p></div><div class="verse"><p>2:2 And the ground pale
            with maggots.</p></div><div class="verse"><p>2:3 And from the
            Spears: a frost. Born from Bergen Chrypt and covering
            all.</p></div><div class="verse"><p>2:4 And in ten days and one the
            writings of sorcerers will be made pale as air.</p></div><div
            class="verse"><p>2:5 And glass shall become quartz.</p></div><div
            class="verse"><p>2:6 And SHE shall see HIM grow stronger. And SHE
            reveals herself and all shall be slain.</p></div></div><div
            class="psalm"><div class="psalm-name"><p>PSALM III</p></div><div
            class="verse"><p>3:1 At Graven-Tosk the soil shall grow warm and
            those who rest be made to walk.</p></div><div class="verse"><p>3:2
            In the heart of Sarkash fog and dusk shall breathe beneath the
            waking trees. That which was hewed by man shall now hew in its
            turn.</p></div><div class="verse"><p>3:3 And hunger shall come among
            you. You shall dig roots and pull children from the breast. The
            gaunt shall prey upon the gaunt.</p></div><div class="verse"><p>3:4
            The great shall be made poor and the poor poorer
            still.</p></div><div class="verse"><p>3:5 Then shall come rain
            unending and the day shall be made night by its
            coming.</p></div><div class="verse"><p>3:6 Brother shall slay
            Brother and Sister poison Sister.</p></div></div></div><div
            class="spacer-col"><p></p></div><div class="col"><div
            class="psalm"><div class="psalm-name"><p>PSALM IV</p></div><div
            class="verse"><p>4:1 For five days and five nights mothers flesh
            shall be the cloak of demons.</p></div><div class="verse"><p>4:2 And
            for five days and five nights shall fathers weep.</p></div><div
            class="verse"><p>4:3 Look to the West. Forth comes fire, and a
            horde, and the Kingdoms burn.</p></div><div class="verse"><p>4:4 The
            liar, Arkh shall make knots of the hearts of men, sundering the
            strongest of bonds.</p></div><div class="verse"><p>4:5 Behold now
            the Endless Sea, where Leviathan causes waves to be as
            mountains.</p></div><div class="verse"><p>4:6 And Leviathan shall
            come among you. Children winter-born and fated to fall before snow,
            both shall it take.</p></div></div><div class="psalm"><div
            class="psalm-name"><p>PSALM V</p></div><div class="verse"><p>5:1 The
            lake and brook shall blacken and the water become tar.</p></div><div
            class="verse"><p>5:2 The trees shall wither, shrivel and
            die.</p></div><div class="verse"><p>5:3 And birds shall fall dead
            from the sky.</p></div><div class="verse"><p>5:4 In one night all
            those not yet of seven years and seven days shall pass. Born and
            unborn. And dawn shall give them life as eaters of
            men.</p></div><div class="verse"><p>5:5 The sky shall weep fire and
            a great stone shall plummet as a city fallen from heaven. Its gift
            is Death and madness is its herald.</p></div><div
            class="verse"><p>5:6 And the last King and the last Queen shall
            wither to dust. Their wretched courts are devoured by
            wolves.</p></div></div><div class="psalm"><div
            class="psalm-name"><p>PSALM VI</p></div><div class="verse"><p>6:1
            You shall know the last day is come. The sun shall set and never
            rise.</p></div><div class="verse"><p>6:2 And day shall be as night
            and night as day. You shall not sleep, neither shall you
            wake.</p></div><div class="verse"><p>6:3 Anthelia shall have her
            will and drink all colour from the world.</p></div><div
            class="verse"><p>6:4 Those who walk on two legs shall be nameless as
            the beasts of the field.</p></div><div class="verse"><p>6:5 The
            earth shall vein, bringing black serpents forth from within the
            earth.</p></div><div class="verse"><p>6:6 And the unnamed enter the
            earth, passing through the Veil as it is sundered by Daejmon, the
            left underling of Nechrubel.</p></div></div><div class="psalm"><div
            class="psalm-name"><p>PSALM VII THE LAST</p></div><div
            class="verse"><p>7:7 All praise Yetsabu-Nech, the underworld’s
            nightmare, the black disk which stands before the sun! All praise
            Verhu, beaming with delight! All praise the fire which burns all!
            And the darkness shall swallow the
            darkness.</p></div></div></div></div></div>
