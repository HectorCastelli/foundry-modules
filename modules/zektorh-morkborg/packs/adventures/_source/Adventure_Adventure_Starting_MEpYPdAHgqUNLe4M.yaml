        text:
          format: 1
          content: "<div class=\"the-game fanged-deserter\"><div class=\"title\"><p>Fanged Deserter</p></div><div class=\"intro\"><p>You have thirty or so friends who never let you down: YOUR TEETH. Disloyal, deranged or simply uncontrollable, any group that didn’t boot you out you left anyway. But your parliament of teeth—enormous, protruding, thick and sharp —have always been your allies. <span class=\"create-scvm\" data-uuid=\"Compendium.morkborg.mork-borg-items.2hjl45o4vXOgRgfq\">Make One</span></p><p class=\"bite-attack\"><strong>Bite Attack:</strong> DR10 to attack, d6 damage. You must be close to your target. 1–2 on d6 chance the enemy gets a free attack.</p><p class=\"begins-with\">Begins with <span class=\"rollable\" data-roll=\"2d6*10\">2d6 × 10s</span> and <span class=\"rollable\" data-roll=\"1d2\">d2 Omens</span>. HP: Toughness + <span class=\"rollable\" data-roll=\"1d10\">d10</span></p></div><div class=\"bottom-grid\"><div class=\"earliest-memories\"><div class=\"table-title\"><p>Earliest Memories<br>(d6@DRAW[Compendium.morkborg.mork-borg-tables.bzmoXQlWwxWkvu1A]{Earliest Memories})</p></div><ol><li>A burnt-black building in Sarkash. Your home?</li><li>A derelict rotting ship rolling endlessly across a grey sea.</li><li>A brothel in Schleswig. Quite a friendly environment.</li><li>Sleeping with dogs in the corner of an inn, waiting for someone to return.</li><li>Following an army in eastern Wästland.</li><li>Suckling a wolf in the wild of Bergen Chrypt.</li></ol></div><div class=\"abilities-col\"><div class=\"abilities\"><div class=\"abilities-title\"><p>Abilities</p></div><p>Built like a Bull, <span class=\"rollable\" data-roll=\"3d6+2\">roll 3d6+2</span> for Strength. Not a bright spark, <span class=\"rollable\" data-roll=\"3d6+1\">roll 3d6-1</span> for Agility and Presence. Normal Agility tests are DR14 instead of DR12, excluding defence. Illiterate; you are incapable of understanding scrolls. If you begin with one then reroll, eat it or use it as toilet paper. You also begin with one of the following (d6@DRAW[Compendium.morkborg.mork-borg-tables.hkaet3Zymn4ZWUBz]{Fanged Deserter Items}):</p></div><div class=\"you-also-begin\"><div class=\"item\"><p class=\"name\">1\_ Crumpled Monster Mask</p><p class=\"text\">Strikes primitive fear into lesser creatures like goblins, gnoums and children. While worn, they check Morale every round.</p></div><div class=\"item\"><p class=\"name\">2\_ The Brown Scimitar of Galgenbeck</p><p class=\"text\">A stinking sword you pulled from a military shit-ditch. D6 damage. DR10 attack and defence while you wield it. 1 in 6 chance a wounded enemy is smitten with potent sepsis, dying in 10 minutes.</p></div><div class=\"item\"><p class=\"name\">3\_ Wizard Teeth</p><p class=\"text\">Four weird teeth rattle within a blackened pouch. Before battle roll a d6 for each one. For every 6 one of your attacks deals maximum damage.</p></div><div class=\"item\"><p class=\"name\">4\_ Old Sigûrd’s Sling</p><p class=\"text\">Sigûrd was the strongest man whose throat you ever gnawed. Woven from his long grey hair, this sling has never failed you. 2d4 damage, requires fist- sized rocks which, perhaps regrettably, are everywhere.</p></div><div class=\"item\"><p class=\"name\">5\_ Ancient Gore-Hound</p><p class=\"text\">Asthmatic, deluded and on its last legs, this wizened creature still has a superb nose and can sniffle up treasure in the most disgusting debris. Attacks with DR10 (bite d6). Defends with DR12, 10 HP. Becomes frenzied around goblins and berserkers.</p></div><div class=\"item\"><p class=\"name\">6\_ The Shoe of Death’s Horse</p><p class=\"text\">It looks normal but since finding it in an obscure crypt you are convinced this shoe came from the horse of Death himself. In your hands it hits with DR10, d4 damage. 1 in 6 chance the shoe smashes the skull, instantly killing small-to-medium sized creatures. The shoe returns to your hand like a boomerang.</p></div></div></div></div></div>"
