      - sort: 1700000
        name: The Western Kingdom
        type: text
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <div class="the-dying-world the-western-kingdom"><div
            class="page-grid"><img class="title" title="The Western Kingdom"
            alt="The Western Kingdom"
            src="modules/morkborg-core/assets/the-dying-world/the-western-kingdom-text.webp"><div
            class="text"><p class="description">, called <em>Wästland</em> in
            the songs of the simple and rhymes of the poor, once home to peace
            and wealth when <strong>Lake Onda</strong> gifted fish and the
            river-trade thrived.</p><p class="indented">Now, terror and
            despotism stalk. In the secret citadel of the sad-but-gaudy city of
            Schleswig <strong>King Fathmu IX</strong> schemes. Paranoid, fat and
            increasingly mad, he is consumed with psychosis and invisible
            fears.</p><p class="pink-bottom">Obsessed with the prophecies of
            Verhu, the King raids and invades houses and villages, barns and
            temples. Nowhere and no one is safe, especially the poor. Taxed into
            starvation, the contents of their larders and storehouses are carted
            off by Fathmu’s men.</p></div><img class="people" title="Western
            Kingdom People" alt="Western Kingdom People"
            src="modules/morkborg-core/assets/the-dying-world/the-western-kingdom-people.webp"></div></div>
