      - sort: 300000
        name: The Monster Approaches
        type: text
        _id: sYoLwnn3coKZecip
        title:
          show: false
          level: 1
        image: {}
        text:
          format: 1
          content: "<div class=\"monster-generator\"><div class=\"top-instruction\"><p>- Roll 3d12. Read these tables from A to C. Save the dice. - <br>Or, @UUID[Compendium.morkborg-cult-feretory.feretory-macros.i9TMT2HKrZAbBLT0]{Place your faith in Nechrubel}</p></div><div class=\"the-monster-approaches\"><img title=\"The monster approaches\" src=\"modules/morkborg-cult-feretory/assets/monster-generator/the-monster-approaches.webp\"></div><div class=\"monster-tables\"><div class=\"row header\"><div class=\"num-col\"><p>\_</p></div><div class=\"a-col\"><p><span class=\"col-title\">TABLE A@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.pg9tYf9U1jgkpF3M]{Table A}</span><br><span class=\"col-subtitle\">d12</span></p></div><div class=\"b-col\"><p><span class=\"col-title\">TABLE B@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.x5ebmoOWYkrPYzKK]{Table B}</span><br><span class=\"col-subtitle\">d12 with</span></p></div><div class=\"c-col\"><p><span class=\"col-title\">TABLE C@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.BGgSpqNC9CPjWrIt]{Table C}</span><br><span class=\"col-subtitle\">d12 it's</span></p></div></div><div class=\"row\"><div class=\"num-col\"><p>1</p></div><div class=\"a-col\"><p>dragging one limb</p></div><div class=\"b-col\"><p>blood-caked fur,</p></div><div class=\"c-col\"><p>hissing and it cuts like a knife.</p></div></div><div class=\"row\"><div class=\"num-col\"><p>2</p></div><div class=\"a-col\"><p>bent like a coat hanger</p></div><div class=\"b-col\"><p>filthy claws like swords,</p></div><div class=\"c-col\"><p>bleeding from every orifice.</p></div></div><div class=\"row\"><div class=\"num-col\"><p>3</p></div><div class=\"a-col\"><p>winged and flapping</p></div><div class=\"b-col\"><p>blood-shot eyes,</p></div><div class=\"c-col\"><p>radiating a dizzying magnetism.</p></div></div><div class=\"row\"><div class=\"num-col\"><p>4</p></div><div class=\"a-col\"><p>distorted, walking on the “wrong” limbs</p></div><div class=\"b-col\"><p>shrunken arms,</p></div><div class=\"c-col\"><p>clucking twisted words.</p></div></div><div class=\"row\"><div class=\"num-col\"><p>5</p></div><div class=\"a-col\"><p>over-endowed in tentacles</p></div><div class=\"b-col\"><p>throbbing exposed glands,</p></div><div class=\"c-col\"><p>fading in and out of sight.</p></div></div><div class=\"row\"><div class=\"num-col\"><p>6</p></div><div class=\"a-col\"><p>shimmering as if unreal</p></div><div class=\"b-col\"><p>acid-wet flesh,</p></div><div class=\"c-col\"><p>crooning disgustingly.</p></div></div><div class=\"row\"><div class=\"num-col\"><p>7</p></div><div class=\"a-col\"><p>ash-grey, wide-eyed and ghost-gaunt</p></div><div class=\"b-col\"><p>a face like a rotting intestine,</p></div><div class=\"c-col\"><p>absorbing all sound, eerie dead quiet.</p></div></div><div class=\"row\"><div class=\"num-col\"><p>8</p></div><div class=\"a-col\"><p>blindingly white</p></div><div class=\"b-col\"><p>impaling spikes,</p></div><div class=\"c-col\"><p>spasmodically skittering close.</p></div></div><div class=\"row\"><div class=\"num-col\"><p>9</p></div><div class=\"a-col\"><p>crawling like liquid</p></div><div class=\"b-col\"><p>a broad sewer-reeking maw,</p></div><div class=\"c-col\"><p>dying, dead, perhaps reanimated.</p></div></div><div class=\"row\"><div class=\"num-col\"><p>10</p></div><div class=\"a-col\"><p>clearly once-human</p></div><div class=\"b-col\"><p>scabious feathers,</p></div><div class=\"c-col\"><p>covered in its own spawn.</p></div></div><div class=\"row\"><div class=\"num-col\"><p>11</p></div><div class=\"a-col\"><p>vibrating and steaming like a kettle</p></div><div class=\"b-col\"><p>protruding bones,</p></div><div class=\"c-col\"><p>leaking sulfuric, corrosive oil from its bulbous gut.</p></div></div><div class=\"row\"><div class=\"num-col\"><p>12</p></div><div class=\"a-col\"><p>visibly necrotic</p></div><div class=\"b-col\"><p>long, wispy hair,</p></div><div class=\"c-col\"><p>more metal than flesh.</p></div></div></div></div>"
