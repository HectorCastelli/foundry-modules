      - sort: 150000
        name: Goroloth - The Consuming-Shadow
        type: text
        system: {}
        title:
          show: true
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <p>A shapeless collection of flesh, muscle, and coin, acquired
            through the numerous deals done over the ages. It's form shifts and
            wanes constantly, making it's silhouette an uncomfortable sight to
            behold.</p><p>They can be hired by sacrificing something of true
            value, which is then absorbed. Once the price is paid, deals are
            always honored, eventually… unless someone pays a bigger price to
            prevent that.</p>
