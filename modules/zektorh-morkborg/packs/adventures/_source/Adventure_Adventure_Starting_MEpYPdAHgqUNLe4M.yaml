      - sort: 3600000
        name: Cursed Skinwalker
        type: text
        _id: 87vl3LgSYAYF2hWi
        title:
          show: false
          level: 1
        image: {}
        text:
          format: 1
          content: "<div class=\"optional-classes cursed-skinwalker\"><div class=\"two-cols\"><div class=\"col\"><div class=\"header-block\"><img title=\"Cursed Skinwalker\" src=\"modules/morkborg-cult-feretory/assets/cursed-skinwalker/title.webp\"><p class=\"subtitle\"><span class=\"yellow-bg\">A SHAPE-SHIFTING CLASS</span></p><p><strong>By</strong> Karl Druid</p></div><p><strong>You should have died,</strong> but something grabbed hold of your soul as it seeped into the river of Death and sealed you once again in mortal flesh. Only, this time, the cage is not yours alone-in the afterlife’s currents your soul mingled with another dying creature’s leaving you halved. Now you live a shared existence, locked in everlasting struggle between man and monster. You should have died. <span class=\"create-scvm\" data-uuid=\"Compendium.morkborg-cult-feretory.feretory-items.ZuSWpDI76OliQUrE\">[Make One]</span></p><p><span class=\"yellow-bg\">Begins with <strong class=\"rollable\" data-roll=\"2d6*10\">2d6×10s</strong> and <strong class=\"rollable\" data-roll=\"1d2\">d2 Omens</strong>.</span></p><p><span class=\"yellow-bg rollable\" data-roll=\"1d8\"><strong>HP:</strong> Toughness + d8</span></p><p></p><div class=\"section\"><div class=\"section-title\"><p>First Died (d6)@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.c3QQfNXIjOXCKRvs]{First Died}</p></div><div><p>1 \_ Clutching a lover’s body.<br>2 \_ By an arrow in the brain.<br>3 \_ Minutes after birth.<br>4 \_ By a friend’s hand.<br>5 \_ Murdered in your bed.<br>6 \_ On the back of a plague-cart.</p></div></div><p></p><div class=\"section\"><div class=\"section-title\"><p>Abilities</p></div><p>Weakened mind, <span class=\"rollable\" data-roll=\"3d6-2\">roll 3d6-2</span> for Presence. Bestial instincts, <span class=\"rollable\" data-roll=\"3d6+1\">roll 3d6+1</span> for Strength and Toughness. Roll d6 @DRAW[Compendium.morkborg.mork-borg-tables.qYznag89iDMdPH6A]{Starting Weapon}{1d6} on the weapon and d2 @DRAW[Compendium.morkborg.mork-borg-tables.Cyg5IvubZiDmCCUk]{Starting Armor}{1d2} on the armor table.</p><p><em><strong>You can give into your antithetical other’s advances reshaping your anatomy into its likeness.</strong></em> Shifting your bones requires a single painful round. Armor and weapons are likely unusable in your new form. One (1) of the following stands ever at your existence’s other side:</p></div></div><div class=\"spacer-col\"><p></p></div><div class=\"col\"><div class=\"section-title\"><p>Creature Shapes (d6)@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.dq8KNV9QVAzMrvPn]{Creature Shapes}</p></div><div class=\"shape-title\"><p>1. MURDER-PLAGUED RAT</p></div><ul><li><strong>Tiny:</strong> Agility tests, including Defence, are DR8.</li><li>Your <strong>bite</strong> (d4) carries disease—DR14 Presence Test or they attack their closest ally until either dies.</li></ul><div class=\"shape-title\"><p>2. FLAYED AND DRIPPING WOLF</p></div><ul><li><strong>Ferocious,</strong> attacks are DR10.</li><li>Your <strong>fangs</strong> additionally crit on a natural 19 triggering a Morale test.</li><li><strong>Slick from blood,</strong> -d2 incoming damage.</li></ul><div class=\"shape-title\"><p>3. BONESKULLED RAVEN</p></div><ul><li><strong>Fast and flying,</strong> defence is DR10. Make two claw (d4) attacks per round.</li><li>Your <strong>bony scalp</strong> acts as a weapon and shield: -1 damage and you may choose to ignore all damage from one attack. The skull heals in d6 days.</li></ul><div class=\"shape-title\"><p>4. BEAR FROM BERGEN CHRYPT</p></div><ul><li><strong>Hulking and massive:</strong> tests for Strength, Toughness and attacks are DR10. Defense is DR14.</li><li><strong>Thick hide:</strong> -d4 incoming damage.</li><li>Your <strong>claws and bite</strong> deal d8 damage.</li></ul><div class=\"shape-title\"><p>5. LIFE-AND-DEATH-LIZARD</p></div><ul><li><strong>Regenerate</strong> d4 HP per round.</li><li><strong>Bite</strong> (d6) or spit acid (d4, 1-in-4 chance armor lowers one tier).</li><li><strong>Scaly skin,</strong> -d2 incoming damage.</li></ul><div class=\"shape-title\"><p>6. DOOMSAYING MONKEY</p></div><ul><li><strong>Dextrous:</strong> Agility tests, including Defence, are DR10.</li><li><strong>Light armor and weapons remain usable.</strong></li><li><strong>Your third eye</strong> allows you to read unclean scrolls at DR10.</li></ul></div></div></div>"
