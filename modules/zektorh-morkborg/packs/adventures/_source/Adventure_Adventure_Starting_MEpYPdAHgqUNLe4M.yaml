      - sort: 2100000
        name: Wästland
        type: text
        _id: gsX6iToNqLIqt0GO
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <div class="eat-prey-kill creatures"><div
            class="region-title"><p>Wästland@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.aMH86SyVYoqhi4Hi]{Wästland}</p></div><div
            class="two-cols"><div class="col"><div
            class="creature-block"><h2>Liar-Bird</h2><div
            class="description"><p><span class="num">1</span> <span
            class="text">When the
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.V7y9h4CmIDX6XNSm]{Liar-Bird}
            <span class="text">hears a lie it latches onto every word repeating
            them when it sitors pleases. Sought-after by inqui and others tasked
            with uprooting falsehood. Of course, sometimes it repeats a truth
            instead. For fun.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 2, <strong>Morale</strong>
            -, <strong>Beak</strong> d4</p></div></div><p></p><div
            class="creature-block"><h2>Feather Fox</h2><div
            class="description"><p><span class="num">3</span> <span
            class="text">The
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.FjDqBNNle7LJhc4j]{Feather
            Fox} <span class="text">is notorious for its ability to move silent
            like a shadow, while leaving no trail or tracks. Its hollow bones
            are perfect for making bone pipes. Break one of them, drink the
            magical mercury inside, and you’ll be as light as a feather for an
            hour. Your head will be, too.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 3, <strong>Morale</strong>
            -, <strong>Bite</strong> d6</p></div></div><p></p><div
            class="creature-block"><h2>Schleswig Bogfeeder</h2><div
            class="description"><p><span class="num">5</span> <span
            class="text">The
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.sy48mbZsGRf3gscd]{Schleswig
            Bogfeeder} <span class="name rollable" data-roll="1d6">(D6)</span>
            <span class="text">is completely domesticated, meaning the ones
            you’ve tracked down belong to someone. Better do this quickly before
            anyone notices.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 5, <strong>Morale</strong>
            8, <strong>Bite</strong> d4</p><p><strong>Special:</strong> The pigs
            need to be killed in one round before squealing. Otherwise fight
            <span class="name rollable" data-roll="1d4">(D4)</span>
            @UUID[Compendium.morkborg-cult-feretory.feretory-actors.r99tnAmGc9q8xRiy]{Farmers}:
            HP 4, Morale 6, 50% chance they carry a tool or knife
            (d4).</p></div></div><p></p></div><div
            class="spacer-col"><p></p></div><div class="col"><div
            class="creature-block"><h2>Three-Thirds-Pheasant</h2><div
            class="description"><p><span class="num">2</span> <span
            class="text">A
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.OFS0kzTUvutyF5QV]{Three-Thirds-Pheasant}
            <span class="text">is completely and utterly a pheasant, it’s just
            not necessarily the same pheasant. Be it a third head or a third
            knee, it always has a third of something.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 3, <strong>Morale</strong>
            -, <strong>Beak</strong> d4</p></div></div><div
            class="creature-image"><img title="Bautaboar"
            src="modules/morkborg-cult-feretory/assets/eat-prey-kill/bautaboar.webp"></div><div
            class="creature-block"><h2>Bautaboar</h2><div
            class="description"><p><span class="num">4</span> <span
            class="text">There are said to be only thirteen
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.GsbomWoT2SCJQwsT]{Bautaboar}
            <span class="text">left in Wästland, which doesn’t stop anyone from
            killing one on sight. A mouthful of its meat expands, weighing like
            a feast in the belly—known to burst babies and those with small
            appetites.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 16,
            <strong>Morale</strong> -, <strong>Thick hide</strong> -d4,
            <strong>Gore</strong> d8</p><p><strong>Special:</strong> Eating a
            day’s ration of Bautaboar meat leaves you full for a week and makes
            you feel quite heavy (Defence is DR +2 for the
            duration).</p></div></div><p></p><div
            class="creature-block"><h2>Gold-Crested Filth-Crow</h2><div
            class="description"><p><span class="num">6</span> <span
            class="text">The
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.Lrz6hATB4LxqGmFs]{Gold-Crested
            Filth-Crow} <span class="text">carries a feathery ring of shining
            gold around its collar, a perfect mockery for those unable to afford
            the real thing. It nests in latrine muck seeking chamber pot
            treasures.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 2, <strong>Morale</strong>
            -, <strong>Beak</strong> d4 +
            special</p><p><strong>Special:</strong> Pass a DR10 Toughness test
            or become infected.</p></div></div></div></div></div>
