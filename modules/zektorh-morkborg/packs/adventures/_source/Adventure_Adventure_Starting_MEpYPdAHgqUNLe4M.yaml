      - sort: 150000
        name: Pobelo - Decrepit Timekeeper
        type: text
        system: {}
        title:
          show: true
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <p>They are a fail old man, walking around places where life is
            usually running out. Their thin limbs makes them look like they
            would break at the slightest touch, but they are unfathomably
            powerful in their own way.</p><p>They are in charge of moving time,
            eroding existence at the corners to prolong it where it needs most.
            They are able to control the flow of time at will, revert and speed
            it up, and they use souls to replenish their energies.</p>
