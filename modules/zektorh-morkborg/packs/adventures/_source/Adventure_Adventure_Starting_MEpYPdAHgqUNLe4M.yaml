        text:
          format: 1
          content: >-
            <div class="eat-prey-kill creatures"><div
            class="region-title"><p>Graven-Tosk@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.xmGpTRHIjPlrxjxZ]{Graven-Tosk}</p></div><div
            class="centered"><img title="Giant Skull Moth"
            src="modules/morkborg-cult-feretory/assets/eat-prey-kill/giant-skull-moth.webp"></div><div
            class="two-cols"><div class="col"><div
            class="creature-block"><h2>Giant Skull Moth</h2><div
            class="description"><p><span class="num">1</span> <span
            class="text">The
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.9jRJunuQyuS7OrmX]{Giant
            Skull Moth} <span class="text">has a human-sized skull mark on its
            tar-black wings. Perfect bait for squirrels and tomb raiders
            alike.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 3, <strong>Morale</strong>
            -, <strong>Stinger</strong> d4 +
            special</p><p><strong>Special:</strong> DR14 Toughness test or d4
            damage and become infected.</p></div></div><p></p><div
            class="creature-block"><h2>Unbred Mutts</h2><div
            class="description"><p><span class="num">3</span> <span
            class="text">It is said
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.yH2XxLoJuEpFOjV3]{Unbred
            Mutts}<span class="name rollable" data-roll="1d6">(D6)</span> <span
            class="text">are the descendants of pedigreed dogs waiting by their
            late masters’ graves. Some say they’re the same dogs, still
            waiting.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 8, <strong>Morale</strong>
            -, <strong>Bite</strong> d6</p></div></div><p></p><div
            class="creature-block"><h2>Meatroach</h2><div
            class="description"><p><span class="num">5</span>
            @UUID[Compendium.morkborg-cult-feretory.feretory-actors.iftFd26PR7vkvXyt]{Meatroach}
            <span class="text">is a delicacy if cooked right, but first you have
            to remove the poisonous murder- appendix (DR16 Agility test).
            Failure spoils the meat (DR14 Toughness or d8
            damage).</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 4, <strong>Morale</strong>
            -, <strong>Exoskeleton</strong> -d4, <strong>Bite</strong>
            d4</p></div></div></div><div class="spacer-col"><p></p></div><div
            class="col"><div class="creature-block"><h2>Twice-Grown Corpse
            Flies</h2><div class="description"><p><span class="num">2</span>
            @UUID[Compendium.morkborg-cult-feretory.feretory-actors.dIwcXV2qezMgaJIG]{Twice-Grown
            Corpse Flies'} <span class="text">larva go through two cocooning
            stages, in two different hosts, before emerging—bulging, bloated,
            and starving for more.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 4, <strong>Morale</strong>
            -, <strong>Exoskeleton</strong> -d4, <strong>Bite</strong> d4 +
            special</p><p><strong>Special:</strong> DR12 Toughness test or a
            dozen fly eggs are implanted. Get them out within d6 days or watch
            them hatch in your corpse.</p></div></div><p></p><div
            class="creature-block"><h2>Grim-Toothed Squirrel</h2><div
            class="description"><p><span class="num">4</span> <span
            class="text">The
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.Zc1vJ4u8Ex5haLTQ]{Grim-Toothed
            Squirrel's} <span class="text">teeth are made for cracking bones and
            savoring the marrow within.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 2, <strong>Morale</strong>
            6, <strong>Bite</strong> d6</p></div></div><p></p><div
            class="creature-block"><h2>Half-Billed Raven</h2><div
            class="description"><p><span class="num">6</span> <span
            class="text">The
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.ZzFraWJfYPmtEahJ]{Half-Billed
            Raven}<span class="name rollable" data-roll="1d4">(D4)</span> <span
            class="text">has only its upper beak, and a sticky, reaching tongue
            beneath.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 2, <strong>Morale</strong>
            -, <strong>Beak/Choking tongue</strong> d4 +
            special</p><p><strong>Special:</strong> DR12 Agility test to avoid
            or d4 damage/round until a successful DR14 Strength test or raven
            dies.</p></div></div></div></div></div>
