</p></div><div><p>Lygan</p></div><div><p>\_</p></div><div><p>4</p></div><div><p>Margar</p></div><div><p>\_</p></div><div><p>5</p></div><div><p>Merkari</p></div><div><p>\_</p></div><div><p>6</p></div><div><p>Nagl</p></div><div><p>\_</p></div><div><p>7</p></div><div><p>Niduk</p></div><div><p>\_</p></div><div><p>8</p></div><div><p>Nifehl</p></div><div><p>5</p></div><div><p>1</p></div><div><p>Prügl</p></div><div><p>\_</p></div><div><p>2</p></div><div><p>Qillnach</p></div><div><p>\_</p></div><div><p>3</p></div><div><p>Risten</p></div><div><p>\_</p></div><div><p>4</p></div><div><p>Svind</p></div><div><p>\_</p></div><div><p>5</p></div><div><p>Theras</p></div><div><p>\_</p></div><div><p>6</p></div><div><p>Therg</p></div><div><p>\_</p></div><div><p>7</p></div><div><p>Torvul</p></div><div><p>\_</p></div><div><p>8</p></div><div><p>Törn</p></div><div><p>6</p></div><div><p>1</p></div><div><p>Urm</p></div><div><p>\_</p></div><div><p>2</p></div><div><p>Urvarg</p></div><div><p>\_</p></div><div><p>3</p></div><div><p>Vagal</p></div><div><p>\_</p></div><div><p>4</p></div><div><p>Vatan</p></div><div><p>\_</p></div><div><p>5</p></div><div><p>Von</p></div><div><p>\_</p></div><div><p>6</p></div><div><p>Vrakh</p></div><div><p>\_</p></div><div><p>7</p></div><div><p>Vresi</p></div><div><p>\_</p></div><div><p>8</p></div><div><p>Wemut</p></div></div></div><div class=\"occult-treasures\"><div class=\"title\"><h2>d10 occult treasures</h2><p>@DRAW[Compendium.morkborg-core.core-tables.OdmF38QApWMwkpNK]{d10 Occult Treasures}</p></div><ol class=\"two-cols\"><li><strong>Ash-grey ring</strong> a finger-width wide. All that passes through is obliterated.</li><li><p>The keening music of this small, <strong>vile flute</strong> animates a fetus-sized meat golem in a nearby corpse. <br><strong>HP</strong> 5 <strong>Morale</strong> - <strong>No armor</strong> <strong>Bite</strong> d4, immune to Powers.</p></li><li>A note explains: one taste from this <strong>Famine Spoon</strong> means death from slow starvation.</li><li>The image of a being in this malevolently-accurate <strong>mirror</strong> shows only the shameful truth of their soul.</li><li><strong>Vampiric Phurba.</strong> Heals you as it harms your target (d3), but beware: after stealing a total of 6 HP, test Presence DR14 or become addicted—you must then test Presence DR12 daily. Fail and you must stab someone with the knife before next sunrise. Or wither to ash and die as the sun rises.</li><li>A black <strong>pearl.</strong> If dropped in darkness it rolls towards the nearest exit to day.</li><li>This <strong>torch</strong> burns for an immortal hour. Hold it and live. You can lose limbs and enter negative HP but won’t die unless you drop the torch or it burns out.</li><li>Silver <strong>bird cage</strong> slays whatever is placed behind its bars, slowly, over one long night. That which is killed reanimates twice as strong, as a raging uncontrollable undead.</li><li><strong>Black Crown of the Crippled King.</strong> Wearing this crooks your body as you become aware that you and every creature within 100 yards gain +10 to attack rolls but −10 to defence rolls. Rolls that go above 20 count as crits, and below 1 as fumbles. The worn crown can only be removed in the pale light of a full moon.</li><li>Anyone wearing this ancient <strong>blindfold</strong> becomes invisible to those who breathe though the undead attack them obsessively and nearby corpses awaken in moaning, unholy wrath.</li></ol></div><div class=\"traps-and-devilry\"><div class=\"title\"><h2>Traps and Devilry@DRAW[Compendium.morkborg-core.core-tables.95FLX98JyX6ZSbL9]{Traps and Devilry}</h2></div><ol><li>Well dressed corpse, booby trapped</li><li>Wall-holes shoot poisonous arrows</li><li>Bells and marbles on the floor</li><li>Scorpion-filled basket poised to fall</li><li>Fish hooks hanging at eye level</li><li>Chest marked with explosive runes</li><li>Lock trapped with vial of poison gas</li><li>Jewel removal leads to roof collapse</li><li>Slanted floor, translucent oil, pit</li><li>Snake-cages on collapsing ceiling tiles</li><li>Evil urns release cold ghosts</li><li>Coins coated in grime and poison</li></ol></div><div class=\"weather\"><div class=\"title\"><h2>Weather@DRAW[Compendium.morkborg-core.core-tables.ZOaUiv9mhLVlYpcx]{Weather}</h2></div><ol><li>Lifeless grey</li><li>Hammering rain</li><li>Piercing wind</li><li>Deafening storm</li><li>Black as night</li><li>Dead quiet</li><li>Cloudburst</li><li>Soup-thick mist</li><li>Crackling frost</li><li>Irritating drizzle</li><li>Roaring thunder</li><li>Gravelike cold</li></ol></div></div><div class=\"corpse-plundering\"><div class=\"title\"><h2>Corpse Plundering@DRAW[Compendium.morkborg-core.core-tables.MM1B7CC1BiYw6F55]{Corpse Plundering}</h2></div><div class=\"item first-one\"><p>11–16. The remains of something worthless crumbles in your hands.</p></div><div class=\"plundering-items cols\"><div class=\"col\"><div class=\"item\"><p>21. Pot filled with extremely potent itching ointment.</p></div><div class=\"item\"><p>22. Necklace of human teeth.</p></div><div class=\"item\"><p>23. Bag of angry, venomous moths. Test Toughness DR6 or die.</p></div><div class=\"item\"><p>24. Pocket full of broken glass, PC takes d2 damage.</p></div><div class=\"item\"><p>25. Mad manifesto. If read, test Presence DR12 or lose 1 Presence permanently from confusion.</p></div><div class=\"item\"><p>26. Key to nearby locked door. Stolen.</p></div><div class=\"item\"><p>31. Map to a weak but wealthy family’s house.</p></div><div class=\"item\"><p>32. A hopeless amount of spiders.</p></div><div class=\"item\"><p>33. Metal cylinder with gunpowder and fuse. Roll a d6. <br>1–2 you lose a hand. 3–6 3d10 damage wherever it lands.</p></div></div><div class=\"spacer-col\"><p></p></div><div class=\"col\"><div class=\"item\"><p>34. Known and liked/despised witch-hunter’s face. Flayed.</p></div><div class=\"item\"><p>35. Note with PC’s names. One is crossed out.</p></div><div class=\"item\"><p>36. Tortured pixie with torn-off wings and gouged out eyes.</p></div><div class=\"item\"><p>41. Map to a place that cannot possibly exist.</p></div><div class=\"item\"><p>42. Unmarked bottle with a liquid that shifts between red and green.</p></div><div class=\"item\"><p>43. Bond. A local potentate owes the holder a sizable amount.</p></div><div class=\"item\"><p>44. Death mask of one of the PCs.</p></div><div class=\"item\"><p>45. The ‘Water of Life.’ Heals d8. Test Toughness DR10 or go blind. Highly alcoholic.</p></div><div class=\"item\"><p>46. There was something very wrong with this one. Hands covered with something lukewarm, brown and acidic. Take d2+1 damage and smell terrible for d4 days.</p></div></div><div class=\"spacer-col\"><p></p></div><div class=\"col\"><div class=\"item\"><p>51. Black Kergüs dagger. 2d4 damage.</p></div><div class=\"item\"><p>52. Labelled poison bottle. Test Toughness DR12 or lower random ability by d4. The ability can be increased when your character is improved.</p></div><div class=\"item\"><p>53. Scalp with long black hair.</p></div><div class=\"item\"><p>54. Golden ball with an invisible seam, twists open.</p></div><div class=\"item\"><p>55. Bloodstained knuckle-duster.</p></div><div class=\"item\"><p>56. Two weighted dice.</p></div><div class=\"item box\"><p>61–66. The result in silver.</p></div></div></div></div></div>"
