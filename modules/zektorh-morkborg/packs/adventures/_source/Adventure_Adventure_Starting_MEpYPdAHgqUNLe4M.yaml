      - sort: 4600000
        name: The Black Salt
        type: text
        _id: i1CgZTqknNUhOnrS
        title:
          show: false
          level: 1
        image: {}
        text:
          format: 1
          content: "<div class=\"the-black-salt\"><p class=\"quote\"><strong>\"Dynhall offered blood-gold on this beast, a Wyvern. Terrorized them for months, scooping up children from the streets and tearing open roofs. We tracked it, killed it. Hard work and spilled blood for blood-claimed gold. We set up camp, just to tend wounds and quench thirst. A day maybe we thought. Then came the storm of Black Salt. We stitched tents from the beast's flesh, sheltered in its stinking ribs. Oh how I hate this salt! Somehow it seems to KNOW when I must catch my breath.\"</strong></p><p><span class=\"white-bg\">—Schleik Grav, corpse hunter</span></p><p></p><div class=\"two-cols intensity\"><div class=\"col\"><p><strong>Roll for the Black Salt Wind’s intensity.</strong></p><p>Springing from despair itself, the Black Winds echoed through Tombs, Palaces and places deep beneath the earth. Scholars link the Black Salt Winds to places like the Valley of the Unfortunate Undead, the Wästland plains and catacombs or crypts plagued by cannibalism.</p></div><div class=\"col\"><div class=\"wind-table\"><div class=\"row\"><div class=\"text\"><p>Wind Strength d4 @DRAW[Compendium.morkborg-cult-feretory.feretory-tables.2V6UbIYWPAGK2Sg9]{Wind Strength}</p></div><div class=\"num\"><p>Test Toughness</p></div></div><div class=\"row white-bg\"><div class=\"text\"><p>A weak, vile gust</p></div><div class=\"num\"><p>DR 8</p></div></div><div class=\"row white-bg\"><div class=\"text\"><p>Sickly cursed salt-breeze</p></div><div class=\"num\"><p>DR 10</p></div></div><div class=\"row white-bg\"><div class=\"text\"><p>Terror-gale, sky blackens</p></div><div class=\"num\"><p>DR 14</p></div></div><div class=\"row white-bg\"><div class=\"text\"><p>Flesh-ripping storm, a crystalline hurricane</p></div><div class=\"num\"><p>DR 16</p></div></div></div></div></div><div class=\"the-salt-suffering\"><div class=\"row header-row\"><div class=\"num\"><p>d12</p></div><div class=\"text\"><p>THE SALT-SUFFERING—consequences of a failed test@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.YBUZQuph8yHBNfOs]{The Salt Suffering}</p></div></div><div class=\"row\"><div class=\"num\"><p>1</p></div><div class=\"text\"><p>Your eyes burn, you weep black tears forming a facial salt crust. Presence and Agility a reset to –2 for d4 hours.</p></div></div><div class=\"row\"><div class=\"num\"><p>2</p></div><div class=\"text\"><p>The black rime infiltrates every orifice and crack. Presence is set to –2 for d2 days.</p></div></div><div class=\"row\"><div class=\"num\"><p>3</p></div><div class=\"text\"><p><strong>YOUR FLESH BEGINS TO MELT AWAY.</strong> Without intervention this is fatal in d4 hours.</p></div></div><div class=\"row\"><div class=\"num\"><p>4</p></div><div class=\"text\"><p><strong>Your skin blisters and breaks out in black boils popping like ripe fruit. Lose d6 HP.</strong></p></div></div><div class=\"row\"><div class=\"num\"><p>5</p></div><div class=\"text\"><p><em>You begin to read patterns in the black wind warning of your doom. You refuse to touch a weapon for d2 days.</em></p></div></div><div class=\"row\"><div class=\"num\"><p>6</p></div><div class=\"text\"><p><strong>Maddened with rage, you would kill the wind if you could, and care not if you live or die.</strong> Attacks test DR8 and deal +3 damage. Defense tests are DR18. You calm down after a day.</p></div></div><div class=\"row\"><div class=\"num\"><p>7</p></div><div class=\"text\"><div class=\"two-cols\"><div class=\"col\"><p><strong>EVEN YEARS AFTERWARDS<br>YOU SEE AND TASTE THE SALT.</strong></p></div><div class=\"col\"><p>From this day, whenever you or your companions must fight or hide, 1-in-6 chance you won’t take part.</p></div></div></div></div><div class=\"row\"><div class=\"num\"><p>8</p></div><div class=\"text\"><p><strong>The Black Salt Hand.</strong> You soon begin to believe one salt-stained hand has grown into a foot, and vice versa. You fiercely resist attempts to correct the madness.</p></div></div><div class=\"row\"><div class=\"num\"><p>9</p></div><div class=\"text\"><p><span>B L A C K \_ S A L T \_ B L O A T.</span> Your gut bloats, <strong>everything tastes of salt</strong> to the point of sickening and you cannot sleep. <strong>Lose d4 HP/day for d4 days.</strong></p></div></div><div class=\"row\"><div class=\"num\"><p>10</p></div><div class=\"text\"><p>Brutal and unending <em><strong>soot cough.</strong></em> You spray black saline ichor. Rumored cures range from healing fountains to terrible blood rituals. Without treatment you perish in d2 weeks.</p></div></div><div class=\"row\"><div class=\"num\"><p>11</p></div><div class=\"text\"><p><strong>The Old Salt Madness—the salt wind sings within you!</strong> It wants you to (d6)</p><p>1-4 Make enemies of everyone you meet. Insult them, accuse them of terrible crimes, mock them <strong>loudly.</strong></p><p>5-6 <em>Befriend every creature you see.</em></p><p> Another PC may try to talk you out of this once per day with a DR16 Presence test.</p></div></div><div class=\"row\"><div class=\"num\"><p>12</p></div><div class=\"text\"><p>You choke: the Black Salt fills your lungs! <strong>YOU DIE A PAINFUL DEATH.</strong></p></div></div></div><p></p></div>"
