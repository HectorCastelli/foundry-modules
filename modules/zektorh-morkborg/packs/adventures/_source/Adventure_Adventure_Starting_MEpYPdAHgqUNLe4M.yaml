        text:
          format: 1
          content: >-
            <div class="the-tenebrous-reliquary reliquary-51-56"><div
            class="wrapper"><div class="rel-item chaos-blade"><div
            class="num"><p><span class="yellow-bg">51.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.cEPYPW919wIWtuOW]{Chaos
            Blade}</p></div><div class="credits"><p>by Leander E.</p></div><div
            class="text"><p>Zweihänder dealing 2d8 damage. On maximum damage the
            Power Death is cast.</p></div></div><div class="rel-item
            chains-of-death"><div class="num"><p><span
            class="yellow-bg">52.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.Zi79dAN5bYbOoZ1y]{Chains
            of Death}</p></div><div class="credits"><p>by Ripley
            C.</p></div><div class="text"><p>A set of frigid black manacles. If
            you die wearing them, they unlatch ensnaring your killer and drag
            them to another world before vanishing.</p></div></div><div
            class="rel-item claw-of-the-sloth"><div class="num"><p><span
            class="yellow-bg">53.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.WM1lSJ8zlWWIivRT]{Claw
            of the Sloth}</p></div><div class="credits"><p>by Ben
            H.</p></div><div class="text"><p>Dagger (d4 damage), on a 1, attack
            and defense DR against that target are -2 next round.</p><p>If DR
            reaches 0 the target is frozen in place,
            permanently.</p></div></div><div class="rel-item
            blood-of-the-serpents"><div class="num"><p><span
            class="yellow-bg">54.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.ariDxu29i2R4hF0h]{Blood
            of the Serpents}</p></div><div class="credits"><p>by Leander
            E.</p></div><div class="text"><p>Green-red (highly acidic and
            poisonous) liquid which turns blood neon green and spreads through
            bodily liquids. <br>When the infected is attacked, their attacker
            tests Agility DR12 to dodge a spray of blood (reduces Armor one tier
            and transmits the condition).</p></div></div><div class="rel-item
            crown-of-burning-stars"><div class="num"><p><span
            class="yellow-bg">55.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.Lm4OYRSWHH1PxZGk]{Crown
            of Burning Stars}</p></div><div class="credits"><p>by Leander
            E.</p></div><div class="text"><p>Adds Omens equal to the number of
            Miseries that have transpired to each character’s pool. Miseries now
            occur on 1 &amp; 2.</p></div></div><div class="rel-item
            book-of-oblivion"><div class="num"><p><span
            class="yellow-bg">56.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.dHb2m4L55tq1bAfs]{Book
            of Oblivion}</p></div><div class="credits"><p>by Anders
            Arpi</p></div><div class="text"><p>A sentient black leather tome
            with blank pages. With a Presence DR12 test a creature can
            permanently transfer knowledge—a thought or a memory— to the book,
            forgetting the thing transferred. On failure the book takes
            something extra.</p><p>You can learn anything the book previously
            absorbed before for something you don’t want to give
            it.</p></div></div></div></div>
