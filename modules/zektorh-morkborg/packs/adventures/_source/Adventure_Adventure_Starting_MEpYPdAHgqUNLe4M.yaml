      - sort: 4900000
        name: Troubling Tales
        type: text
        title:
          show: false
          level: 3
        image: {}
        text:
          format: 1
          content: >-
            <div class="the-game troubling-tales"><div class="centered"><img
            class="title" title="Troubling Tales" alt="Troubling Tales"
            src="modules/morkborg-core/assets/the-game/troubling-tales-text.webp"></div><div
            class="intro"><p>The whole group can share the same backstory, or
            groups within the group can share a tale. Or the GM can quickly give
            history to a seemingly mundane character.</p><p
            class="centered">Roll
            d20@DRAW[Compendium.morkborg-core.core-tables.T8dFro6zsmptXNBH]{Troubling
            Tales} or throw a knife.</p></div><div class="tales-grid"><div
            class="tale"><div class="num"><p>1</p></div><div
            class="text"><p>Pursued for manslaughter. There is a
            bounty.</p></div></div><div class="tale"><div
            class="num"><p>2</p></div><div class="text"><p>In massive debt. The
            debt is being traded to successively more ruthless
            groups.</p></div></div><div class="tale"><div
            class="num"><p>3</p></div><div class="text"><p>Have a rare, sought
            after item.</p></div></div><div class="tale"><div
            class="num"><p>4</p></div><div class="text"><p>Have a cursed
            never-healing wound.</p></div></div><div class="tale"><div
            class="num"><p>5</p></div><div class="text"><p>Had an illegal,
            immoral and secret affair with a member of the royal family. Has
            proof.</p></div></div><div class="tale"><div
            class="num"><p>6</p></div><div class="text"><p>Escaped cult member.
            Terrified and paranoid. Other cultists are
            everywhere.</p></div></div><div class="tale"><div
            class="num"><p>7</p></div><div class="text"><p>An identity thief who
            recently killed and replaced this person.</p></div></div><div
            class="tale"><div class="num"><p>8</p></div><div
            class="text"><p>Banished and disowned for unspecified deeds. Can
            never go home.</p></div></div><div class="tale"><div
            class="num"><p>9</p></div><div class="text"><p>Deserted military
            after witnessing a massacre, bounty on head. Hunted by former
            friends.</p></div></div><div class="tale"><div
            class="num"><p>10</p></div><div class="text"><p>Very recently
            murdered a close relative. <em>Very
            recently.</em></p></div></div><div class="tale"><div
            class="num"><p>11</p></div><div class="text"><p>A puzzle cube has
            been calibrated incorrectly (or has it?), awakening a slumbering
            abomination.</p></div></div><div class="tale"><div
            class="num"><p>12</p></div><div class="text"><p>Evil creatures love
            the scent of your spoor and are drawn to it, bringing disaster in
            your wake.</p></div></div><div class="tale"><div
            class="num"><p>13</p></div><div class="text"><p>A battle wound left
            a shard of metal slowly inching closer to your heart. Every day
            there is a 2 % chance it reaches it.</p></div></div><div
            class="tale"><div class="num"><p>14</p></div><div
            class="text"><p>Violence forced you into the wilderness. You think
            waving trees are whispering. You talk to, scream at, attack
            trees.</p></div></div><div class="tale"><div
            class="num"><p>15</p></div><div class="text"><p>Cursed to share the
            nightmares of others, you sleep far, far away.</p></div></div><div
            class="tale"><div class="num"><p>16</p></div><div class="text"><p>At
            permanent war with all corvids. No contact without some violence.
            You carry a sling.</p></div></div><div class="tale"><div
            class="num"><p>17</p></div><div class="text"><p>After dreaming of an
            underground temple to a forgotten god you understand the songs of
            insects and worms.</p></div></div><div class="tale"><div
            class="num"><p>18</p></div><div class="text"><p>Being tracked and
            observed by a golem after an agreement which you know has been wiped
            from your mind.</p></div></div><div class="tale"><div
            class="num"><p>19</p></div><div class="text"><p>“Burn or be burned”
            is the fate you accept.</p></div></div><div class="tale"><div
            class="num"><p>20</p></div><div class="text"><p>Your flesh heals
            twice as fast, but your companions twice as slow. You see a
            many-eyed “guardian angel.”</p></div></div></div></div>
