      - sort: 1200000
        name: Sarkash
        type: text
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <div class="the-dying-world sarkash"><p class="intro">In Tveland
            also lies</p><img class="title" title="Sarkash" alt="Sarkash"
            src="modules/morkborg-core/assets/the-dying-world/sarkash-text.webp"><p>The
            forest seems, lately, to spread unnaturally fast. Paths tangle and
            wind in the overgrown gloom, leading wanderers astray. Far in the
            depths of Sarkash, always where one least expects to find it, in a
            halo of dying trees, is <span
            class="graven-tosk">Graven-Tosk.</span> A truly ancient cemetery
            filled with mausoleums, blank-eyed cherubs, stagnant fountains,
            plague pits and ordinary graves.</p><div class="forest
            flex"><figure><img class="forest" title="Sarkash forest"
            alt="Sarkash forest"
            src="modules/morkborg-core/assets/the-dying-world/sarkash-forest.webp"></figure><p
            class="outro">But hasn’t it grown warmer in this usually cold place?
            Do you hear the frantic scratching? The air feels heavy, stale and
            hard to breathe.</p></div></div>
