        image: {}
        text:
          format: 1
          content: "<div class=\"bedeviled-dungeons\"><div class=\"col-grid\"><div class=\"left-col\"><div class=\"title\"><p>One of the many</p><p>\_bedeviled dungeons</p></div><p class=\"generate-link\">@UUID[Compendium.morkborg-core.mork-borg-core-macros.dQwx1ejqIBuE3YTb]{Generate one}</p><div class=\"what-is-it-called bottom-white\"><div class=\"table-title\"><p>WHAT IS IT CALLED?</p><p class=\"die-roll\">roll d12 twice@DRAW[Compendium.mork-borg-core-tables.XSkmhG23q9GDTImN]{What is it called? (1)}@DRAW[Compendium.morkborg-core.core-tables.BAJAnp5G0cL8hz6E]{What is it called? (2)}</p></div><div class=\"called-grid\"><div><p></p></div><div><p>1</p></div><div><p>2</p></div><div><p>3</p></div><div><p>4</p></div><div><p>5</p></div><div><p>6</p></div><div><p>7</p></div><div><p>8</p></div><div><p>9</p></div><div><p>10</p></div><div><p>11</p></div><div><p>12</p></div><div><p>The ...</p></div><div><p>Slaughter</p></div><div><p>Death</p></div><div><p>Night</p></div><div><p>Hadean</p></div><div><p>Hell</p></div><div><p>Plague</p></div><div><p>Sin</p></div><div><p>Doom</p></div><div><p>Dark</p></div><div><p>Murder</p></div><div><p>Torture</p></div><div><p>Slave</p></div><div><p></p></div><div><p>pit</p></div><div><p>church</p></div><div><p>temple</p></div><div><p>tunnels</p></div><div><p>crypt</p></div><div><p>grave</p></div><div><p>fort</p></div><div><p>ziggurat</p></div><div><p>den</p></div><div><p>maze</p></div><div><p>house</p></div><div><p>waste</p></div></div></div><div class=\"status bottom-white\"><div class=\"table-title\"><p>STATUS (D6@DRAW[Compendium.morkborg-core.core-tables.oqUihbFu6oTZlcc0]{Status})</p></div><div class=\"status-grid\"><div><p>1–2</p></div><div><p>Still active</p></div><div><p>3–6</p></div><div><p>Inactive, because (d4)</p></div></div><div class=\"because-grid\"><div><p>1</p></div><div><p>The place was invaded</p></div><div><p>2</p></div><div><p>Everything ended in disaster</p></div><div><p>3</p></div><div><p>It was no longer needed</p></div><div><p>4</p></div><div><p>A Misery was fulfilled, roll to see which one</p></div></div></div><div class=\"imminent-danger\"><div class=\"table-title\"><p>Imminent Danger</p><p class=\"die-roll\">d10@DRAW[Compendium.morkborg-core.core-tables.yxTsrW6904Kyz8G9]{Imminent danger}</p></div><div class=\"danger-grid\"><div><p>1</p></div><div><p>Is slowly flooding with (d4): 1–2 oil, 3–4 water</p></div><div><p>2</p></div><div><p>Berserkers are appearing</p></div><div><p>3</p></div><div><p>Is about to collapse</p></div><div><p>4</p></div><div><p>Senses are being distorted</p></div><div><p>5</p></div><div><p>Underworld emissions of poisonous spores</p></div><div><p>6</p></div><div><p>A hunted cult intends it to be their new hideout</p></div><div><p>7</p></div><div><p>A terrible, dormant curse about to be unleashed</p></div><div><p>8</p></div><div><p>Fire is spreading from the deepest chamber</p></div><div><p>9</p></div><div><p>The gate will shut and seal, and not open again until seven days have passed</p></div><div><p>10</p></div><div><p>A lethal mechanism is about to activate</p></div></div></div></div><div class=\"right-col\"><div class=\"who-or-what left-white bottom-white\"><div class=\"table-title\"><p>Who or what dwells here now?</p><p class=\"die-roll\">(d12@DRAW[Compendium.morkborg-core.core-tables.vMVOy9T8XBv3l7Yh]{Who or what dwells here now?})</p></div><div class=\"who-grid\"><div><p>1</p></div><div><p>Animated suits of armor battling goblins</p></div><div><p>2</p></div><div><p>Nechrubel-worshipping lich with a skeletal court</p></div><div><p>3</p></div><div><p>Heretic cult lead by a possessed 11-year old</p></div><div><p>4</p></div><div><p>A vengeful cabal of undead porcelain dolls</p></div><div><p>5</p></div><div><p>Desperate thieves guild dying slowly of cholera</p></div><div><p>6</p></div><div><p>A meaty mass of slime, larvae and spider legs</p></div><div><p>7</p></div><div><p>Wickheads running from foreboding darkness</p></div><div><p>8</p></div><div><p>A Bark-Witch and her root-children</p></div><div><p>9</p></div><div><p>Four-legged pale gremlins stinking of dirt</p></div><div><p>10</p></div><div><p>Tergol’s escaped experiment</p></div><div><p>11</p></div><div><p>Disease spreading ochre-beetles</p></div><div><p>12</p></div><div><p>Dissident courtiers dedicated to the occult</p></div></div></div><div class=\"distinctive-feature left-white bottom-white\"><div class=\"table-title\"><p>Distinctive Feature</p><p class=\"die-roll\">d12@DRAW[Compendium.morkborg-core.core-tables.eMd6wC7Mb6E8AAvz]{Distinctive feature}</p></div><div class=\"feature-grid\"><div><p>1</p></div><div><p>Portal to the land of the dead, soon ready</p></div><div><p>2</p></div><div><p>Lab where corpses are assembled into golems</p></div><div><p>3</p></div><div><p>Black prism which twists all Powers</p></div><div><p>4</p></div><div><p>300 emaciated, mutilated prisoners</p></div><div><p>5</p></div><div><p>Blind hermit, firmly rooted in the ground, spreading his vile corruption</p></div><div><p>6</p></div><div><p>Bony remains of the Basilisk’s spawn</p></div><div><p>7</p></div><div><p>Obelisk that separates body and soul</p></div><div><p>8</p></div><div><p>Rooms move around the dungeons center</p></div><div><p>9</p></div><div><p>High ceilings, whispers in the upper dark</p></div><div><p>10</p></div><div><p>Artwork affecting the surroundings</p></div><div><p>11</p></div><div><p>Ensnaring, intelligent plants</p></div><div><p>12</p></div><div><p>Giant pools of boiling tar</p></div></div></div><div class=\"sample-rooms left-white\"><div class=\"draw-or-find-a-map\"><p>Draw or find a map. Around 10 rooms is enough for one night’s session.</p></div><div class=\"sample-rooms-grid\"><div class=\"header\"><p>d4</p></div><div class=\"header\"><p>d6</p></div><div class=\"header\"><p>SAMPLE ROOMS@DRAW[Compendium.morkborg-core.core-tables.WuC1hjOcL4omd56K]{Sample Rooms}</p></div><div><p>1</p></div><div><p>1</p></div><div class=\"inscriptions\"><p>Inscriptions, the motifs are (d6)</p><div class=\"inscription-grid boxed\"><div><p>1</p></div><div><p>Vomit-inducing</p></div><div><p>2</p></div><div><p>Terrifying</p></div><div><p>3</p></div><div><p>Hypnotic</p></div><div><p>4</p></div><div><p>Childish</p></div><div><p>5</p></div><div><p>Teleportation causing</p></div><div><p>6</p></div><div><p>Ugly and pointless</p></div></div></div><div><p></p></div><div><p>2</p></div><div><p>Bloodied beds</p></div><div><p></p></div><div><p>3</p></div><div><p>Flooded</p></div><div><p></p></div><div><p>4</p></div><div><p>Leaning</p></div><div><p></p></div><div><p>5</p></div><div><p>Stinks</p></div><div><p></p></div><div><p>6</p></div><div><p>Fire damage</p></div><div><p>2</p></div><div><p>1</p></div><div><p>Obvious traps</p></div><div><p></p></div><div><p>2</p></div><div><p>Full of blood</p></div><div><p></p></div><div><p>3</p></div><div><p>Torture chamber</p></div><div><p></p></div><div><p>4</p></div><div><p>Sooty walls</p></div><div><p></p></div><div><p>5</p></div><div><p>Freezing draft</p></div><div><p></p></div><div><p>6</p></div><div><p>Creaking doors</p></div><div><p>3</p></div><div><p>1</p></div><div><p>Compact darkness</p></div><div><p></p></div><div><p>2</p></div><div><p>Locked sarcophagi</p></div><div><p></p></div><div><p>3</p></div><div class=\"shelves\"><p>Shelves with (d4)</p><p class=\"boxed\">1–2 obscure literature <br>3–4 rotting food</p></div><div><p></p></div><div><p>4</p></div><div><p>Abyssal pits</p></div><div><p></p></div><div><p>5</p></div><div><p>Mirrors everywhere</p></div><div><p></p></div><div><p>6</p></div><div><p>Ungodly yet exquisite chandeliers</p></div><div><p>4</p></div><div><p>1</p></div><div><p>Utterly silent</p></div><div><p></p></div><div><p>2</p></div><div><p>Full of debris</p></div><div><p></p></div><div><p>3</p></div><div class=\"altar\"><p>Sacrificial altar (d4)</p><p class=\"boxed\">1–2 cracked <br>3–4 fresh blood</p></div><div><p></p></div><div><p>4</p></div><div><p>Remains of a throne</p></div><div><p></p></div><div><p>5</p></div><div><p>Smoke-filled</p></div><div><p></p></div><div><p>6</p></div><div><p>Bonfire in the center</p></div></div></div></div></div></div>"
