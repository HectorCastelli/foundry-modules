      - sort: 3100000
        name: Reliquary 41-46
        type: text
        _id: cDlhXQEPwgZfVhX5
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <div class="the-tenebrous-reliquary reliquary-41-46"><div
            class="wrapper"><div class="rel-item eye-of-horus"><div
            class="num"><p><span class="yellow-bg">41.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.LHuijsy671fORFhp]{Eye
            of Horus}</p></div><div class="credits"><p>by Dom
            Cohen</p></div><div class="text"><p>Placed upon the forehead, the
            eye grants vision into the abyss, at a price.</p><p>When checking
            for traps, you see your grisly death from a less-careful timeline,
            allowing you to better find a workaround.</p><p>Overland travel is
            mired with difficulty as you wade through the
            corpses.</p></div></div><div class="rel-item
            finger-paintings-of-the-insane"><div class="num"><p><span
            class="yellow-bg">42.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.QoF7eSYR9JAKuRN2]{Finger
            Paintings of the Insane}</p></div><div class="credits"><p>by Dom
            Cohen</p></div><div class="text"><p>Slick, oily paints forever wet
            upon an old wooden palette. Those touching any of the colours must
            test Toughness DR12 or lose themselves for a minute painting the
            nearest surface with heretical imagery.</p><p>Marking scrolls’ text
            with the paint imbues them with those lost to the pigments’ souls,
            -d4 from the Presence test to cast.</p></div></div><div
            class="rel-item flower-of-disease"><div class="num"><p><span
            class="yellow-bg">43.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.XszhCJDRU8FTNUVV]{Flower
            of Disease}</p></div><div class="credits"><p>by Leander
            E.</p></div><div class="text"><p>Seeds for a quickly spreading
            thorny weed with a poisonous aroma. Can swallow a small village in
            two days if not fought. Weak against boiled oil. Fire does
            nothing.</p></div></div><div class="rel-item foehammer"><div
            class="num"><p><span class="yellow-bg">44.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.lhlozz2cf898fXdM]{Foehammer}</p></div><div
            class="credits"><p>by Leander E.</p></div><div
            class="text"><p>Cursed warhammer (2d6 damage) whose wielder develops
            a new grudge with a random person daily. Lasting until Foehammer
            caves their head in. Neglecting a grudge for too long counts as an
            infection.</p></div></div><div class="rel-item
            cauldron-of-lies"><div class="num"><p><span
            class="yellow-bg">45.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.8Z1o6gN4wEPTT5DR]{Cauldron
            of Lies}</p></div><div class="credits"><p>by Leander
            E.</p></div><div class="text"><p>Beverages cooked in this cauldron
            and shared allows all imbibers to recognize when another is lying
            for a month.</p><p>Used in cults and secret societies to single out
            traitors.</p></div></div><div class="rel-item
            cursed-tongue-of-the-naga"><div class="num"><p><span
            class="yellow-bg">46.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.6LI86DqdyqVXyaQj]{Cursed
            Tongue of the Naga}</p></div><div class="credits"><p>by Dom
            Cohen</p></div><div class="text"><p>Putting this long, forked tongue
            into a skull pushes the skull upright, which screams bloody filth
            whilst running about on each tongue-tip.</p></div></div></div></div>
