      - sort: 3400000
        name: The Grey Galth Inn
        type: text
        _id: Egh9DjZcQWJjtb6e
        title:
          show: false
          level: 1
        image: {}
        text:
          format: 1
          content: >-
            <div class="the-grey-galth-inn page-1"><div
            class="would-you-prefer-the-select-menu"><div class="two-cols"><div
            class="col"><div class="white-block skew-minus-1"><div
            class="title"><p>Would you prefer the select menu? (4s)
            (d6)@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.MypTL4XnhC8BVgWs]{Would
            you prefer the select menu? (4s)}</p></div><ol><li>Braised chicken
            with dangerously alcoholic wine-drenched apples.</li><li>Spiced
            rutabaga swede from dark Sarkash soil, a
            delicacy.</li><li>Galgenbeckian stew with whole embryonic boars.
            Delicious!</li><li>Tveland yam-hash with sliced pungent
            tomb-truffle.</li><li>Migol’s pie (blackened venison and chicken
            bone broth jelly).</li><li>Black soup with baked hog
            face.</li></ol><div class="title"><p>Ah, I see, you lack funds. (2s)
            (d6)@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.x9XQehSomQ2Zq558]{Ah,
            I see, you lack funds. (2s)}</p></div><ol><li>Watery femur soup. The
            femur is large. It’s been there a while.</li><li>Thick Ooze soup! At
            least one chunk. The Ooze is Pure, I assure you!</li><li>Sour celery
            pudding with a side of
            Compressed-Last-Weeks-Meat.</li><li>Gloomberry Mix. (Toughness DR12
            to avoid explosive diarrhea).</li><li>“Goblin’s Gall,” famous
            mud-swamp broth. Sourced from local swamps!</li><li>Baked
            Staring-Pig-Head with filled Whispering-Lips. Most won’t touch
            it.</li></ol></div></div><div class="col"><img class="inn-sign"
            title="The Grey Galth Inn"
            src="modules/morkborg-cult-feretory/assets/the-grey-galth-inn/inn-sign.webp"></div></div></div><div
            class="white-block why-is-the-innkeeper-twitching skew-1"><div
            class="title"><p>Why is the Innkeeper Twitching?
            (d10)@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.zmvq9iK2iDEWJ3NV]{Why
            is the innkeeper twitching?}</p></div><div class="two-cols"><div
            class="col"><ol><li>Katleen “the Castrator” Keen, the bandit Queen,
            is hiding in the loft.</li><li>Thinks you are the Lokr cult who
            promised to come in disguise and bury them alive (the cult is
            already here).</li><li>Three different children from three different
            guest families vanished in the night without a sound or
            trace.</li><li>They say the Two-Headed Basilisks are at large and
            searching for heathens.</li><li>Judging by the droppings, something
            has gotten into... well, everything (Toughness DR12 or lose d4 HP
            vomiting.)</li></ol></div><div class="spacer-col"><p></p></div><div
            class="col"><ol><li>Jorat-Tug’s rowdy gang were recently reanimated
            by... something. He’s too scared to tell them they are
            dead.</li><li>Old man Agar is exhibiting his infectious ulcers. Soon
            he’ll start popping them to a jaunty beat.</li><li>One patron is
            clearly a disguised necromancer. (Nearly all are, that one is just
            bad at disguises).</li><li>Clear and audible scratching from the
            cellar hatch. Everyone else ignores it.</li><li>Their caged bird has
            stopped singing and started speaking
            prophecy.</li></ol></div></div></div><div class="white-block
