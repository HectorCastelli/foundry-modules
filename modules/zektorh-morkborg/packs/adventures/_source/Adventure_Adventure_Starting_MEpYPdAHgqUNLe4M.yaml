  - name: Show my sheet
    type: script
    _id: bSTosWAdyqAKt4ZX
    img: modules/game-icons-net/whitetransparent/cement-shoes.svg
    scope: global
    command: |-
      const myCharacter = game.user.character;

      if (myCharacter) {
          // Toggle the sheet: close if open, open if closed
          if (myCharacter.sheet.rendered) {
              myCharacter.sheet.close();
          } else {
              myCharacter.sheet.render(true);
          }
      } else {
          ui.notifications.warn("You do not have a character assigned to your user!");
      }
