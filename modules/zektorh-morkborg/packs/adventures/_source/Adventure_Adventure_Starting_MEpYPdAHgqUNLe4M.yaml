      - sort: 3800000
        name: Pale One
        type: text
        _id: 5qhFeuzPiGefmAgR
        title:
          show: false
          level: 1
        image: {}
        text:
          format: 1
          content: "<div class=\"optional-classes pale-one\"><div class=\"two-cols\"><div class=\"col\"><div class=\"header-block\"><img title=\"Pale One\" src=\"modules/morkborg-cult-feretory/assets/pale-one/title.webp\"><p class=\"subtitle\"><span class=\"yellow-bg\">AN ALIEN CLASS</span></p><p><strong>By</strong> Tim Rudloff \_ <br><strong>Proofreading</strong> Karl Druid</p></div><p><strong>You lurk on settlements’ fringes observing,</strong> perhaps judging, but rarely interacting. You are fundamentally other and belong nowhere. You experience bouts of incoherent madness and self-destructive rages but, mostly, you await the inevitable in solitary resignation. <span class=\"create-scvm\" data-uuid=\"Compendium.morkborg.mork-borg-items.Item.wLJV0VJT5I234obT\">[Make One]</span></p><p><span class=\"yellow-bg\">Begins with <strong class=\"rollable\" data-roll=\"1d6*10\">d6×10s</strong> and <strong class=\"rollable\" data-roll=\"1d4\">d4 Omens</strong>.</span></p><p><span class=\"yellow-bg rollable\" data-roll=\"1d6\"><strong>HP:</strong> Toughness + d6</span></p><p></p><div class=\"section\"><div class=\"section-title\"><p>Unspoken Origins (d6)@DRAW[Compendium.morkborg.mork-borg-tables.RollTable.dvC0nKnaweuFzRB2]{Unspoken origins}</p></div><div><p>1 \_ Caught by fishermen on the Endless sea.<br>2 \_ Accidentally summoned by cultists in Graven-Tosk.<br>3 \_ Vomited by a foul beast in Bergen Chrypt.<br>4 \_ Fell from the Sky near Alliáns.<br>5 \_ Hatched from a Bog-Witch egg laid in a Wästland swamp.<br>6 \_ Crawled from a crack in the ground near Grift.</p></div></div><p></p><div class=\"section\"><div class=\"section-title\"><p>Abilities</p></div><p> Your mind and movements are alien (+1 Agility and Presence) but your bones are hollow and fragile (-2 Toughness). Roll d6 @DRAW[Compendium.morkborg.mork-borg-tables.qYznag89iDMdPH6A]{Starting Weapon}{1d6} on the weapon table and d2 @DRAW[Compendium.morkborg.mork-borg-tables.Cyg5IvubZiDmCCUk]{Starting Armor}{1d2} on the armor table. You are literate, <em>but only in dead languages</em> and cannot use scrolls. However, <strong>you can intuitively use <span style=\"text-decoration:underline\">one</span> randomly rolled Power</strong> @DRAW[Compendium.morkborg.mork-borg-tables.xcTMusoyWFKMYfaM]{All Scrolls} determined daily at dawn or dusk (pick one).</p></div></div><div class=\"spacer-col\"><p></p></div><div class=\"col\"><div class=\"section-title\"><p>Pale One Blessings (d6)@DRAW[Compendium.morkborg.mork-borg-tables.RollTable.JTPZzt0ohT5tbWp6]{Pale One blessings}</p></div><div class=\"shape-title\"><p>1. THE STARS WERE RIGHT</p></div><p>Roll d4+2 for omens. Say something cryptic when you use one.</p><div class=\"shape-title\"><p>2. MEMBRANOUS WINGS</p></div><p>You can fly short distances but cannot wear armor. Birds dislike you.</p><div class=\"shape-title\"><p>3. UNCOMMON CLAY</p></div><p>You can draw nourishment from soil but normal food sickens you. You smell like mushrooms.</p><div class=\"shape-title\"><p>4. MANA FROM SOMEWHERE</p></div><p>Spend a use of your Powers to create weirdly delicious (but unsettling) food for d6 people.</p><div class=\"shape-title\"><p>5. DIGITIGRADE LIMBS</p></div><p>You escape any bindings and fit through tiny spaces. -4 DR to tests involving flexibility.</p><div class=\"shape-title\"><p>6. TOO MANY EYES</p></div><p>Just way too many. You cannot be attacked from surprise. You may spend a use of your Powers to leave an eye behind and spy remotely (you take d2 damage if the eye is squished).</p><p></p><div class=\"section-title\"><p>You call yourself ... (3d20)</p></div><div class=\"two-cols left-numbered\"><div class=\"col\"><p><br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10<br>11<br>12<br>13<br>14<br>15<br>16<br>17<br>18<br>19<br>20<br></p></div><div class=\"spacer-col\"><p></p></div><div class=\"col\"><p>@DRAW[Compendium.morkborg.mork-borg-tables.RollTable.tpVRiy6AF3m5NpDd]{You call yourself... (1)} <br>Abhorred<br>Beneath<br>Clad<br>Errant<br>Familiar<br>Giant<br>Hidden<br>Lyrical<br>Maniacal<br>Nameless<br>Obscene<br>Painful<br>Reposed<br>Skeletal<br>Strong<br>Sudden<br>Unaware<br>Unknowing<br>Vitriolic<br>Westward</p></div><div class=\"spacer-col\"><p></p></div><div class=\"col\"><p>@DRAW[Compendium.morkborg.mork-borg-tables.RollTable.gIigZbaN8VMHbOy0]{You call yourself... (2)} <br>Attacks<br>Attracts<br>Awaits<br>Blackens<br>Chimes<br>Covers<br>Dances<br>Denies<br>Descends<br>Drowns<br>Echoes<br>Proffers<br>Quivers<br>Rains<br>Reflects<br>Returns<br>Seals<br>Submits<br>Weaves<br>Wilts</p></div><div class=\"spacer-col\"><p></p></div><div class=\"col\"><p>@DRAW[Compendium.morkborg.mork-borg-tables.RollTable.uucoGKyQI0erB0fy]{You call yourself... (3)} <br>the Æther<br>the Damned<br>the Decay<br>the Dust<br>the Eye<br>the Face<br>the Flesh<br>the Flies<br>the Flower<br>the Knives<br>the Moon<br>the Mountain<br>the Plague<br>the Prayer<br>the Rats<br>the Saint<br>the Sea<br>the Stranger<br>the Truth<br>the Void</p></div></div></div></div></div>"
