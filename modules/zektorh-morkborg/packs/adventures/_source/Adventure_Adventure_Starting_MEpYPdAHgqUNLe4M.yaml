      - sort: 1500000
        name: Kergüs
        type: text
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <div class="the-dying-world kergus"><div
            class="content-wrapper"><img class="title" title="Kergüs"
            alt="Kergüs"
            src="modules/morkborg-core/assets/the-dying-world/kergus-text.webp"><p>Desolation
            rolls over kergüs like a frostbarren wind. The lawless and forlorn
            trek across its ice-wracked expanse, crawling over the plains or
            cowering in the cracked earth to flee Blood-Countess <span
            class="anthelia">Anthelia</span>. <br>North, where the wind is born,
            lies Alliáns, a storm-piercing spire-city of black glass. Within
            stands a castle like a waterfall of white stone: the throne of
            Anthelia. She as pale as her castle’s walls, as youthful as a drop
            of melting ice. Some say she is eternally young. The gulls cry the
            names of Knights who sought her hand, a reminder that suitors and
            signs of Anthelia’s age disappear in conjunction. But who listens to
            a gull? And in Kergüs, even gulls freeze in the cold that rolls from
            the dreams of the Countess. Dreams of her unending
            youth.</p><p></p><img class="ambivalence" title="Anthelia's
            Ambivalence" alt="Anthelia's Ambivalence"
            src="modules/morkborg-core/assets/the-dying-world/anthelias-ambivalence-text.webp"><p
            class="yellow">Anthelia is well aware time is short. Neuroses burden
            her. <em>“Why is everything so pale? So cold?”</em> She cries out
            for colour or warmth. She drains the world of both with every
            glance, touch and breath. Those who bring her vibrant life are
            promised great rewards. All fear to do so. Excuses are made,
            explanations found. The feelings of the Countess are fragile, her
            powers absolute. Court life entails grey opulence, excitement and
            fear.</p></div></div>
