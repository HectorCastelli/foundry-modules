      - sort: 3300000
        name: Reliquary 61-66
        type: text
        _id: mUA6D3uXkNTGLquY
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <div class="the-tenebrous-reliquary reliquary-61-66"><div
            class="wrapper"><div class="rel-item antlers-of-lightning"><div
            class="num"><p><span class="yellow-bg">61.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.yU0IEYhXU4beIn81]{Antlers
            of Lightning}</p></div><div class="credits"><p>by Dom
            Cohen</p></div><div class="text"><p>Whilst wearing this crackling
            mantle you wield the power of the final storm.</p><p>When reading
            any scroll, flip a coin. On Heads, the scroll’s effects are replaced
            by Nine Violet Signs Unknot the Storm instead.</p><p>Upon death, the
            wearer is struck by lightning, their flesh rending from bone,
            leaving only the mantle.</p></div></div><div class="rel-item
            eyes-and-teeth"><div class="num"><p><span
            class="yellow-bg">62.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.YZq981JcVExDT3mT]{Eyes
            and Teeth}</p></div><div class="credits"><p>by Paul
            Wilde</p></div><div class="text"><p>Replace d10 missing teeth and d2
            eyes. Test Toughness DR14 or rejection causes infection.</p><p>
            Effects of new eyes/teeth (d4):</p><ol><li>Wandering: DR +2 to
            ranged attacks</li><li>Morbid Visions: every rest, share your
            nightmare with the group</li><li>Let there be light! (no ill
            effects)</li><li>SIGHT BEYOND SIGHT! (Test Presence DR10 for eyes to
            twitch in danger’s presence—it’s not YOUR eye though, it can
            lie)</li></ol><ol><li>Toothache: DR +2 to Powers’ Presence
            roll</li><li>Functional but hideous</li><li>You got teeth! (no ill
            effects)</li><li>FANGS! Gain bite attack (D6 damage, on 1-2 enemy
            gets a free attack)</li></ol></div></div><div class="rel-item
            black-candles"><div class="num"><p><span
            class="yellow-bg">63.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.7PMxeA5SZOhcgzG8]{Black
            Candles}</p></div><div class="credits"><p>by Ripley C.</p></div><div
            class="text"><p>When lit the jet-black flame flickers towards the
            greatest threat within a mile (or kilometer).</p></div></div><div
            class="rel-item robe-of-bones"><div class="num"><p><span
            class="yellow-bg">64.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.Xy0Y7rWFVLctzx8J]{Robe
            of Bones}</p></div><div class="credits"><p>by Dom
            Cohen</p></div><div class="text"><p>This lumpy cape rattles in the
            wind. Once daily, you may stare blankly at a humanoid creature as
            the cape guides your hands. <br>With a fold of the robe, the target
            must test DR13 Toughness or a random limb’s bone snaps soundlessly
            as the robe crackles.</p></div></div><div class="rel-item
            ash-of-the-mind"><div class="num"><p><span
            class="yellow-bg">65.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.VANdKr6Zyd1i3Gz6]{Ash
            of the Mind}</p></div><div class="credits"><p>by Paul
            Wilde</p></div><div class="text"><p>Smear a sigil onto one’s palm
            and touch another sentient being to read their thoughts.
            <br>Presence DR12 test or their thoughts become
            yours.</p></div></div><div class="rel-item
            bowels-of-a-baby-killer"><div class="num"><p><span
            class="yellow-bg">66.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.KUaY5IqeV72wrJ9g]{Bowels
            of a Baby Killer}</p></div><div class="credits"><p>by Dom
            Cohen</p></div><div class="text"><p>Take the bowl and drape the
            entrails over you, gaining a monster’s scent. Evil creatures must
            make a DR14 check when attempting to discern your location. Should
            they fail, you pass by unnoticed.</p></div></div></div></div>
