      - sort: 500000
        name: Wants & Traits
        type: text
        _id: YmnxfOjGMbfLGa0r
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <div class="monster-generator wants-and-traits"><div
            class="four-pane"><div class="pane upper-left"><div class="subtitle
            more-title"><p><span class="white-bg">More than anything,<br>it
            wants
            to...@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.dtlNnK6WttdhL5j2]{More
            than anything it wants to...}</span></p></div><div class="roll-table
            more-than-anything left"><div class="row"><div
            class="row-item"><p>1. Collect fresh body parts.</p></div></div><div
            class="row"><div class="row-item"><p>2. Devour every living thing it
            seizes.</p></div></div><div class="row"><div class="row-item"><p>3.
            Escape something worse (roll another creature).</p></div></div><div
            class="row"><div class="row-item"><p>4. Revel in fear—mutilates or
            traumatizes rather than kills.</p></div></div><div class="row"><div
            class="row-item"><p>5. Find and rule fresh
            territory.</p></div></div><div class="row"><div
            class="row-item"><p>6. Praise its obscure god through combat,
            constructing idols from the slain.</p></div></div><div
            class="row"><div class="row-item"><p>7. Become one with another
            creature. Or a PC.</p></div></div><div class="row"><div
            class="row-item"><p>8. Make its way to SHE.</p></div></div><div
            class="row"><div class="row-item"><p>9. Die, but not
            alone.</p></div></div><div class="row"><div class="row-item"><p>10.
            Build a treasure hoard of silver, iron and blood-stained
            steel.</p></div></div></div></div><div class="pane upper-right"><div
            class="roll-table more-than-anything right"><div class="row"><div
            class="row-num"><p>11.</p></div><div class="row-item"><p>Defend its
            territory.</p></div></div><div class="row"><div
            class="row-num"><p>12.</p></div><div class="row-item"><p>Mate,
            birthing a wondrous new horror.</p></div></div><div class="row"><div
            class="row-num"><p>13.</p></div><div class="row-item"><p>Enslave all
            it encounters.</p></div></div><div class="row"><div
            class="row-num"><p>14.</p></div><div class="row-item"><p>Cover
            lifeless corridors and rooms with warm flayed
            skin.</p></div></div><div class="row"><div
            class="row-num"><p>15.</p></div><div class="row-item"><p>Collect
            eyes to see Nechrubel.</p></div></div><div class="row"><div
            class="row-num"><p>16.</p></div><div class="row-item"><p>Cook fresh
            meat in its ever-burning hearth.</p></div></div><div
            class="row"><div class="row-num"><p>17.</p></div><div
            class="row-item"><p>Be sympathized with, petted and cooed over.
            Reacts violently if not.</p></div></div><div class="row"><div
            class="row-num"><p>18.</p></div><div class="row-item"><p>Make
            necklaces of fingers.</p></div></div><div class="row"><div
            class="row-num"><p>19.</p></div><div class="row-item"><p>Build
            stitched-skin dolls stuffed with hair. The bald have no
            worth.</p></div></div><div class="row"><div
            class="row-num"><p>20.</p></div><div
            class="row-item"><p>Specifically and permanently traumatize one
            survivor into total insanity.</p></div></div></div></div><div
            class="pane lower-left"><div class="subtitle title"><p><span
            class="white-bg">Terrible
            Traits@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.Rv6zWlwEejTXtF0K]{Terrible
            Traits}</span></p></div><div class="roll-table terrible-traits
            left"><div class="row"><div class="row-item"><p>1. Sprays acid every
            other round. Normal damage, but 2-in-6 chance of reducing armor one
            tier (additional d4 damage without armor).</p></div></div><div
            class="row"><div class="row-item"><p>2-4. Can, and will converse.
            Attempts to persuade PCs to assist its aim.</p></div></div><div
            class="row"><div class="row-item"><p>5. Can speak and humiliates the
            PCs. -2 Presence for the fight’s duration.</p></div></div><div
            class="row"><div class="row-item"><p>6. Loves choking its victims
            and observing their slow death (-d4 HP/round).Test Agility DR10 to
            avoid, Strength DR14 to escape.</p></div></div><div class="row"><div
            class="row-item"><p>7. Exists partly in an anti-arcane dimension. In
            the vicinity, Powers do not work.</p></div></div><div
            class="row"><div class="row-item"><p>8. Terrifyingly fast: Attacks
            and Defense are DR14.</p></div></div><div class="row"><div
            class="row-item"><p>9. Roll on this table every 3 rounds. Rolled
            again, every second round, etc.</p></div></div></div></div><div
            class="pane lower-right"><div class="roll-table terrible-traits
            right"><div class="row"><div class="row-item"><p>10. Rare-and
            valuable! 200s (alive) 150s (severed head) 80s (vial of
            blood).</p></div></div><div class="row"><div class="row-item"><p>11.
            Extrudes a mist of deadly infectious spores. Everyone in contact
            rolls a d20, dying on a 1.</p></div></div><div class="row"><div
            class="row-item"><p>12. Visibly tumescent. Explodes in a cascade of
            boiling blood upon death: d12 damage equally distributed among
            PCs.</p></div></div><div class="row"><div class="row-item"><p>13.
            Multiplies! When taking exactly 1 damage it splits. The new creature
            is weaker (1⁄2 HP and Morale, reduce armor and damage die one
            step).</p></div></div><div class="row"><div class="row-item"><p>14.
            Petrifying Gaze, Breath or Sting. Every 3 rounds tries to petrify a
            random PC. Test Presence DR10 or have your soul forever enclosed in
            a statue.</p></div></div><div class="row"><div
            class="row-item"><p>15+ Terrible, but not in a great
            way.</p></div></div></div></div></div></div>
          markdown: ''
