        text:
          format: 1
          content: "<div class=\"the-game omens\"><div class=\"content-wrapper\"><div class=\"title\"><p>Omens</p></div><p class=\"jartecken\">“järtecken”</p><div class=\"two-col-grid\"><div><p class=\"clearly-the-eyes\">Clearly the eyes of other powers are upon you, Eldritch watchers or the tangled Fates of alternate worlds. Call it luck if you like. Every class gains a number of Omens. If you play without classes every character begins with <span class=\"rollable\" data-roll=\"1d2\">d2 Omens</span>. When depleted roll the class’ designated die (d2 if playing without classes) and regain that many Omens after resting at least six hours.</p><p></p><p class=\"use-omens-to\">Use Omens to \_ ⮕</p></div><div class=\"omen-wrapper\"><div class=\"omen-list\"><p class=\"omen\">deal maximum damage with an attack</p><p class=\"or\">or</p><p class=\"omen\">reroll a dice roll (yours or someone else’s)</p><p class=\"or\">or</p><p class=\"omen\">lower damage dealt to you by d6</p><p class=\"or\">or</p><p class=\"omen\">neutralize a Crit or Fumble</p><p class=\"or\">or</p><p class=\"omen\">lower one test’s DR by -4</p></div></div></div></div></div>"
