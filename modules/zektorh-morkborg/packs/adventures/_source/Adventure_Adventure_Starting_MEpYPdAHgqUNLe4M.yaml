      - sort: 1900000
        name: The Calendar of Nechrubel
        type: text
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <div class="the-dying-world the-calendar-of-nechrubel"><img
            class="calendar-skull" alt="skull"
            src="modules/morkborg-core/assets/the-dying-world/calendar-skull.webp"><img
            class="calendar-text" title="The Calendar of Nechrubel" alt="The
            Calendar of Nechrubel"
            src="modules/morkborg-core/assets/the-dying-world/the-calendar-of-nechrubel-text.webp"><p
            class="the-world-trembles">The world trembles. One can feel it in
            ways sharp and subtle, mysterious and clear. One by one, inevitable
            events demand their place.</p><div class="cols"><div class="col
            left-col"><p class="big-i">Illustrating this, the Game Master (GM)
            rolls a die each dawn. A result of 1 activates one Misery. The die
            used is determined by the GM and the group.</p><p>The GM then rolls
            d66@DRAW[Compendium.morkborg-core.core-tables.j0I5pWLubzHht4RU]{The
            Nameless Scriptures} to determine which Misery occurs. The same
            Misery will not befall the world twice.</p></div><div
            class="spacer-col"><p></p></div><div class="col right-col"><p
            class="seven-seven"><span>7:7</span></p><p>The seventh Misery will
            always be 7:7, and the world finally dies. The seventh seal is
            broken for the seventh and final time. The game and your lives end
            here.</p><p><em>Burn the book.</em></p></div></div><div
            class="agony-end"><p class="when-will">When will all this agony
            end?</p><div class="agony-grid"><div class="label"><p>Years of
            pain</p></div><div class="label"><p>A bleak half-year</p></div><div
            class="label"><p>A fall in anguish</p></div><div class="label"><p>A
            cruel month</p></div><div class="label"><p>The end is
            nigh!</p></div><div class="die-roll rollable"
            data-roll="1d100"><p>d100</p></div><div class="die-roll rollable"
            data-roll="1d20"><p>d20</p></div><div class="die-roll rollable"
            data-roll="1d10"><p>d10</p></div><div class="die-roll rollable"
            data-roll="1d6"><p>d6</p></div><div class="die-roll rollable"
            data-roll="1d2"><p>d2</p></div></div></div></div>
