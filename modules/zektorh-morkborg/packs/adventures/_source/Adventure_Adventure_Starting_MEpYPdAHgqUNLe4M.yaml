      - sort: 5700000
        name: 3 - Esoteric Hermit
        type: text
        title:
          show: false
          level: 3
        image: {}
        text:
          format: 1
          content: >-
            <div class="the-game esoteric-hermit"><div class="title"><p>Esoteric
            hermit</p></div><div class="intro"><p>The stone of your cave is one
            with the stars. Silence and perfection. Now the chaos of a fallen
            world disturbs your rituals and the caul of night grows blacker than
            your cavern’s gloom. Irritating! <span class="create-scvm"
            data-uuid="Compendium.morkborg.mork-borg-items.ifSBk6ORiHgq3Xhr">Make
            One</span></p></div><div class="begins-with"><p><span>Begins with
            </span><span class="rollable"
            data-roll="1d6*10">1d6×10s</span><span> and </span><span
            class="rollable" data-roll="d4">d4 Omens</span><span>. HP:
            Toughness+</span><span class="rollable"
            data-roll="1d4">d4</span></p></div><div class="lower-grid"><div
            class="eldritch-origins"><div class="table-title"><p><span>ELdritch
            Origins,
            d6@DRAW[Compendium.morkborg.mork-borg-tables.NOK1yllSK4VO5uVO]{Eldritch
            Origins}</span></p></div><ol><li>Awakening, adult, in a ritual
            circle underneath the northern bridge to Grift.</li><li>Wandered,
            memoryless, from the mouth of a cavern at the cliffs of
            Terion.</li><li>Single child survivor of an incident in the Valley
            of the Unfortunate Undead.</li><li>Dying of plague in a Bergen
            Chrypt hovel, you touched something from outside.</li><li>An average
            individual until you encountered something in a dim glade in
            Sarkash.</li><li>Raised on a lonely island in Lake Onda. No one else
            has ever heard of this island and you can’t
            return.</li></ol></div><div><div class="abilities"><div
            class="abilities-title"><p>Abilities</p></div><p>Wise, <span
            class="rollable" data-roll="3d6+2">roll 3D6+2</span> for Presence.
            Weak, <span class="rollable" data-roll="3d6-2">roll 3D6−2</span> for
            Strength. Ordinary starting equipment plus one random scroll (sacred
            or
            unclean)@DRAW[Compendium.morkborg.mork-borg-tables.xcTMusoyWFKMYfaM]{All
            Scrolls}. Roll
            d4@DRAW[Compendium.morkborg.mork-borg-tables.qYznag89iDMdPH6A]{Starting
            Weapon}{1d4} on the weapon table and
            d2@DRAW[Compendium.morkborg.mork-borg-tables.Cyg5IvubZiDmCCUk]{Starting
            Armor}{1d2} on the armor table. You also begin with one of the
            following:@DRAW[Compendium.morkborg.mork-borg-tables.az9ioNcjtMqO3CqS]{Esoteric
            Hermit Items}</p></div><div class="hermit-items"><div
            class="hermit-item"><div class="num"><p>01</p></div><div
            class="name"><p><span>Master of Fate</span></p></div><div
            class="text"><p>What use are maps when the substance of causality
            itself is open to you? You know the right way with a DR8 Presence
            test.</p></div></div><div class="hermit-item"><div
            class="num"><p>02</p></div><div class="name"><p><span>Book of
            Boiling Blood</span></p></div><div class="text"><p>You may open and
            read from this book once a day. Your enemy must make a DR12 test to
            prevent this. If they fail D2 Berserker-slayers appear from the
            depths of a forgotten dimension of blood. Roll a D6. On a 1–4 these
            creatures fight alongside you. On a 5–6 they turn on you, attempting
            to kill you and destroy the book. After the battle they return to
            their imprisonment.</p></div></div><div class="hermit-item"><div
            class="num"><p>03</p></div><div class="name"><p><span>Speaker of
            Truths</span></p></div><div class="text"><p>Twice per day use your
            wisdom, knowledge, advice and inner calm to bring clarity to a
            creature of your choice. The DR of the next test they undertake is
            lowered by 4.</p></div></div><div class="hermit-item"><div
            class="num"><p>04</p></div><div class="name"><p><span>Initiate of
            the Invisible College</span></p></div><div class="text"><p>Once per
            day you may summon D2 scrolls, whose power can be used only once.
            Roll a d4, on a 1–2 the scrolls are sacred, on a 3–4, unclean. If
            the scrolls are not used before sunrise they turn to
            ash.</p></div></div><div class="hermit-item"><div
            class="num"><p>05</p></div><div class="name"><p><span>Bard of the
            Undying</span></p></div><div class="text"><p>You learnt your
            melodies in the Otherworld. The music of your Harp gives +D4 on
            reaction rolls.</p></div></div><div class="hermit-item"><div
            class="num"><p>06</p></div><div class="name"><p><span>Hawk as
            Weapon</span></p></div><div class="text"><p>Your crafty
            almost-intelligent hawk is loyal only to you. Even without shared
            language, you understand its cries as it keeps watch, scouts and
            swoops to attack foes. Attacks/defense DR10 (claws/bite D4) HP
            8.</p></div></div></div></div></div></div>
