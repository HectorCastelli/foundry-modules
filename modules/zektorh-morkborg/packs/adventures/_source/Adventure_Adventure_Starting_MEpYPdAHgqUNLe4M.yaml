      - sort: 2200000
        name: Lake Onda
        type: text
        _id: 76lhO2DaMKqjITCO
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <div class="eat-prey-kill creatures"><div
            class="region-title"><p>Lake
            Onda@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.jjTDWhqcwSv0P1LF]{Lake
            Onda}</p></div><div class="two-cols"><div class="col"><div
            class="creature-block"><h2>Cursed Trout</h2><div
            class="description"><p><span class="num">1</span> <span
            class="name">CURSED TROUT</span> <span class="text">live among the
            lake’s regular trout, it is not apparent you’ve caught one until you
            gut it and find there are none. A hollow fish, the Cursed Trout is
            seen as a terrible omen: whether by magic or superstition, whomever
            guts such a fish cannot sleep for d6
            days.</span></p></div></div><p></p><div
            class="creature-block"><h2>Rusty Bass</h2><div
            class="description"><p><span class="num">2</span> <span
            class="text">The meat of the
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.hk8TlQ3ud71IkSkj]{Rusty
            Bass} <span class="text">tastes like rusted metal because it eats
            metal.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 2, <strong>Morale</strong>
            -</p><p><strong>Special:</strong> DR12 Toughness test or get
            deathetanus, a craving for feeling metal inside you (DR +2 on
            Defense against metal weapons).</p></div></div><p></p><div
            class="creature-block"><h2>Carcasswan</h2><div
            class="description"><p><span class="num">4</span> <span
            class="text">The </span><span class="name">CARCASSWAN</span> <span
            class="name rollable" data-roll="1d2">(D2)</span> <span
            class="text">mates for life, a decade-long story ending in the
            surviving half eating its dead lover and gaining a taste for flesh.
            Long story short: when you see a lone Carcasswan, you run before it
            sees you.</span></p></div><div class="stat-block"><div
            class="two-cols carcasswan-table"><div
            class="col"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.dFSClq4xZjS3CtLr]{Lone:}<br><strong>HP</strong>
            15, <strong>Morale</strong> -, <strong>Bite/Claws</strong>
            d8</p></div><div class="spacer-col"><p></p></div><div
            class="col"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.ehs52SbC1NuhPECh]{Pair
            of them:}<br><strong>HP</strong> 5, <strong>Morale</strong> -,
            <strong>Bite</strong> d6</p></div></div></div></div><div
            class="creature-block"><h2>Sursurgeon</h2><div
            class="description"><p><span class="num">6</span>
            @UUID[Compendium.morkborg-cult-feretory.feretory-actors.BViKrICgpTmxMtAS]{Sursurgeon}
            <span class="text">which tastes and smells terrible, ferments while
            alive. Eventually it dies, improving nothing.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 4, <strong>Morale</strong>
            -</p></div></div></div><div class="spacer-col"><p></p></div><div
            class="col"><div class="creature-image"><img title="Groan"
            src="modules/morkborg-cult-feretory/assets/eat-prey-kill/groan.webp"></div><div
            class="creature-block"><h2>Groan</h2><div
            class="description"><p><span class="num">3</span> <span
            class="text">The
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.uuW4xfgMjSsn6A7r]{Groan}
            <span class="text">sounds like a weary tree slowly waving in the
            wind. However, wind stops when the Groan is
            near.</span></p></div><div class="stat-block"><p><strong>HP</strong>
            18, <strong>Morale</strong> -, <strong>Something’s not
            right</strong> -d6, <strong>Anti-Presence</strong> d4 +
            special</p><p><strong>Special:</strong> Everyone nearby Defends
            against the Groan is using Presence. There is no escape. Armor will
            not save you. When the Groan dies there is no body. Was it even
            here? DR14 Presence test or forget. It will be
            back.</p></div></div><div class="creature-block"><h2>Unresting
            Duck</h2><div class="description"><p><span class="num">5</span>
            <span class="text">The
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.ZVYuXZJlGAxCAnIf]{Unresting
            Duck} <span class="name rollable" data-roll="1d8">(D8)</span> <span
            class="text">lives and dies in the air making them very skilled at
            flying and really hard to hit (DR16).</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 2, <strong>Morale</strong>
            7, <strong>Beak</strong> d4</p></div></div></div></div></div>
