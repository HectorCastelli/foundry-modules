      - sort: 400000
        name: Look at the Dice
        type: text
        _id: K4FYNThm6XenlsVV
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <div class="monster-generator look-at-the-dice"><p></p><div
            class="look-cols"><div class="left-col"><div
            class="subtitle"><p><span class="highlighted">Look at the dice you
            rolled.</span></p></div><div><p>The <em><span
            style="text-decoration:underline">greatest</span></em> result is its
            <span class="highlighted">MORALE.</span></p><p>The <em><span
            style="text-decoration:underline">lowest</span></em> result is its
            <span class="highlighted">DAMAGE.</span> --------&gt;</p><p>Use the
            middle or the high result for a more powerful
            creature.</p><p></p><p> Whichever table has the highest<br>result
            determines its <span class="highlighted">ARMOR:</span></p><table
            class="armor-table"><tbody><tr><td>Table A</td><td>No
            armor</td></tr><tr><td>Table B</td><td>-d2
            armor</td></tr><tr><td>Table C</td><td><p><em>Odd result: -d4
            armor</em></p><p><em>Even result: -d6
            armor</em></p></td></tr></tbody></table></div></div><div
            class="right-col"><div class="table-wrapper"><table
            class="damage-table"><tbody><tr><th>Lowest
            D12</th><th>Damage</th></tr><tr><td>1–3</td><td>d4</td></tr><tr><td>4–5</td><td>d6</td></tr><tr><td>6–7</td><td>d8</td></tr><tr><td>8–10</td><td>d10</td></tr><tr><td>11–12</td><td>d12</td></tr></tbody></table></div><div
            class="roll-the-damage-die"><p><strong>Roll the damage
            die,</strong></p><p>doubling the result to generate its <span
            class="highlighted">HP.</span></p><p><em>A d8 damage creature
            has<br>2–16 HP (2d8).</em></p></div></div></div><div
            class="bottom-instruction"><p>- 🔥 Now burn the dice 🔥
            -</p></div><p></p></div>
