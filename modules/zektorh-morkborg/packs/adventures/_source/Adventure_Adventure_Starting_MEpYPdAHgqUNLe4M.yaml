        name: Hunting tables
        type: text
        _id: ngWCcktjmF1gS0cK
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: "<div class=\"eat-prey-kill hunting-tables\"><div class=\"two-cols\"><div class=\"col\"><h2>d10 Hunting Mishaps@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.Usp4gFRGbuIGw83j]{d10 Hunting Mishaps}</h2><ol><li>The beast is infested with <strong>exploding ticks.</strong></li><li><strong>Another hunting party</strong> is nearby.</li><li><strong>Another predator</strong> lurks in the shadows, ready to strike.</li><li><strong>Scavengers</strong> followed the tired beast.</li><li><strong>The beast</strong> is actually undead and controlled by a mad necromancer.</li><li><strong>The beast’s lair is nearby</strong> and it tries to escape. There might be more of its kind there.</li><li>The beast is <strong>sick</strong>, contagious and not good to eat.</li><li>The beast is <strong>tamed and belongs to an Earthbound mud shaman.</strong></li><li>The beast is covered in painted symbols and <strong>considered holy by locals,</strong> who will know if it is killed.</li><li>The hunt takes both hunter and prey into a <strong>field of poisonous thorns, unstable glacier ice</strong> or a <strong>ravine about to collapse</strong> depending on the terrain.</li></ol></div><div class=\"spacer-col\"><p>\_</p></div><div class=\"col\"><h2>In the Belly of the Beast*, You Find... (d10)@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.rJFJ95PHvH8gPoer]{In the Belly of the Beast you Find...}</h2><ol><li><strong>A priest’s remains.</strong> Might be a scroll there too.</li><li>A long and angry <strong>flesh worm.</strong></li><li><strong>One of its spawn.</strong> Still living, perhaps?</li><li><strong>A sharp bone</strong> usable as a piercing weapon (2d4).</li><li><strong>A lich’s skull</strong> (with ruby eyes worth 25s each).</li><li><strong>d6 silver coins.</strong></li><li><strong>Remains of a child.</strong> A nearby village is looking for it, preferably alive.</li><li><strong>Broken glass</strong> contaminates half the meat.</li><li>A black tube containing <strong>hallucinogenic powder</strong> (Presence DR12 or −2 Presence for an hour, but can see and communicate with spirits for the duration).</li><li><strong>A human femur covered in arcane runes.</strong> Will open any nearby magically sealed door, turning into salt and cursing its owner.</li></ol><div class=\"footnote\"><p>*Obviously, some beasts are too small or weird for this table.</p></div></div></div></div>"
