      - sort: 900000
        name: Travel tables (2)
        type: text
        _id: eg5dp51nVnr34HKB
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: "<div class=\"roads-to-damnation travel-tables-2\"><div class=\"top-image\"><img title=\"Rider to Galgenbeck\" src=\"modules/morkborg-cult-feretory/assets/roads-to-damnation/rider-left.webp\"></div><div class=\"two-cols\"><div class=\"col\"><h2>Spending a day foraging (d6):@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.i43RMI1jJlBUjxPz]{Spending a day foraging (d6)}</h2><div class=\"roll-table\"><div class=\"row\"><div class=\"row-num\"><p>1</p></div><div class=\"row-item\"><p><strong>You get lost</strong> and spend the day finding the road again.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>2</p></div><div class=\"row-item\"><p><strong>Locate d6+1 rations</strong> of food and water — one ration is spoiled and you sicken 6 hours after consumption. Presence DR12 to notice this.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>3</p></div><div class=\"row-item\"><p><strong>You find d6+3 rations</strong> of good food or fresh water.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>4</p></div><div class=\"row-item\"><p><strong>You track down a savage beast.</strong> Killing it nets d8+2 rations. Or see <em>EAT PREY KILL,</em> page 8.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>5-6</p></div><div class=\"row-item\"><p>You find a village potentially selling what you need.</p><p><strong>Roll on the village table.</strong> -----&gt;</p></div></div></div></div><div class=\"spacer-col\"><p>\_</p></div><div class=\"col\"><h2>The village is (d6):@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.Mv3YKKBMUsZfBT0k]{The village is (d6)}</h2><div class=\"roll-table\"><div class=\"row\"><div class=\"row-num\"><p>1</p></div><div class=\"row-item\"><p><strong>Deserted,</strong> d6 rations of food and water can be scavenged.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>2</p></div><div class=\"row-item\"><p><strong>Plague-stricken,</strong> any ration has a 2-in-6 chance of being tainted.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>3</p></div><div class=\"row-item\"><p><strong>A well-off trading post,</strong> food and water are plentiful and cheap.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>4</p></div><div class=\"row-item\"><p><strong>Ruled by bandits.</strong> Don’t show off too much wealth.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>5</p></div><div class=\"row-item\"><p><strong>Dominated by spider cultists.</strong> No trading with outsiders.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>6</p></div><div class=\"row-item\"><p><strong>Inhabited by cannibals.</strong> No water for sale but plentiful food.</p></div></div></div></div></div></div>"
