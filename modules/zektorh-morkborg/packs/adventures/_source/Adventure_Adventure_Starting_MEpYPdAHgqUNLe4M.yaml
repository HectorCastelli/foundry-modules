        name: The Tablets of Ochre Obscurity
        type: text
        _id: s2t7fCD3wxkL0cRD
        title:
          show: false
          level: 1
        image: {}
        text:
          format: 1
          content: >-
            <div class="gm-screen the-tablets-of-ochre-obscurity"><div
            class="header"><img class="tablet" alt="tablet"
            src="modules/morkborg-core/assets/gm-screen/tablet-of-ochre-obscurity.webp"><div
            class="title"><p>THE TABLETS OF<br>OCHRE OBSCURITY</p></div><p
            class="intro">Sells for 100 silver. Counts as a normal-sized item.
            Breaks on a fumbled attack / defense. Wielder must have at least
            Presence +3 or be a Forlorn Philosopher.
            <strong>1d10</strong>@DRAW[Compendium.morkborg.mork-borg-tables.bxdVkKYwo03kI5rS]{The
            Tablets of Ochre Obscurity}</p></div><div class="cols"><div
            class="col left"><div class="tablet"><div class="name"><p>1.
            @UUID[Compendium.morkborg.mork-borg-items.Q8V40YrOgqjnyChs]{Dream
            Theory}</p></div><div class="text"><p>The target begins to doubt it
            is real. Attacking and defending against it is -2 DR (+2 DR for
            affected PCs).</p></div></div><div class="tablet"><div
            class="name"><p>2.
            @UUID[Compendium.morkborg.mork-borg-items.IqIzdtUuJvSyKq9m]{Total
            Matter Comprehension}</p></div><div class="text"><p>Mends or breaks
            a normal-sized item, mundane or otherwise, including armor
            (increase/ decrease one tier) and weapons.</p></div></div><div
            class="tablet"><div class="name"><p>3.
            @UUID[Compendium.morkborg.mork-borg-items.YhygoDbKYmqwfOWQ]{Ping the
            Shared Subconscious}</p></div><div class="text"><p>You sense the
            presence of living creatures within 70 feet even in adjacent
            rooms.</p></div></div><div class="tablet"><div class="name"><p>4.
            @UUID[Compendium.morkborg.mork-borg-items.Na8qhLYxDdNRfixf]{Logical
            Prognostication}</p></div><div class="text"><p>Using Pure Logic you
            can deduce the nature of any traps or mechanisms within 30 feet or
            of any Powers used within 60 feet.</p></div></div><div
            class="tablet"><div class="name"><p>5.
            @UUID[Compendium.morkborg.mork-borg-items.6Cb5EcDAw1xFaANv]{Carno-Organic
            Speleophagy}</p></div><div class="text"><p>Transmogrifies a
            child-sized rock into burnt, chewy meat. Feeds d4 famished
            people.</p></div></div></div><div class="col right"><div
            class="tablet"><div class="name"><p>6.
            @UUID[Compendium.morkborg.mork-borg-items.XYsW1orUSlrgoxob]{Time-Locked
            Pneumotoxin}</p></div><div class="text"><p>This cracked tablet can
            be crushed to a coarse powder. If strewn upon a creature it takes d6
            damage-on a 6 it chokes and dies. The tablet reappears each morning
            in its owner’s possession. This Power’s Presence test is harmless to
            the wielder, determining whether or not the powder finds the
            target.</p></div></div><div class="tablet"><div class="name"><p>7.
            @UUID[Compendium.morkborg.mork-borg-items.tbxmSO2i4ZwvdIh0]{Induced
            Irrelevance}</p></div><div class="text"><p>This tablet’s code
            literally removes a creature’s essential meaning for d4 rounds.
            During which enemies will not attack it, even if it attacks them
            first.</p></div></div><div class="tablet"><div class="name"><p>8.
            @UUID[Compendium.morkborg.mork-borg-items.tzdPjNtZjSnY5Nz5]{Structural
            Cryo-condensation (Freezing Moon)}</p></div><div
            class="text"><p>Water freezes from the air forming a 15 foot long
            bridge or all water within 150 feet (unfortunately excluding that
            within living creatures) freezes.</p></div></div><div
            class="cols"><div class="col"><div class="tablet"><div
            class="name"><p>9.
            @UUID[Compendium.morkborg.mork-borg-items.tXTLzTij110OCO2e]{Meta-Alchemy}</p></div><div
            class="text"><p>The user may transform a container of liquid one of
            the following ways:</p><ul><li>Transmute it into two doses of Red or
            Black Poison.</li><li>Create The Loathing of Vulark. The imbiber
            rolls a DC16 Toughness test or jumps from great
            heights.</li><li>Transform poison to water or
            wine.</li></ul></div></div></div><div class="col"><div
            class="tablet"><div class="name"><p>10.
            @UUID[Compendium.morkborg.mork-borg-items.ujfsmNFQqls5SGSJ]{Memetic
            Cognitive Palpitation}</p></div><div
            class="text"><p>Near-imperceptible body shifts transmit a simple
            mind-plague which causes one creature to dance madly for d4 rounds.
            They may neither attack nor defend during this
            choreomania.</p></div></div></div></div></div></div></div>
