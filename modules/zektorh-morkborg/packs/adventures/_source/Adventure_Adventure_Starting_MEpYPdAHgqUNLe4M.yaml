      - sort: 800000
        name: Travel tables (1)
        type: text
        _id: kBcpHkyVrdLyMjO5
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: "<div class=\"roads-to-damnation travel-tables-1\"><div class=\"two-cols\"><div class=\"col\"><h2>Travel checklist</h2><ul><li>Keep track of food and water.</li><li>Remember to roll for The Calendar of Nechrubel daily.</li><li>Roll for weather, rerolling if it becomes samey or travel events dictate.</li><li>Information within parentheses are things which are not clear at first glance.</li></ul></div><div class=\"spacer-col\"><p>\_</p></div><div class=\"col\"><h2>What's the road like? (d8) @DRAW[Compendium.morkborg-cult-feretory.feretory-tables.7j2d3ZsfxcZLutWg]{What's the road like? (d8)}</h2><div class=\"roll-table\"><div class=\"row\"><div class=\"row-num\"><p>1</p></div><div class=\"row-item\"><p>Almost-forgotten <strong>dirt track.</strong>Nothing particular happens. The world is grey.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>2</p></div><div class=\"row-item\"><p><strong>Narrow wagon track</strong> used by farmers.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>3</p></div><div class=\"row-item\"><p><strong>Tracks drawn up by wild beasts</strong> or savage monsters.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>4-5</p></div><div class=\"row-item\"><p>Once well maintained <strong>trade road</strong> fallen into disrepair.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>6-7</p></div><div class=\"row-item\"><p><strong>Well-used road</strong>.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>8</p></div><div class=\"row-item\"><p><strong>Paved road</strong>, sporadically patrolled by the King’s soldiers.</p></div></div></div></div></div><hr><h2>Events by the road (d20)@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.nCSCSeoUwiBJD1pQ]{Events by the road (d20)}</h2><p> Roll daily. <em>When you roll an italicized result, cross it out and replace it with something of your own.</em></p><div class=\"two-cols\"><div class=\"col\"><div class=\"roll-table\"><div class=\"row\"><div class=\"row-num\"><p>1-3</p></div><div class=\"row-item\"><p><strong>Nothing particular happens.</strong> The world is grey.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>4</p></div><div class=\"row-item\"><p><strong>The weather worsens</strong> (becoming more extreme) and no progress is made.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>5-6</p></div><div class=\"row-item\"><p><strong>Weather change.</strong> Roll on the weather table (inner front cover).</p></div></div><div class=\"row\"><div class=\"row-num\"><p>7-8</p></div><div class=\"row-item\"><p><strong>The road forks,</strong> the signs are unintelligible. Reroll.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>9</p></div><div class=\"row-item\"><p><strong>d6 rations of food or water spoil.</strong></p></div></div><div class=\"row\"><div class=\"row-num\"><p>10</p></div><div class=\"row-item\"><p><em><strong>A monastery</strong> beside the road, chanting is audible from within. (The monks and nuns are cultists of Nechrubel).</em></p></div></div><div class=\"row\"><div class=\"row-num\"><p>11</p></div><div class=\"row-item\"><p><em><strong>Castle ruins</strong> stand out against the sky. (It’s infested with savage crows. A blind alchemist resides in the remaining tower).</em></p></div></div><div class=\"row\"><div class=\"row-num\"><p>12</p></div><div class=\"row-item\"><p><em><strong>A religious procession</strong> of flagellants and hermits. (They seek to see HIM but lost their way.)</em></p></div></div><div class=\"row\"><div class=\"row-num\"><p>13</p></div><div class=\"row-item\"><p><strong>Filthy farmers</strong> on their way to the market.</p></div></div></div></div><div class=\"spacer-col\"><p>\_</p></div><div class=\"col\"><div class=\"roll-table\"><div class=\"row\"><div class=\"row-num\"><p>14</p></div><div class=\"row-item\"><p><strong>d6+1 slavers,</strong> leading 2d6 slaves, half beaten to death, half freshly caught.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>15</p></div><div class=\"row-item\"><p><strong>A few mercenaries</strong> and their d8 guards. (All infected by a brain parasite.)</p></div></div><div class=\"row\"><div class=\"row-num\"><p>16</p></div><div class=\"row-item\"><p><em><strong>Across the road,</strong> a battle between a flayed cultist band and an Earthbound pack.</em></p></div></div><div class=\"row\"><div class=\"row-num\"><p>17</p></div><div class=\"row-item\"><p><strong>The troll Adnah</strong> ambushes you.</p></div></div><div class=\"row\"><div class=\"row-num\"><p>18</p></div><div class=\"row-item\"><p><em><strong>Abandoned graveyard</strong> (In a chapel there is an inverted gold cross worth 50s. d8 zombies hide in a crypt.)</em></p></div></div><div class=\"row\"><div class=\"row-num\"><p>19</p></div><div class=\"row-item\"><p><em><strong>A funerary procession</strong> of toothless villagers, carrying a very large coffin. (The giant inside is dead but dreaming.)</em></p></div></div><div class=\"row\"><div class=\"row-num\"><p>20</p></div><div class=\"row-item\"><p><strong>Two roadside corpses,</strong> one of them has something in their pockets (Roll on the Corpse Plundering table in the MÖRK BORG rulebook).</p></div></div></div></div></div></div>"
