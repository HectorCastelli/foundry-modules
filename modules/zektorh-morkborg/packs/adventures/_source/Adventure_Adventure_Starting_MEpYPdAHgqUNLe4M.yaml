      - sort: 5500000
        name: 2 - Gutterborn Scum
        type: text
        title:
          show: false
          level: 3
        image: {}
        text:
          format: 1
          content: "<div class=\"the-game gutterborn-scum\"><div class=\"top-grid\"><div><div class=\"title\"><p>Gutter born</p><p>Scum</p></div><p class=\"intro\">An ill star smiled upon your birth. Poverty, crime and bad parenting didn’t help either. In your community an honest day’s work was never an option. Not that you ever tried, what are you, some kind of mug? A razor blade and a moonless night are worth a week of chump-work. <span class=\"create-scvm\" data-uuid=\"Compendium.morkborg.mork-borg-items.gAx8MWLiZcjiWQvc\">Make One</span></p><p class=\"begins-with\">Begins with <span class=\"rollable\" data-roll=\"1d6*10\">1d6×10s</span> and <span class=\"rollable\" data-roll=\"1d2\">d2 Omens</span>. HP: Toughness+<span class=\"rollable\" data-roll=\"1d6\">d6</span></p></div><div><div class=\"bad-birth\"><div class=\"table-title\"><p>Bad Birth, d6@DRAW[Compendium.morkborg.mork-borg-tables.1w0GfMQlj03Qml5V]{Bad Birth}</p></div><ol><li>Dumped onto a moving shit-cart still in your birth caul.</li><li>Mother hanged from a tree outside of Galgenbeck, you fell from the corpse.</li><li>Raised by rats in the gutters of Grift.</li><li>Kicked and beaten beneath a baker’s table in Schleswig.</li><li>Escaped the Tvelandian orphanarium.</li><li>Educated by outlaws in a hovel south of Alliáns.</li></ol></div></div></div><div class=\"abilities\"><p class=\"abilities-title\">Abilities</p><p>Small, <span class=\"rollable\" data-roll=\"3d6-2\">roll 3d6−2</span> for Strength. Stealthy, all Presence and Agility tests have their DR reduced by 2 (normal tests are DR10 instead of DR12). Roll d6@DRAW[Compendium.morkborg.mork-borg-tables.qYznag89iDMdPH6A]{Starting Weapon}{1d6} on the weapon table and d2@DRAW[Compendium.morkborg.mork-borg-tables.Cyg5IvubZiDmCCUk]{Starting Armor}{1d2} on the armor table.</p><p>You also begin with one <strong>specialty</strong> (d6@DRAW[Compendium.morkborg.mork-borg-tables.zdJf8m9Y5gL5mJ4j]{Specialities}):</p></div><div class=\"specialities\"><div class=\"speciality\"><p class=\"name\">1\_ Coward’s Jab</p><p class=\"text\">When attacking by surprise test Agility DR10. On a success you automatically hit once with a light one-handed weapon, dealing normal damage +3.</p></div><div class=\"speciality\"><p class=\"name\">2\_Filthy Fingersmith</p><p class=\"text\">Your snaky little digits get into pockets and pick locks with a DR8 Agility test. You also begin with lockpicks!</p></div><div class=\"speciality\"><p class=\"name\">3\_Abominable Gob Lobber</p><p class=\"text\">Your phlegm is viscous, lumpy, vile and ballistically accurate at short range. You can spit d2 times during a fight. Roll a DR8 Presence test for accuracy. Targets are blinded, retching and vomiting for d4 rounds. Anyone witnessing this — friend and foe — must make a Toughness test to not also vomit. PCs test DR10 and enemies DR12.</p></div><div class=\"speciality\"><p class=\"name\">4\_Escaping Fate</p><p class=\"text\">Every time you use an omen there is a 50% chance it is not spent.</p></div><div class=\"speciality\"><p class=\"name\">5\_Excretal Stealth</p><p class=\"text\">You have an astounding, almost preternatural ability to hide in muck, debris and filth. When hidden in these conditions a DR16 Presence test is required to notice you.</p></div><div class=\"speciality\"><p class=\"name\">6\_Dodging Death</p><p class=\"text\">You are so unpleasant, irrelevant, disgusting and vile even Death would rather avoid you if it can. On death, if there is even the slightest possibility that you survived, there is a 50% chance that you did. If successful, after 10 rounds you pop back up with d4 HP and an unlikely explanation of your escape.</p></div><p class=\"the-first-time\">The first time the Scum gets better (see the <em>Getting better</em> page) another specialty is rolled. From the second time the Scum gets better it’s possible to reroll these two specialities or just one.</p></div></div>"
