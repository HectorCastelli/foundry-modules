      - sort: 300000
        name: The Basilisks
        type: text
        _id: ARrXKCJ6vkcZ7JMO
        system: {}
        title:
          show: true
          level: 1
        image: {}
        text:
          format: 1
          content: >-
            <p>What started as an experiment from Soultorn to combine bits of
            the Five into an ultimate life form, ended as a
            disaster.</p><p>Intuition from Sagsobuth created a cunning predator.
            The might of Guinevere emboldened it to grow enormous. Goroloth's
            all consuming shadow made it insatiable. Soultorn's trickery
            developed into a deadly venom. And to drain all hope, Pobelo's
            blessing made it live longer than any would have liked.</p><p>The
            toil of this creation was such, that after creating the first
            basilisk, the Original Five retreated from this world, leaving
            creation to fend for itself for ages. The basilisks appreciated
            it.</p><h2>Disastrous Fallout</h2><p>What caused the Basilisks to
            lash out against the Original Five is a mystery for which the
            solution is not willingly shared.</p><p>However, the basilisks were
            too powerful, unstable, and far too dangerous, and when they
            rebelled, reality itself was in danger.</p><p>Using the souls of
            their offspring, they wove miseries into the fabric of time to
            weaken their creators and start the slow march of the end of the
            world.</p><p>Miseries hallucinated by their diseased minds, designed
            to make all of creation pay for the next step in the plan. Slowly
            they would end it all: No gods, no life, no space, nor time. Only
            nothingness.</p><h3>Desperate Response</h3><p>As their powers
            drained and the world sickened, the Five gathered to address the
            issue.</p><p>With their remaining energy, undoing the curse was not
            possible, so they decided to turn back time, bit by bit, repairing
            reality and gaining more power until a time where the basilisks can
            be vanquished comes.</p><p>As they prepared for this endeavor,
            disasters accelerated. It was necessary for Pobelo to have enough.
            However, the other 4 didn't remain idle, they added a curse of their
            own making into the fabric of reality, slowing the basilisk's
            plans:</p><blockquote><p>They will always come in pairs to bring
            about their own ruin. The first, able to save them, will be lost in
            blood.</p></blockquote><section id="secret-XsF9sGGatveX7BFS"
            class="secret"><p>This curse basically means: Every basilisk can
            only have two offspring, and once they do, they die.</p><p>This is
            meant to make the basilisks reproduce slowly, and leave their young
            to fend for themselves.</p><p>The basilisks are still very sturdy,
            but when they are young it <em>is</em> possible to hunt and end
            them.</p></section>
