      - sort: 800000
        name: What Was Written Must Be Known
        type: text
        _id: aN5Ow67i12mBmLj1
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <div class="the-dying-world what-was-written"><div
            class="centered"><img class="what-was-written" title="What Was
            Written Must Be Known" alt="What Was Written Must Be Known"
            src="modules/morkborg-core/assets/the-dying-world/what-was-written-text.webp"></div><div
            class="part-1"><div class="centered"><img class="roman-numeral-1"
            alt="1"
            src="modules/morkborg-core/assets/the-dying-world/roman-numeral-1.webp"></div><p><span
            class="anuk">Anuk Schleger,</span> monk of the Creton order,
            encountered the basilisk Verhu in the year 565 and set down that
            creature’s whispered prophecies. These lost texts came to be known
            as the <em>Nameless Scriptures.</em> <span
            class="pink-para">¶</span> 300 years later, while working on a new
            Cathedral, <em>The Two-Headed Basilisks,</em> an orthodox branch of
            the Creton order uncovered Schlegers tomb and with it the
            Scriptures. <span class="pink-para">¶</span> Since then all events
            described within have come to pass. The prophecies are absolutely,
            factually true and have, thus, supplanted all other Scripture.
            Around this cathedral has grown Galgenbeck, the greatest city that
            ever was.</p></div><div class="part-2 flex"><img
            class="roman-numeral-2" alt="2"
            src="modules/morkborg-core/assets/the-dying-world/roman-numeral-2.webp"><p><span
            style="text-decoration:underline">The Basilisks</span> are two and
            two-headed. The four heads have argued for hundreds of years. <span
            style="text-decoration:underline">Verhu</span> predicts inexorable
            annihilation and, since he’s always right, has become utterly full
            of himself. <span class="pink-para">¶</span> His is also the head
            worshipped most. If you could learn the codes of the apocalypse
            perhaps the right offerings might avert it? Verhu loves his position
            and hungers for temples to be raised in his name.</p></div><div
            class="part-3"><div class="centered"><img class="roman-numeral-3"
            alt="3"
            src="modules/morkborg-core/assets/the-dying-world/roman-numeral-3.webp"></div><p
            class="first">When the world was but water, dust and clouds thick
            with plague-fat flies came <span class="she">SHE,</span> first of
            the basilisks. From the cracks of Bergen Chrypt <span
            class="she">SHE</span> crawled. <span class="she">SHE</span> bears
            the head of <em>Denial,</em> Lusi, who looks up and down. Yet all
            shall be well. Her twin Arkh, Head of <em>Deception,</em> claims to
            be the first prophet of truths now prostituted by Verhu. Few have
            ever seen her, the oldest, but many walk her twin paths.</p><p
            class="centered white">⁂</p><p class="second"><span
            class="she">SHE</span> spawned many since the dawn of time, their
            conceptions not without agony. All were cast down the cliffs of
            Bergen Chrypt, only <span class="she">HE</span> survived. Down in
            the Valley of the Unfortunate Undead his eyes locked upon the
            mountain’s peak, <span class="she">HE</span> spits out curses upon
            his evil mother. The head Gorgh is <em>bitter, rank with envy</em>
            that only his twin Verhu knows the <em>damned truth.</em> Time and
            time again his prophecies are brought to be. The piles of gold-gift
            riches from his faithful teeter and slide, so tall are
            they.</p></div><div class="part-4"><div class="centered"><img
            class="roman-numeral-4" alt="4"
            src="modules/morkborg-core/assets/the-dying-world/roman-numeral-4.webp"></div><p><span
            class="pink">THE WORLD DIES EVEN NOW.</span> Reality decays, truth
            becomes dream and dream, truth. Cracks grow in the once-stable
            structures of the past, allowing things misshapen and vile to worm
            through, emerging into day’s wan light. The known world closes in,
            bounded to the west by the massive Bergen Chrypt with its catacombs
            and ice-caked peaks and surrounded by the Endless Sea to the north,
            south and east. Many have ploughed the wave’s furrow in search of
            new lands. They all return, against their will. Alive or
            dead.</p></div></div>
