      - sort: 8000000
        name: Outcasts
        type: text
        _id: c4MQqYgveyjJeW7D
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <div class="outcasts"><div class="title"><p>Outcasts</p></div><div
            class="intro"><p>Money might cross hands but these weirdos don’t
            cost silver to hire. Vagrants and refugees driven by loneliness,
            they just want somewhere to belong. Which is exactly why they often
            break into a run and disappear, usually at the most critical
            moments. The GM makes a morale check from time to time (succeed and
            the outcast stays) and adds the group’s highest Presence to the
            roll. The GM should also consider whether or not the group provides
            the outcast with the things he/she/it values.</p></div><div
            class="outcast-block"><div class="portrait-col"><img
            class="outcast-portrait" title="Earthbound" alt="Earthbound"
            src="systems/morkborg/tokens/followers/earthbound.png"></div><div
            class="outcast-col"><div class="outcast"><h2
            class="name">@UUID[Compendium.morkborg.mork-borg-actors.4hGrH6UVkXIKMDyE]{Earthbound}</h2><p
            class="stat-block"><strong>HP</strong> 8 <strong>Morale</strong> 7
            <strong>Leathe</strong>r -d2 <strong>Staff/Femur</strong> d4</p><p
            class="text">These freaks are roughly three parts human to one part
            dog. Society sees them as foul, diseased and disloyal for a carrier
            of canine blood. Isolation and contempt have made them self- reliant
            scavengers.</p><div class="table"><p class="table-title">Trait
            (d4)@DRAW[Compendium.morkborg-core.core-tables.fg5L2sRv6p7aK3c3]{Earthbound
            Trait}</p><ol
            class="two-cols"><li>Arrogant</li><li>Quiet</li><li>Joking</li><li>Hypochondriac</li></ol></div><div
            class="table"><p class="table-title">Specialty
            (d4)@DRAW[Compendium.morkborg-core.core-tables.zdInsKd65nE9l6eH]{Earthbound
            Specialty}</p><ol class="two-cols"><li>Excellent cooking (d4 extra
            HP when resting)</li><li>Finds the right path</li><li>Senses
            danger</li><li>Makes/repairs items</li></ol></div><div
            class="table"><p class="table-title">Values
            (d6)@DRAW[Compendium.morkborg-core.core-tables.2oSooh2KY1NDxyZJ]{Earthbound
            Values}</p><ol class="two-cols"><li>Fireplace
            discussions</li><li>Praise</li><li>Endless tasks</li><li>Items as
            payment</li><li>Carnal relations</li><li>Diluted black
            poison</li></ol></div></div></div></div><div
            class="outcast-block"><div class="portrait-col"><img
            class="outcast-portrait" title="Pale One" alt="Pale One"
            src="systems/morkborg/tokens/followers/pale_one.png"></div><div
            class="outcast-col"><div class="outcast"><h2
            class="name">@UUID[Compendium.morkborg.mork-borg-actors.i9eNpTFMhRGFDjon]{Pale
            One}</h2><p class="stat-block"><strong>HP</strong> 5
            <strong>Morale</strong> 8 <strong>No armor</strong>
            <strong>unarmed</strong> d2</p><p class="text">As if fallen from the
            stars the pale ones fit in nowhere. This unwilling alienation makes
            them destructive and detached.</p><div class="table"><p
            class="table-title">Trait
            (d4)@DRAW[Compendium.morkborg-core.core-tables.veFYRoUPyuTEvkf0]{Pale
            One Trait}</p><ol
            class="two-cols"><li>Bitter</li><li>Incoherent</li><li>Mute</li><li>Self-harming
            behaviour</li></ol></div><div class="table"><p
            class="table-title">Specialty
            (d4)@DRAW[Compendium.morkborg-core.core-tables.UDsBZkvRcLmh8fTm]{Pale
            One Specialty}, Once per day</p><ol class="two-cols"><li>Create d2
            doses of a random decoction (see the class Occult
            Herbmaster)</li><li>Create d2 doses Elixir Vitalis (heals d6 HP and
            stops infection)</li><li>Use one random unclean Power</li><li>Use
            one random sacred Power</li></ol></div><div class="table"><p
            class="table-title">Values
            (d6)@DRAW[Compendium.morkborg-core.core-tables.v9RkLeoDEbcwE5cg]{Pale
            One Values}</p><ol class="two-cols"><li>Not having to use their
            speciality all the time</li><li>Cleanliness</li><li>Listening to
            melancholic melodies</li><li>A couple of hours alone in
            darkness</li><li>Wine</li><li>Obscure rituals with the
            group</li></ol></div></div></div></div><div
            class="outcast-block"><div class="portrait-col"><img
            class="outcast-portrait" title="Prowler" alt="Prowler"
            src="systems/morkborg/tokens/followers/prowler.png"></div><div
            class="outcast-col"><div class="outcast"><h2
            class="name">@UUID[Compendium.morkborg.mork-borg-actors.GwnVAHrVp7Jn8Q9e]{Prowler}</h2><p
            class="stat-block"><strong>HP</strong> 8 <strong>Morale</strong> 8
            <strong>Leather</strong> -d2 <strong>Knife/Femur</strong> d4
            Occasionally <strong>filthy shortsword</strong> d4+1</p><p
            class="text">Lawless good-for-nothing crooks banished from
            civilization. Low on resources, allies and basic decency they seek
            retribution ... and coin.</p><div class="table"><p
            class="table-title">Trait
            (d4)@DRAW[Compendium.morkborg-core.core-tables.a8ALkqHBPm4YiqzK]{Prowler
            Trait}</p><ol
            class="two-cols"><li>Lazy</li><li>Bragging</li><li>Liar</li><li>Traitor</li></ol></div><div
            class="table"><p class="table-title">Specialty
            (d4)@DRAW[Compendium.morkborg-core.core-tables.mbmWIKALViBEUOqm]{Prowler
            Specialty}, DR8</p><ol class="two-cols"><li>Disarm traps (you need
            to find them first)</li><li>Steal single items</li><li>Climb
            impossible routes alone</li><li>Finds trails and corners that keep
            the group hidden.</li></ol></div><div class="table"><p
            class="table-title">Values
            (d6)@DRAW[Compendium.morkborg-core.core-tables.Gl4jbqKo3FxFwVRB]{Prowler
            Values}</p><ol class="two-cols"><li>Payment in
            silver</li><li>Food</li><li>Gossip</li><li>Liquor</li><li>Pointless
            death</li><li>Getting the credit for
            exploits</li></ol></div></div></div></div><div
            class="outcast-block"><div class="portrait-col"><img
            class="outcast-portrait" title="Wild Wickhead" alt="Wild Wickhead"
            src="systems/morkborg/tokens/followers/wild_wickhead.png"></div><div
            class="outcast-col"><div class="outcast"><h2
            class="name">@UUID[Compendium.morkborg.mork-borg-actors.JnKLja5Y4jsBgbwR]{Wild
            Wickhead}</h2><p class="stat-block"><strong>HP</strong> 10
            <strong>Morale</strong> 7 <strong>No armor</strong>
            <strong>Knife</strong> d4</p><p class="text">Wickheads are solitary
            by nature, but the wildest and vilest are cast even from that loose
            community. Wandering forests and rambling ruins, they take any
            company they can find. Fickle, suspicious and bad, you would be
            well-advised to keep them chained.</p><div class="table"><p
            class="table-title">Trait
            (d4)@DRAW[Compendium.morkborg-core.core-tables.V5Fadpbf5Lo84jQH]{Wild
            Wickhead Trait}</p><ol
            class="two-cols"><li>Grumpy</li><li>Apathetic</li><li>Careless</li><li>Moody</li></ol></div><div
            class="table"><p class="table-title">Specialty
            (d4)@DRAW[Compendium.morkborg-core.core-tables.LkMbPM3zqev9HScB]{Wild
            Wickhead Specialty}</p><ol class="two-cols"><li>Walking
            lightsource</li><li>Walking lightsource</li><li>Expert with a knife
            (d4+2)</li><li>Backstab (test DR8 with d20 rolled by the GM. Deals
            weapon damage + 3)</li></ol><p>Aside from their specialty they will
            carry up to five items.</p></div><div class="table"><p
            class="table-title">Values
            (d6)@DRAW[Compendium.morkborg-core.core-tables.JugIHxBcSxDQua6K]{Wild
            Wickhead Values}</p><ol class="two-cols"><li>Holding long monologues
            about oneself</li><li>Verbal conflicts within the
            group</li><li>Getting paid in sharp weapons</li><li>Burnt
            meat</li><li>Depressing stories</li><li>Captured
            slaves</li></ol></div></div></div></div></div>
