      - sort: 150000
        name: Soultorn - Alchemist of Life
        type: text
        system: {}
        title:
          show: true
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <p>It's believed their original form is that of a small entity,
            however, they usually are found taking the appearance of one of it's
            creations.</p><p>They are always looking to research, tweak, change,
            and mess with their creations. Imperfections are not only tolerated,
            but welcome. They take pride in their ability to twist flesh and
            cause mutations, and even more pride when those mutations become
            useful somehow.</p>
