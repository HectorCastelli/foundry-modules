      - sort: 2300000
        name: Valley of the Unfortunate Undead
        type: text
        _id: eEPqAXePhOz63zod
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <div class="eat-prey-kill creatures"><div
            class="region-title"><p>Valley of the<br>Unfortunate
            Undead@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.7sbd6S7lQchcyg7G]{Valley
            of the Unfortunate Undead}</p></div><div class="two-cols"><div
            class="col"><div class="creature-block"><h2>Phantom Rats</h2><div
            class="description"><p><span class="num">1</span> <span
            class="text">Sickly blue glowing
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.4jUbvyJjSuJVwzpG]{Phantom
            Rats} <span class="name rollable" data-roll="1d10">(D10)</span>
            <span class="text">are always flickering—half-way between here and
            somewhere else. Keep one in a bottle for a makeshift lantern, just
            make sure the glass is coated in its kin’s ethereal blood, lest it
            escape. They’re a nightmare to catch (DR16 to
            attacks).</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 2, <strong>Morale</strong>
            -, <strong>Bite</strong> d4</p><p><strong>Special:</strong> DR12
            Toughness test or get deathetanus, a craving for feeling metal
            inside you (DR +2 on Defense against metal
            weapons).</p></div></div><p></p><div class="creature-block"><h2>Tomb
            Ape</h2><div class="description"><p><span class="num">3</span> <span
            class="text">The valley’s suckling soil cannot hold the
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.KmOU7d4qAKFH1ees]{Tomb
            Ape} <span class="text">for it has webbed feet like a frog and a
            snake’s slippery scales. Long tangled hair covers its face and
            mouthful of sharp teeth. The ape longs for silver and never goes far
            from its nest—likely an old tomb—where it keeps d66
            coins.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 14,
            <strong>Morale</strong> 11, <strong>Scales</strong> -d2,
            <strong>Bite/Claws</strong> d6</p></div></div><p></p><div
            class="creature-block"><h2>Marrow Sparrow</h2><div
            class="description"><p><span class="num">5</span> <span
            class="text">The tiny (DR14 to hit)
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.XVVjk4qCimrH0aeu]{Marrow
            Sparrow} <span class="text">has a syringe-like beak for feeding on
            sleeping victims. One makes a very good soup stock that fills the
            stomachs of four.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 1, <strong>Morale</strong>
            -, <strong>Beak</strong> 1 damage</p></div></div><p></p></div><div
            class="spacer-col"><p></p></div><div class="col"><div
            class="creature-block"><h2>Grubstopper</h2><div
            class="description"><p><span class="num">2</span>
            @UUID[Compendium.morkborg-cult-feretory.feretory-actors.SDGVOj3KbHtrVdEx]{Grubstopper}
            <span class="name rollable" data-roll="1d10">(D10)</span> <span
            class="text">is the common word for any bug large enough to calm a
            man’s hunger.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 1, <strong>Morale</strong>
            -, <strong>Exoskeleton</strong> -d2 (50%), <strong>Bite</strong> 1
            damage + special</p><p><strong>Special:</strong> Some bugs have a
            bad bite (Toughness DR12). Roll below for the effect: (d4) 1–2.
            Nothing. 3. d6 damage. 4. Infected.</p></div></div><p></p><div
            class="creature-block"><h2>Gravelings</h2><div
            class="description"><p><span class="num">4</span>
            @UUID[Compendium.morkborg-cult-feretory.feretory-actors.zN4LpJouZ7uoxBjb]{Gravelings}
            <span class="name rollable" data-roll="1d6">(D6)</span> <span
            class="text">are a bit like skinless, hunch-backed dogs with
            opposable thumbs. They taste about the same,
            too.</span></p></div><div class="stat-block"><p><strong>HP</strong>
            6, <strong>Morale</strong> 9, <strong>Bite/Claws</strong>
            d6</p></div></div><div class="creature-image"><img title="Bonemare"
            src="modules/morkborg-cult-feretory/assets/eat-prey-kill/bonemare.webp"></div><div
            class="creature-block"><h2>Bonemare</h2><div
            class="description"><p><span class="num">6</span> <span
            class="text">While it has no flesh to speak of, the
            </span>@UUID[Compendium.morkborg-cult-feretory.feretory-actors.vVS6rbYA8oJbsfjw]{Bonemare}
            <span class="text">keeps a very tasty brain somewhere in its
            necromanced equestrian being.</span></p></div><div
            class="stat-block"><p><strong>HP</strong> 12,
            <strong>Morale</strong> -, <strong>Bones</strong> -d4,
            <strong>Bite/Kick</strong> d6</p><p><strong>Special:</strong> On its
            first turn the mare unleashes a random unclean scroll’s
            Power.</p></div></div></div></div></div>
