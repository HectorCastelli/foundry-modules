      - sort: 150000
        name: Guinevere - The hammer of Might
        type: text
        system: {}
        title:
          show: true
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <p>She is a tall and slim tanned woman with long white curls down to
            their waist. Her pale teeth shine in contrast with her skin, and her
            eyes are a burning orange, glowing softly in the dark.</p><p>She
            always welcomes a fight, and will honor duels. Her patience,
            however, is less present. When out of patience, she uses her full
            strength to crush their opponents swiftly.</p>
