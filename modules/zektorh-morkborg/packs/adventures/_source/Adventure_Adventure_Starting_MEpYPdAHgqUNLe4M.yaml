      - sort: 6600000
        name: Creatures
        type: text
        _id: RTi5O97GJLLQQR0F
        title:
          show: false
          level: 2
        image: {}
        text:
          format: 1
          content: >-
            <div class="creatures"><div class="title"><p>Creatures</p></div><div
            class="creature-block"><div class="portrait-col"><img
            class="creature-portrait" title="Berserker" alt="Berserker"
            src="systems/morkborg/tokens/creatures/berserker.png"></div><div
            class="creature-col"><div class="creature"><h2
            class="name">@UUID[Compendium.morkborg.mork-borg-actors.9tjuJtUyLb8pV3ZX]{Berserker
            (Zukuma)}</h2><div class="stat-block"><p><strong>HP</strong> 13
            <strong>Morale</strong> 9 <strong>Hardened skin</strong>
            -d2</p><p>Wields (d4) <br>1. Long flail d8 <br>2. Heavy mace d6
            <br>3. Chained sword d6 <br>4. Huge warhammer d10</p></div><div
            class="text"><p><strong>They’re on you!</strong> As if from nowhere,
            a frenzied ambush in dusty hallways and from behind the stacked
            black stones of catacombs. Special Attacks twice per round but
            doesn’t have time for defense (DR10 to hit them).</p></div><div
            class="bounty"><p>Dead <em>20s</em> Captured <em>55s</em> Blood, per
            litre <em>3s</em></p></div></div></div></div><div
            class="creature-block"><div class="portrait-col"><img
            class="creature-portrait" title="Blood-drenched Skeleton"
            alt="Blood-drenched Skeleton"
            src="systems/morkborg/tokens/creatures/blood_skeleton.png"></div><div
            class="creature-col"><div class="creature"><h2
            class="name">@UUID[Compendium.morkborg.mork-borg-actors.dlvO3nUvNuc8C297]{Blood-Drenched
            Skeleton (Belze)}</h2><div class="stat-block"><p><strong>HP</strong>
            7 <strong>Morale</strong> 8 <strong>No armor</strong>
            <strong>Shortsword</strong> d4 or <strong>Knife</strong> d4
            <strong>Bony knuckles</strong> d2</p><p>Special: Skulks about,
            impossibly soundless. Attacks by surprise.</p></div><div
            class="text"><p>Can mimic voices to lure victims, but can only
            repeat what it has heard. Attacks on them with piercing weapons are
            DR14. Any strike doing 5 or more damage destroys the skeleton
            completely.</p></div><div class="bounty"><p>Captured <em>35s</em>
            Destroyed <em>7s</em></p></div></div></div></div><div
            class="creature-block"><div class="portrait-col"><img
            class="creature-portrait" title="Goblin" alt="Goblin"
            src="systems/morkborg/tokens/creatures/goblin.png"></div><div
            class="creature-col"><div class="creature"><h2
            class="name">@UUID[Compendium.morkborg.mork-borg-actors.bsPjBb00iYn0Ij2d]{Goblin
            (Seth)}</h2><div class="stat-block"><p><strong>HP</strong> 6
            <strong>Morale</strong> 7 <strong>Ropy skin</strong> -d2
            <strong>Knife/shortbow</strong> d4</p><p>Special: Quick, attacks and
            defense are DR14.</p></div><div class="text"><p>All goblins carry a
            curse. Once like you, they are now trapped in the prison of their
            crazed goblin flesh. Only their eyes reveal the truth: a ruined mind
            watching its body-prison perform terrible deeds. Even being attacked
            by goblins sends the curse, carried on the winds of their hate. Hit
            or miss, it doesn’t matter. In the dark of Sarkash they shoot at
            passers-by with twanging bows. You must find and kill the goblin
            before your mind is paralyzed. If the cursecarrying creature still
            lives d6 days after the attack, you will warp irrevocably into one
            yourself. Then, only the dark of Sarkash will hide
            you.</p></div><div class="bounty"><p>Head <em>7s</em> Captured
            <em>150s</em> Dead <em>20s</em></p></div></div></div></div><div
            class="creature-block"><div class="portrait-col"><img
            class="creature-portrait" title="Grotesque" alt="Grotesque"
            src="systems/morkborg/tokens/creatures/grotesque.png"></div><div
            class="creature-col"><div class="creature"><h2
            class="name">@UUID[Compendium.morkborg.mork-borg-actors.nE21BWuHHuxoyVkT]{Grotesque
            (Thinx)}</h2><div class="stat-block"><p><strong>HP</strong> 18
            <strong>Morale</strong> – <strong>Clay/stone</strong> –d6
            <strong>Claws</strong> d6 or <strong>Eye-beam</strong>
            d8</p></div><div class="text"><p>Lurking round churches, stalking
            graveyards, creeping closer when you look away. Disturbingly still,
            difficult to discern against gray stone and hard to recognize even
            when seen. They move slowly and are easy to hit (dr10). Their
            terrifying gaze is used on 1–2 on a d6 each round. Always
            hits.</p></div><div class="bounty"><p>Captured <em>190s</em> Dead
            (intact) <em>100s</em> Dead (in pieces)
            <em>10s</em></p></div></div></div></div><div
            class="creature-block"><div class="portrait-col"><img
            class="creature-portrait" title="Scum" alt="Scum"
            src="systems/morkborg/tokens/creatures/scum.png"></div><div
            class="creature-col"><div class="creature"><h2
            class="name">@UUID[Compendium.morkborg.mork-borg-actors.NBO7cAE8LKW60S72]{Scum
            (Bent)}</h2><div class="stat-block"><p><strong>HP</strong> 7
            <strong>Morale</strong> 8 <strong>No armor</strong> <strong>Poisoned
            knife</strong> d4 + special</p><p>Special: Poisoned knife. Test
            Toughness DR10 or become infected.</p></div><div
            class="text"><p>There are few fiends more fell than poverty or
            monsters more powerful than hate. In this stricken world, the slums
            and black alleyways are fecund scum, mothering countless abhorred
            miscreants. <strong>The PC with the highest Presence makes a DR14
            test at the start of battle.</strong> Failure means a random party
            member is automatically hit with a cowardly backstab-normal damage
            +3.</p></div><div class="bounty"><p>Captured <em>50–120s</em>
            (wanted, serious crime) Dead <em>20–70s</em> (wanted, serious
            crime)</p></div></div></div></div><div class="creature-block"><div
            class="portrait-col"><img class="creature-portrait" title="Troll"
            alt="Troll"
            src="systems/morkborg/tokens/creatures/troll.png"></div><div
            class="creature-col"><div class="creature"><h2
            class="name">@UUID[Compendium.morkborg.mork-borg-actors.IHGZLScGLifEo7SH]{Troll
            (Arbint)}</h2><div class="stat-block"><p><strong>HP</strong> 32
            <strong>Morale</strong> special <strong>Thick hide</strong> -d2
            <strong>Fist</strong> 2d6</p><p>Special: Easy to hit; attacks are
            DR10.</p></div><div class="text"><p>Cowards despite their size.
            Usually retreat if badly wounded. Never forget who hurt them. They
            grow larger during the healing process and will definitely come
            back, stronger than before. Any HP healed is added to their maximum
            HP. Every time they return, add another d6 to their
            damage.</p></div><div class="bounty"><p>Captured <em>200s</em>
            Corpse <em>70s</em> Horn
            <em>25s</em></p></div></div></div></div><div
            class="creature-block"><div class="portrait-col"><img
            class="creature-portrait" title="Undead Doll" alt="Undead Doll"
            src="systems/morkborg/tokens/creatures/undead_doll.png"></div><div
            class="creature-col"><div class="creature"><h2
            class="name">@UUID[Compendium.morkborg.mork-borg-actors.f8nghV2lkv44mh2Y]{Undead
            Doll (Lady Porcelain)}</h2><div
            class="stat-block"><p><strong>HP</strong> 11 <strong>Morale</strong>
            – <strong>Porcelain</strong> -d2 <strong>Claws/piercing
            bite</strong> d4</p></div><div class="text"><p>In Tveland relic
            thieves, defamers and corrupt clerks suffer a punishment of
            exquisite and deeply impractical cruelty. Their children or
            grandchildren are enclosed in porcelain dolls then placed in
            cathedral windows, to die slowly of starvation and heat. Despite
            warding rituals, many return as vengeful undead, often gathering in
            large throngs to hunt their tormentors. Their mad gaze demands a
            Presence DR12 test at the start of combat to avoid being frozen with
            fear for d4 rounds.</p></div><div class="bounty"><p>Head
            <em>20s</em> Captured <em>80s</em></p></div></div></div></div><div
            class="creature-block"><div class="portrait-col"><img
            class="creature-portrait" title="Undead Necromancer" alt="Undead
            Necromancer"
            src="systems/morkborg/tokens/creatures/lich.png"></div><div
            class="creature-col"><div class="creature"><h2
            class="name">@UUID[Compendium.morkborg.mork-borg-actors.Qvy6gLQBAbOse9yi]{Undead
            Necromancer (Lich)}</h2><div
            class="stat-block"><p><strong>HP</strong> 15 <strong>Morale</strong>
            – <strong>Barrier (necro)</strong> -d4 <strong>Strike</strong> d6 +
            special</p><p>Special: Paralyzing touch (Presence DR14 every round
            to break free).</p></div><div class="text"><p>No one can use powers
            near this anti-magical wound in reality. Every round they can steal
            the contents of a nearby scroll and use this Power against its
            owner.</p></div><div class="bounty"><p>Captured <em>200s</em>
            Remains <em>130s</em> Skull
            <em>100s</em></p></div></div></div></div><div
            class="creature-block"><div class="portrait-col"><img
            class="creature-portrait" title="Wickhead Knife-Wielder"
            alt="Wickhead Knife-Wielder"
            src="systems/morkborg/tokens/creatures/wickhead.png"></div><div
            class="creature-col"><div class="creature"><h2
            class="name">@UUID[Compendium.morkborg.mork-borg-actors.druf8vNjV30skui5]{Wickhead
            Knife-Wielder (Aland)}</h2><div
            class="stat-block"><p><strong>HP</strong> 10 <strong>Morale</strong>
            7 <strong>No armor</strong> <strong>Knife with Dried blood</strong>
            d4</p><p>Special: Can magically douse all nearby light sources,
            ignite its own blinding light and attack. Then vanish into the
            darkness.</p></div><div class="text"><p>Sneaks up behind its
            victims, silent as the grave. Skulks around the cities’ outskirts
            and the thickets of Sarkash. 25% chance wounds from the insanely
            filthy knife become infected.</p></div><div
            class="bounty"><p>Captured <em>60s</em> Decapitated lantern
            <em>15s</em> Corpse <em>20s</em></p></div></div></div></div><div
            class="creature-block"><div class="portrait-col"><img
            class="creature-portrait" title="Wraith" alt="Wraith"
            src="systems/morkborg/tokens/creatures/wraith.png"></div><div
            class="creature-col"><div class="creature"><h2
            class="name">@UUID[Compendium.morkborg.mork-borg-actors.hEKbkgIhMUcmTuTU]{Wraith
            (Wrat)}</h2><div class="stat-block"><p><strong>HP</strong> 15
            <strong>Morale</strong> – <strong>No armor</strong>
            <strong>Touch</strong> d4 + special</p><p>Special: Swift, elusive
            and difficult to hit (dr14).</p></div><div class="text"><p>These
            soundless phantoms always win initiative. Their touch DRains
            Strength, Presence and Agility by 1 for the duration of the
            fight.</p></div><div class="bounty"><p>Captured <em>120s</em> Skull
            <em>70s</em> Ectoplasm <em>25s</em></p></div></div></div></div><div
            class="creature-block"><div class="portrait-col"><img
            class="creature-portrait" title="Wyvern" alt="Wyvern"
            src="systems/morkborg/tokens/creatures/wyvern.png"></div><div
            class="creature-col"><div class="creature"><h2
            class="name">@UUID[Compendium.morkborg.mork-borg-actors.rKStnRSKMwt65fra]{Wyvern
            (Eulotha)}</h2><div class="stat-block"><p><strong>HP</strong> 25
            <strong>Morale</strong> 10 <strong>Thick hide</strong> -d4
            <strong>Bite/Sting</strong> d6</p><p>Special: 60% chance that she
            bites. The tail’s venomous sting can paralyze a victim. Test
            Toughness DR14 to avoid one painful hour of paralysis.</p></div><div
            class="text"><p>Where the wyvern fly crops die.</p></div><div
            class="bounty"><p>Captured <em>200s</em> Corpse <em>100s</em> Poison
            gland <em>60s</em> Tail spike
            <em>60s</em></p></div></div></div></div><div
            class="creature-block"><div class="portrait-col"><img
            class="creature-portrait" title="Zombie" alt="Zombie"
            src="systems/morkborg/tokens/creatures/zombie.png"></div><div
            class="creature-col"><div class="creature"><h2
            class="name">@UUID[Compendium.morkborg.mork-borg-actors.EPsRB69MjrMUpQgs]{Zombie
            (Nodh)}</h2><div class="stat-block"><p><strong>HP</strong> 7
            <strong>Morale</strong> – <strong>Leather scraps</strong> -d2
            <strong>Claw/bite</strong> d2 + special</p><p>Special: Anyone bitten
            tests Toughness DR8 or dies within two days before rising as a
            zombie. The only cure or vaccine is said to be found at the peak of
            a pale mountain within an infinitely- miserable forest of dark
            leaves.</p></div><div class="text"><p>King Fathmu IX of Wästland in
            particular seeks this cure and knows the name and location of the
            forest which the mountain overlooks.</p></div><div
            class="bounty"><p>Captured <em>30s</em> Blood, per litre
            <em>5s</em></p></div></div></div></div></div>
