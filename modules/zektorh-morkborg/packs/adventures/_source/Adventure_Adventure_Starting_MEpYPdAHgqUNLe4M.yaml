          content: >-
            <div class="the-game abilities"><div class="content-wrapper"><div
            class="abilities-block"><div
            class="title"><p>Abilities</p></div><div class="ability-grid"><div
            class="ability"><p>AGILITY</p></div><div><p>Defend, balance, swim,
            flee</p></div><div
            class="ability"><p>PRESENCE</p></div><div><p>Perceive, aim, charm,
            wield Powers</p></div><div
            class="ability"><p>STRENGTH</p></div><div><p>Crush, lift, strike,
            grapple</p></div><div
            class="ability"><p>TOUGHNESS</p></div><div><p>Resist
            poison/cold/heat, survive falling</p></div></div></div><div
            class="cols"><div class="col"><p><strong>Roll 3d6</strong> and use
            the table on the right to generate each ability score from −3 to +3.
            The sum is not used in the game once the character is created, only
            the table value.</p><p></p><p>Player Characters not created with the
            optional classes can roll 4d6 and drop the lowest die for two of
            their abilities. When the character is later improved an ability can
            never exceed +6 or −3.</p><div class="title
            tests"><p>Tests</p></div><p>Tests are made against a
            <strong>Difficulty Rating</strong>. To succeed roll d20 ± your
            ability with a result equal to or greater than the DR. Creatures
            don’t use abilities, they just roll a d20 against DR. For example,
            <em>find bear trap DR14</em> or <em>resist red poison
            DR12</em>.</p></div><div class="spacer-col"><p></p></div><div
            class="col"><div class="subtitle"><p>Abilities</p></div><div
            class="score-grid"><div><p>1–4</p></div><div><p>-3</p></div><div><p>5–6</p></div><div><p>-2</p></div><div><p>7–8</p></div><div><p>-1</p></div><div><p>9–12</p></div><div><p>±0</p></div><div><p>13–14</p></div><div><p>+1</p></div><div><p>15–16</p></div><div><p>+2</p></div><div><p>17–20</p></div><div><p>+3</p></div></div><hr><div
            class="subtitle"><p>Difficulty Ratings (DR)</p></div><div
            class="rating-grid"><div><p>6</p></div><div><p>so simple people
            laugh at you for failing</p></div><div><p>8</p></div><div><p>routine
            but some chance of
            failure</p></div><div><p>10</p></div><div><p>pretty simple but not
            simple enough to not
            roll</p></div><div><p>12</p></div><div><p>normal</p></div><div><p>14</p></div><div><p>difficult</p></div><div><p>16</p></div><div><p>really
            hard</p></div><div><p>18</p></div><div><p>should not be
            possible</p></div></div></div></div></div></div>
