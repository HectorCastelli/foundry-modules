            <div class="the-tenebrous-reliquary simplified"><div
            class="title"><img title="The Tenebrous Reliquary" alt="The
            Tenebrous Reliquary"
            src="modules/morkborg-cult-feretory/assets/the-tenebrous-reliquary/the-tenebrous-reliquary-title.webp"><p><span
            class="die">D66</span>@DRAW[Compendium.morkborg-cult-feretory.feretory-tables.xHtbR6A9TOULOHNM]{The
            Tenebrous Reliquary}</p></div><div class="big-list"><div
            class="rel-item mercys-bane"><div class="num"><p><span
            class="yellow-bg">11.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.3wqJFmCgOLdExUYZ]{Mercy's
            Bane}</p></div><div class="credits"><p>by Ripley C.</p></div><div
            class="text"><p>Spiked Flail (d8). Deals an additional d6 damage to
            surrendering enemies.</p></div></div><div class="rel-item"><div
            class="num"><p><span class="yellow-bg">12.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.4ql1uqGYOnZ1yob1]{Opium
            Hook}</p></div><div class="credits"><p>by Leander E.</p></div><div
            class="text"><p>Metal hook directly applied to an artery (d4
            damage). Gives twice the HP as temporary HP for 2h.</p><p>Effect
            like an opiate. Toughness DR10 test to resist dependency (every
            sober day deals damage as an infection).</p><p>DR rises with each
            failed attempt. Eventually the user is addicted and loses the
            temporary HP benefit.</p></div></div><div class="rel-item
            plasmatic-idol"><div class="num"><p><span
            class="yellow-bg">13.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.7iPH2KLIQtF7c0uB]{Plasmatic
            Idol}</p></div><div class="credits"><p>by Paul Wilde.</p></div><div
            class="text"><p>Spill blood over this profane idol while resting and
            roll a die.</p><p>Odd: spilled blood becomes red poison (Toughness
            DR12 or -10 HP).</p><p>Even: until next rest, Agility and Strength
            tests are +2 DR.</p></div></div><div class="rel-item
            rippers-blade"><div class="num"><p><span
            class="yellow-bg">14.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.VWWJj4LSYRdoQnuK]{Ripper's
            Blade}</p></div><div class="credits"><p>by Leander E.</p></div><div
            class="text"><p>Deals no damage but removes d4-1
            Armor.</p></div></div><div class="rel-item"><div
            class="num"><p><span class="yellow-bg">15.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.hdEoOA9JyuckBAvH]{Roses
            of Winter}</p></div><div class="credits"><p>by Anders
            Arpi</p></div><div class="text"><p>A very rare, nearly extinct
            blood-red thorny flower—not an actual rose. A single petal
            completely numbs whoever eats it to pain for a few minutes. Damage
            is received normally but the wearer can’t be killed or broken during
            the flower’s effects.</p></div></div><div class="rel-item"><div
            class="num"><p><span class="yellow-bg">16.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.BloyhpwtdnWmHYvl]{Spine
            of God}</p></div><div class="credits"><p>by Dom Cohen</p></div><div
            class="text"><p>This shriveled, crusty length of vertebrae is warm
            to the touch. The bearer attracts the poor, their intentions unknown
            even to themselves.</p><p>If broken, the clouds part ending any
            weather effects as warm sunbeams pierce the heavens for the first
            time in a century.</p></div></div><div class="rel-item"><div
            class="num"><p><span class="yellow-bg">21.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.093qc0bpxdqZKOP5]{Snort
            Dagger}</p></div><div class="credits"><p>by Anders
            Arpi</p></div><div class="text"><p>A disgusting, dripping blade
            reeking of excrement and rot. Killing a goblin permanently breaks
            the blade but undoes the curse, freeing the creature
            within.</p></div></div><div class="rel-item"><div
            class="num"><p><span class="yellow-bg">22.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.b37DEJUQCAXe2kAe]{Stone
            Magnet}</p></div><div class="credits"><p>by Dom Cohen</p></div><div
            class="text"><p>A pair of magnetic stones that crackle and fizz when
            rubbed together. When the square stone is near danger, the round
            stone glows a dull orange. The stones can lie.</p></div></div><div
            class="rel-item"><div class="num"><p><span
            class="yellow-bg">23.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.ypN6OgkaWSgHh2pa]{Tentacles
            of Zen}</p></div><div class="credits"><p>by Karl Druid</p></div><div
            class="text"><p>When rubbed, shadow tendrils creep from this rusty
            lamp,he when they reach nostrils, t14 tentacles burrow: roll a DR,
            Presence test. On a success ks the brain struggles and brea (-1
            Presence); otherwise: the tentacles take root without resistance (+1
            Presence).</p></div></div><div class="rel-item"><div
            class="num"><p><span class="yellow-bg">24.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.txVhm60fp0hO4U6L]{Tyrant's
            Tongue}</p></div><div class="credits"><p>by Karl Druid</p></div><div
            class="text"><p>Putting this tongue in a skull’s mouth causes it to
            scream its last words before dying. Over and over and over
            again.</p></div></div><div class="rel-item"><div
            class="num"><p><span class="yellow-bg">25.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.3S3qavxBxT2Nauwi]{Veil
            of Blood}</p></div><div class="credits"><p>by Johan
            Nohr</p></div><div class="text"><p>Place this crimson shroud upon an
            enemy’s head it tightens, chokes, strangles and crushes its wearer’s
            skull, drowning their torso in blood.</p><p>Deals d6 damage per
            round, victims who succumb arise as a blood- drenched skeleton the
            next round, attacking at random.</p></div></div><div
            class="rel-item"><div class="num"><p><span
            class="yellow-bg">26.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.TCP6KULEViDDcLtx]{Voodoo
            Fire}</p></div><div class="credits"><p>by Flora v/d B.</p></div><div
            class="text"><p>An eternally burning green flame inside an oil lamp.
            When smashed, the flame spreads with the scattered oil.</p><p>It
            deals d4 fire damage on impact and can only be extinguished by the
            tears of SHE.</p></div></div><div class="rel-item"><div
            class="num"><p><span class="yellow-bg">31.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.PrUqkFGRTlNkwrqO]{Volt
            Thrower}</p></div><div class="credits"><p>by Ben H.</p></div><div
            class="text"><p>An ancient javelin made of an unidentifiable charred
            and pitted metal (d6 damage).</p><p>On a critical hit a lightning
            bolt strikes the javelin for an additional 2d10 damage, not reduced
            by armor.</p><p>On a fumble the lighting strikes the wielder before
            releasing the javelin. Use indoors is cautioned.</p></div></div><div
            class="rel-item"><div class="num"><p><span
            class="yellow-bg">32.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.qACkWCrvtx17vhy1]{The
            War Starter}</p></div><div class="credits"><p>by Anders
            Arpi</p></div><div class="text"><p>Heavy metal round shield
            emblazoned with a bright crimson pattern. Anyone looking at it tests
            Presence DR14 or is provoked to attack its
            wielder.</p></div></div><div class="rel-item"><div
            class="num"><p><span class="yellow-bg">33.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.hGzgCQfAW6C8XlEU]{Zodiac
            Lung}</p></div><div class="credits"><p>by Dom Cohen</p></div><div
            class="text"><p>Pressing this blackened organ to the chest absorbs
            it leaving fetid scars and pustules. When absorbed, the user may
            breathe underwater, provided it’s unclean. After an hour of
            submersion, the user may expunge the filth as writhing sludge
            dealing d4 damage to the closest target.</p></div></div><div
            class="rel-item"><div class="num"><p><span
            class="yellow-bg">34.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.IanFzeSLymnklKpb]{Cup
            of Peace}</p></div><div class="credits"><p>by Anders
            Arpi</p></div><div class="text"><p>A beautiful, ceremonial gold and
            silver cup. Drinking from it triggers a DR16 Toughness to not die of
            acute poisoning.</p></div></div><div class="rel-item"><div
            class="num"><p><span class="yellow-bg">35.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.7Oawr9k3ytZDHScs]{Dust
            of Paradise}</p></div><div class="credits"><p>by Johan
            Nohr</p></div><div class="text"><p>Fine, pale white ashes in a
            void-black pouch. Anyone inhaling roll a DR14 Presence test or is
            list in visions of a long-lost pleasant world of joy and mirth,
            lasting d6 minutes or until damaged. The transfixed cannot act,
            perceive or respond in any way to the real
            world.</p></div></div><div class="rel-item"><div
            class="num"><p><span class="yellow-bg">36.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.3338sOhlQhgw9qzw]{Ebony
            Tears}</p></div><div class="credits"><p>by Paul Wilde</p></div><div
            class="text"><p>A vial of black liquid. On contact a living creature
            must test Presence DR14 or is overcome with grief— immediately
            failing a morale check in combat.</p><p>Outside of combat, the
            affected acts as if indifferent— it cannot attack as it struggles
            with despair for 3d10 minutes.</p></div></div><div
            class="rel-item"><div class="num"><p><span
            class="yellow-bg">41.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.LHuijsy671fORFhp]{Eye
            of Horus}</p></div><div class="credits"><p>by Dom
            Cohen</p></div><div class="text"><p>Placed upon the forehead, the
            eye grants vision into the abyss, at a price.</p><p>When checking
            for traps, you see your grisly death from a less-careful timeline,
            allowing you to better find a workaround.</p><p>Overland travel is
            mired with difficulty as you wade through the
            corpses.</p></div></div><div class="rel-item"><div
            class="num"><p><span class="yellow-bg">42.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.QoF7eSYR9JAKuRN2]{Finger
            Paintings of the Insane}</p></div><div class="credits"><p>by Dom
            Cohen</p></div><div class="text"><p>Slick, oily paints forever wet
            upon an old wooden palette. Those touching any of the colours must
            test Toughness DR12 or lose themselves for a minute painting the
            nearest surface with heretical imagery.</p><p>Marking scrolls’ text
            with the paint imbues them with those lost to the pigments’ souls,
            -d4 from the Presence test to cast.</p></div></div><div
            class="rel-item"><div class="num"><p><span
            class="yellow-bg">43.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.XszhCJDRU8FTNUVV]{Flower
            of Disease}</p></div><div class="credits"><p>by Leander
            E.</p></div><div class="text"><p>Seeds for a quickly spreading
            thorny weed with a poisonous aroma. Can swallow a small village in
            two days if not fought. Weak against boiled oil. Fire does
            nothing.</p></div></div><div class="rel-item"><div
            class="num"><p><span class="yellow-bg">44.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.lhlozz2cf898fXdM]{Foehammer}</p></div><div
            class="credits"><p>by Leander E.</p></div><div
            class="text"><p>Cursed warhammer (2d6 damage) whose wielder develops
            a new grudge with a random person daily. Lasting until Foehammer
            caves their head in. Neglecting a grudge for too long counts as an
            infection.</p></div></div><div class="rel-item"><div
            class="num"><p><span class="yellow-bg">45.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.8Z1o6gN4wEPTT5DR]{Cauldron
            of Lies}</p></div><div class="credits"><p>by Leander
            E.</p></div><div class="text"><p>Beverages cooked in this cauldron
            and shared allows all imbibers to recognize when another is lying
            for a month.</p><p>Used in cults and secret societies to single out
            traitors.</p></div></div><div class="rel-item"><div
            class="num"><p><span class="yellow-bg">46.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.6LI86DqdyqVXyaQj]{Cursed
            Tongue of the Naga}</p></div><div class="credits"><p>by Dom
            Cohen</p></div><div class="text"><p>Putting this long, forked tongue
            into a skull pushes the skull upright, which screams bloody filth
            whilst running about on each tongue-tip.</p></div></div><div
            class="rel-item"><div class="num"><p><span
            class="yellow-bg">51.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.cEPYPW919wIWtuOW]{Chaos
            Blade}</p></div><div class="credits"><p>by Leander E.</p></div><div
            class="text"><p>Zweihänder dealing 2d8 damage. On maximum damage the
            Power Death is cast.</p></div></div><div class="rel-item"><div
            class="num"><p><span class="yellow-bg">52.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.Zi79dAN5bYbOoZ1y]{Chains
            of Death}</p></div><div class="credits"><p>by Ripley
            C.</p></div><div class="text"><p>A set of frigid black manacles. If
            you die wearing them, they unlatch ensnaring your killer and drag
            them to another world before vanishing.</p></div></div><div
            class="rel-item"><div class="num"><p><span
            class="yellow-bg">53.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.WM1lSJ8zlWWIivRT]{Claw
            of the Sloth}</p></div><div class="credits"><p>by Ben
            H.</p></div><div class="text"><p>Dagger (d4 damage), on a 1, attack
            and defense DR against that target are -2 next round.</p><p>If DR
            reaches 0 the target is frozen in place,
            permanently.</p></div></div><div class="rel-item"><div
            class="num"><p><span class="yellow-bg">54.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.ariDxu29i2R4hF0h]{Blood
            of the Serpents}</p></div><div class="credits"><p>by Leander
            E.</p></div><div class="text"><p>Green-red (highly acidic and
            poisonous) liquid which turns blood neon green and spreads through
            bodily liquids.</p><p>When the infected is attacked, their attacker
            tests Agility DR12 to dodge a spray of blood (reduces Armor one tier
            and transmits the condition).</p></div></div><div
            class="rel-item"><div class="num"><p><span
            class="yellow-bg">55.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.Lm4OYRSWHH1PxZGk]{Crown
            of Burning Stars}</p></div><div class="credits"><p>by Leander
            E.</p></div><div class="text"><p>Adds Omens equal to the number of
            Miseries that have transpired to each character’s pool. Miseries now
            occur on 1 &amp; 2.</p></div></div><div class="rel-item"><div
            class="num"><p><span class="yellow-bg">56.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.dHb2m4L55tq1bAfs]{Book
            of Oblivion}</p></div><div class="credits"><p>by Anders
            Arpi</p></div><div class="text"><p>A sentient black leather tome
            with blank pages. With a Presence DR12 test a creature can
            permanently transfer knowledge—a thought or a memory— to the book,
            forgetting the thing transferred. On failure the book takes
            something extra.</p><p>You can learn anything the book previously
            absorbed before for something you don’t want to give
            it.</p></div></div><div class="rel-item"><div class="num"><p><span
            class="yellow-bg">61.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.yU0IEYhXU4beIn81]{Antlers
            of Lightning}</p></div><div class="credits"><p>by Dom
            Cohen</p></div><div class="text"><p>Whilst wearing this crackling
            mantle you wield the power of the final storm.</p><p>When reading
            any scroll, flip a coin. On Heads, the scroll’s effects are replaced
            by Nine Violet Signs Unknot the Storm instead.</p><p>Upon death, the
            wearer is struck by lightning, their flesh rending from bone,
            leaving only the mantle.</p></div></div><div class="rel-item"><div
            class="num"><p><span class="yellow-bg">62.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.YZq981JcVExDT3mT]{Eyes
            and Teeth}</p></div><div class="credits"><p>by Paul
            Wilde</p></div><div class="text"><p>Replace d10 missing teeth and d2
            eyes. Test Toughness DR14 or rejection causes
            infection.</p><p>Effects of new eyes/teeth
            (d4):</p><ol><li>Wandering: DR +2 to ranged attacks</li><li>Morbid
            Visions: every rest, share your nightmare with the group</li><li>Let
            there be light! (no ill effects)</li><li>SIGHT BEYOND SIGHT! (Test
            Presence DR10 for eyes to twitch in danger’s presence—it’s not YOUR
            eye though, it can lie)</li></ol><ol><li>Toothache: DR +2 to Powers’
            Presence roll</li><li>Functional but hideous</li><li>You got teeth!
            (no ill effects)</li><li>FANGS! Gain bite attack (D6 damage, on 1-2
            enemy gets a free attack)</li></ol></div></div><div
            class="rel-item"><div class="num"><p><span
            class="yellow-bg">63.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.7PMxeA5SZOhcgzG8]{Black
            Candles}</p></div><div class="credits"><p>by Ripley C.</p></div><div
            class="text"><p>When lit the jet-black flame flickers towards the
            greatest threat within a mile (or kilometer).</p></div></div><div
            class="rel-item"><div class="num"><p><span
            class="yellow-bg">64.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.Xy0Y7rWFVLctzx8J]{Robe
            of Bones}</p></div><div class="credits"><p>by Dom
            Cohen</p></div><div class="text"><p>This lumpy cape rattles in the
            wind. Once daily, you may stare blankly at a humanoid creature as
            the cape guides your hands.</p><p>With a fold of the robe, the
            target must test DR13 Toughness or a random limb’s bone snaps
            soundlessly as the robe crackles.</p></div></div><div
            class="rel-item"><div class="num"><p><span
            class="yellow-bg">65.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.VANdKr6Zyd1i3Gz6]{Ash
            of the Mind}</p></div><div class="credits"><p>by Paul
            Wilde</p></div><div class="text"><p>Smear a sigil onto one’s palm
            and touch another sentient being to read their
            thoughts.</p><p>Presence DR12 test or their thoughts become
            yours.</p></div></div><div class="rel-item"><div
            class="num"><p><span class="yellow-bg">66.</span></p></div><div
            class="name"><p>@UUID[Compendium.morkborg-cult-feretory.feretory-items.KUaY5IqeV72wrJ9g]{Bowels
            of a Baby Killer}</p></div><div class="credits"><p>by Dom
            Cohen</p></div><div class="text"><p>Take the bowl and drape the
            entrails over you, gaining a monster’s scent. Evil creatures must
            make a DR14 check when attempting to discern your location. Should
            they fail, you pass by unnoticed.</p></div></div></div></div>
