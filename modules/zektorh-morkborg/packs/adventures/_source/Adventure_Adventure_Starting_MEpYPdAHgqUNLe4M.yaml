      - sort: 600000
        name: The Wind from the west
        type: text
        _id: 6HD1W9ZW1hY86g4O
        title:
          show: false
          level: 1
        image: {}
        text:
          format: 1
          content: >-
            <div class="colophon the-wind-from-the-west"><div
            class="the-wind"><img class="sk-big-t"
            src="modules/morkborg-core/assets/colophon/sk-big-t.webp"><p>he Wind
            from the west. From the sundered land. Rot rides it, and the stench
            of blood. Cursed walker, will you travel there? To the Valley of the
            Unfortunate Undead? Our young ones are taken by the child-thief
            Tergol, known for his vile crimes and alchemy of
            flesh.</p></div><div class="cols"><div
            class="col"><p><strong>Distances shift. Paths between places
            warp.</strong> As if this pale, lightless world possessed a will and
            bitter life. Its mercy curdled to wrath over a too-long
            age.</p><p>Who are you? The grave robber with silver glittering
            between cracked fingernails? The mystic who would bend the world’s
            miserable heart away from its inevitable end?</p></div><div
            class="spacer-col"><p></p></div><div class="col"><p>Most likely, it
            makes little difference. No one has seen the sun in years. The old
            care more for sacrifice and god-offerings than their bawling spawn.
            Doomsayers are proved right time and again and embraced by hidden
            powers. Maybe it’s best to surrender—to trust your own instinct and
            skill rather than the whim of the dice? Before all is drowned in
            welcome silence. Life locked and failing in a <strong>DARK
            FORT.</strong></p></div></div></div>
