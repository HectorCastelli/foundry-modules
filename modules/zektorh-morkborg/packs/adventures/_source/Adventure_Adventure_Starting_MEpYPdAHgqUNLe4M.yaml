            hysterically at your own jokes which you then explain in
            detail.</li><li>A nihilist. You insist on telling everyone you are a
            nihilist and explaining why.</li><li>Inveterate bug
            eater.</li><li>Stress response is aesthetic display. The worse
            things get the fancier you need to be.</li><li>Permanent phlegm
            deposit in throat. Continuously cough, snort, spit and
            swallow.</li><li>Pyromaniac</li><li>Consistently lose important
            items and forget vital facts.</li><li>Insecure shit-stirrer. Will
            talk about whoever just left the room.</li><li>You stutter when
            lying.</li><li>You giggle insanely at the worst possible
            times.</li><li>You whistle while trying to hide. You will deny this.
            Whistle when 5, 7, 9, 11 or 13 is rolled on a d20.</li><li>You make
            jewelry from the teeth of the dead. If this can be considered a bad
            habit.</li></ol></div></div>
