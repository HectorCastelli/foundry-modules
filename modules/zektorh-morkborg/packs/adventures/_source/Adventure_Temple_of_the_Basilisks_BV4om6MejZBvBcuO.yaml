journal:
  - name: Temple of the Basilisks
    _id: JkSrQXedNXVdAVUQ
    pages:
      - sort: 100000
        name: Introduction
        type: text
        _id: 6ScxOIFoBAoZ8z9v
        system: {}
        title:
          show: true
          level: 1
        image: {}
        text:
          format: 1
          content: >-
            <p>This is the large structure at the center of
            Galgenbeck.</p><p></p><p>This immense marble building rises from the
            ground sharply. Close to the top, two intertwining towers break out
            and reach for the dark skies. At the top, above the clouds, the
            towers are covered in a thick copper shell.</p><p><br>Here,
            @UUID[Actor.5b3UZv795nFsUFyI]{Guinevere, the Copper Coffin} rules
            over Galgenbeck, it's inquisitors, and the middle lands.</p>
        video:
          controls: true
          volume: 0.5
        src: null
        category: null
        ownership:
          default: -1
          1Njz0vDEn4hXH4fV: 3
        flags: {}
        _stats:
          coreVersion: '14.368'
          systemId: morkborg
          systemVersion: 6.0.1
          createdTime: null
          modifiedTime: null
          lastModifiedBy: null
          compendiumSource: null
          duplicateSource: null
          exportSource: null
      - sort: 200000
        name: Outside
        type: text
        _id: MX1Gj4wEXkdL8YHa
        system: {}
        title:
          show: true
          level: 1
        image: {}
        text:
          format: 1
          content: >-
            <p>The outside has been ravaged by the recent zombie
            attack.</p><p>The doors to the inside, into
            @UUID[.iSh7Y9uMatG9vy3g]{The Nave of Supplication},are barricaded
            from the inside. Some nobles inside are still watching the blocked
            off windows with unease.</p><p>If you wish to enter unnoticed, the
            inquisitor's @UUID[.5tl2I9BTnqaRCaZC]{Gaol of the Faithless} has a
            hidden entrance here. Some nobles know of this, or the players can
            try to find it by themselves.</p><p>Interacting with the nobles
            raises notice to the inquisitors and nobles inside the temple.</p>
        video:
          controls: true
          volume: 0.5
        src: null
        category: null
        ownership:
          default: -1
          1Njz0vDEn4hXH4fV: 3
        flags: {}
        _stats:
          coreVersion: '14.368'
          systemId: morkborg
          systemVersion: 6.0.1
          createdTime: null
          modifiedTime: null
          lastModifiedBy: null
          compendiumSource: null
          duplicateSource: null
          exportSource: null
      - sort: 300000
        name: The Nave of Supplication
        type: text
        _id: iSh7Y9uMatG9vy3g
        system: {}
        title:
          show: true
          level: 1
        image: {}
        text:
          format: 1
          content: >-
            <p>A large marble hall lined with two sets of black and purple
            carpets that meet in the middle, at a large altar with a large
            basilisk skull, perforated by two copper needles.</p><p></p><p>Near
            the windows, nobles has pushed the furniture to block it off. Some
            windows are broken, and the floor is littered with dead bodies of
            zombies, and a couple of nobles.</p><p></p><p>In the center of the
            room, wealthy families sit on their own private enclosed gondolas,
            protected by small armies of guards.</p><p></p><p>Some lower ranking
            nobles, and inquisitors of less renown, are patrolling the halls,
            and they attack anyone suspicious, or
            poor-looking.</p><p></p><p>Behind the main altar, another room parts
            in three paths:</p><ul><li><p>To the left, a small room where the
            clergy prepares for rituals is filled with relics and religious
            paraphernalia, indistinguishable from torture tools. A staircase
            leads up to the inner rooms, where the most important relics and
            texts are kept, in the @UUID[.ZeuCClS75SR2a44F]{Chancel of
            Edicts}.</p></li><li><p>At the center, the farthest corner, a curved
            staircase leads upwards to the ritual chambers for government, the
            @UUID[.75EeGmmWmt1cfZK7]{Courthouse}.</p></li><li><p>To the right,
            in a hidden corner, a guarded door leads downwards, to the
            @UUID[.5tl2I9BTnqaRCaZC]{Gaol of the Faithless}, the main
            Inquisition office.</p></li></ul>
        video:
          controls: true
          volume: 0.5
        src: null
        category: null
        ownership:
          default: -1
          1Njz0vDEn4hXH4fV: 3
        flags: {}
        _stats:
          coreVersion: '14.368'
          systemId: morkborg
          systemVersion: 6.0.1
          createdTime: null
          modifiedTime: null
          lastModifiedBy: null
          compendiumSource: null
          duplicateSource: null
          exportSource: null
      - sort: 150000
        name: Gaol of the Faithless
        type: text
        _id: 5tl2I9BTnqaRCaZC
        system: {}
        title:
          show: true
          level: 1
        image: {}
        text:
          format: 1
          content: >-
            <p>This is the dungeon where hunted heretics are kept.</p><p>The
            supply entrance has been ripped open by a hungry mob of zombies.
            Inside, [[/r 1d8]] zombies still roam looking for more prey. This is
            a torture complex, but you see no dead bodies anywhere.</p><p>If you
            enter from the main entrance, coming down from within the
            @UUID[.iSh7Y9uMatG9vy3g]{The Nave of Supplication}, you find youself
            in a processing room, where heretics would be stripped before being
            sent off into their cells.</p><p>If you jump down from the
            @UUID[.MX1Gj4wEXkdL8YHa]{Outside}, you land in a supply room. It has
            already been ransacked, and all of the previously usable food is now
            crushed in the ground. A strong smell of blood and vomit emerges as
            you enter it.</p><p>At the furthest end from the main entrance, a
            small room is kept to prepare heretics to their last punishment: a
            one-way ticket into the @UUID[.rJUZc3EWd5NaeikU]{Pale Vein
            Quarry}.</p>
        video:
          controls: true
          volume: 0.5
        src: null
        category: null
        ownership:
          default: -1
          1Njz0vDEn4hXH4fV: 3
        flags: {}
        _stats:
          coreVersion: '14.368'
          systemId: morkborg
          systemVersion: 6.0.1
          createdTime: null
          modifiedTime: null
          lastModifiedBy: null
          compendiumSource: null
          duplicateSource: null
          exportSource: null
      - sort: 500000
        name: Chancel of Edicts
        type: text
        _id: ZeuCClS75SR2a44F
        system: {}
        title:
          show: true
          level: 1
        image: {}
        text:
          format: 1
          content: >-
            <p>A gathering room and study for the clergy.</p><p>The upper room
            contains a large open space, to prepare the clergy before they walk
            down and do their activities.</p><p>After that, a library, where
            core texts and relics are kept. A skeletal hand of a basilisk is
            kept here. No one is quite sure how it came to Galgenbeck in the
            first place, but it reeks of sulfur, and some swear it moves from
            time to time.</p><p>At the back, a small locked room full of
            treasures is kept under watch by two blind monks. They are
            instructed to attack and kill anyone that comes in. If a treasure is
            ever to be retrieved, killing and replacing the monks is part of the
            procedure anyways.</p>
        video:
          controls: true
          volume: 0.5
        src: null
        category: null
        ownership:
          default: -1
          1Njz0vDEn4hXH4fV: 3
        flags: {}
        _stats:
          coreVersion: '14.368'
          systemId: morkborg
          systemVersion: 6.0.1
          createdTime: null
          modifiedTime: null
          lastModifiedBy: null
          compendiumSource: null
          duplicateSource: null
          exportSource: null
      - sort: 125000
        name: Pale Vein Quarry
        type: text
        _id: rJUZc3EWd5NaeikU
        system: {}
        title:
          show: true
          level: 1
        image: {}
        text:
          format: 1
          content: >-
            <p>This is the remains of the most ancient marble quarry of the
            city.</p><p>It goes downwards for days, and no one has returned from
            it ever since the first signs of the apocalypse started to show,
            decades ago.</p><p>At the deepest zone, an ancient horror is kept at
            bay by a constant flow of sacrifices. Sacrifices that, now that the
            inquisition is too busy, have stopped flowing.</p><p>A colony of
            sturdy and unsavory heretics has established themselves in the
            tunnels, and they actively hunt newcomers as food. Those unlucky,
            will end up walking down to their certain doom instead.</p>
        video:
          controls: true
          volume: 0.5
        src: null
        category: null
        ownership:
          default: -1
          1Njz0vDEn4hXH4fV: 3
        flags: {}
        _stats:
          coreVersion: '14.368'
          systemId: morkborg
          systemVersion: 6.0.1
          createdTime: null
          modifiedTime: null
          lastModifiedBy: null
          compendiumSource: null
          duplicateSource: null
          exportSource: null
      - sort: 600000
        name: Sunless Throne
        type: text
        _id: 9wqYTVW0WmLXNMVM
        system: {}
        title:
          show: true
          level: 1
        image: {}
        text:
          format: 1
          content: >-
            <p>This is a large room made of white marble.</p><p>It is dark, and
            the only sources of light are three braziers that burn
            slowly.</p><p>In the center of the room, two large copper spires
            erupt from the floor and breach the ceiling.</p><p>The entire
            interior of the room, excluding the floor, is coated in sharp copper
            spikes that come out in a rhythmic pattern.</p><p>At the center of
            the room, a large map of the world is spread out. Coins are placed
            where major cities lie. All of the coins are where you would expect,
            except one, that is placed beyond the Bergen Crypt, where no land is
            supposed to exist.</p><p>At the end of the room, in a large copper
            throne sits @UUID[Actor.5b3UZv795nFsUFyI]{Guinevere, the Copper
            Coffin}. She already is aware of your presence and is waiting for
            you.</p><p>Trying to fool her will get you in a fight. Obeying her,
            as well. There is a tenuous line between blind servitude and
            complete disrespect. You must show spirit, but let her break it.</p>
        video:
          controls: true
          volume: 0.5
        src: null
        category: null
        ownership:
          default: -1
          1Njz0vDEn4hXH4fV: 3
        flags: {}
        _stats:
          coreVersion: '14.368'
          systemId: morkborg
          systemVersion: 6.0.1
          createdTime: null
          modifiedTime: null
          lastModifiedBy: null
          compendiumSource: null
          duplicateSource: null
          exportSource: null
      - sort: 500000
        name: Courthouse
        type: text
        system: {}
        title:
          show: true
          level: 1
        image: {}
        text:
          format: 1
          content: >-
            <p>This is a shared space for the nobles to interact with the
            regent.</p><p>The nobles gather to receive orders from the regent,
            and to discuss the matters as they see fit.</p><p>The ruler never
            joins them, and usually sends down messengers to carry notes when
            appropriate. The large copper staircase is used for this purpose,
            and it leads to the @UUID[.9wqYTVW0WmLXNMVM]{Sunless
            Throne}.</p><p>At the north corner, a small coffee shop is setup, by
            popular demand, since most nobles tasked with matters of government
            end up locked for days in this floor until the ruler is happy with
            the state of deliberations.</p>
        video:
          controls: true
          volume: 0.5
        src: null
        category: null
        ownership:
          default: -1
          1Njz0vDEn4hXH4fV: 3
        flags: {}
