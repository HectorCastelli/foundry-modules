  - sort: 600000
    name: Ideas
    type: text
    _id: 5GcJWq6cOI50qKpH
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>These are incomplete ideas for new rules I have in
        mind:</p><ul><li><p>Cursed items: When looting graves/corpses, roll
        1d20. On a 1, the item is cursed. When it gets used for the first time,
        it fails spectacularly. It then works as intended from that point
        forwards.</p></li><li><p>Exploding damage: Rolling maximum damage on a
        attack dice allow you to roll the dice once more.</p></li><li><p>Cleave:
        If you deal more than 2x the remaining HP of a target, the remaining
        damage can be transferred to another nearby/adjacent
        target.</p></li><li><p>Rot: every in-world day, roll 1d6. On a 2 or
        below, the rations spoil/rot/get infested.</p></li><li><p>Inheritance:
        When a character dies, the player can roll a new character. If they wish
        to keep a specific item, they can do so… but must gain an extra Bad
        Habit or curse.</p></li><li><p>Desperate strike: Reduces DR by 2 when
        attacking, but all defense rolls until the next turn have their DR
        increased by 2.</p></li><li><p>Last breath: when a character dies, they
        get one final attack roll on whoever deal the final strike; or, they
        frail wildly and everyone nearby must pass a DR12 AGILITY test or get
        hit with a d4.</p></li></ul>
