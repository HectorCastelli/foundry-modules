  - sort: 300000
    name: Sanity
    type: text
    _id: 1KTXG23BQacuzswX
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>All characters have a SANITY attribute that can range from 2 to
        -6.</p><p>Whenever something horrific, disturbing (for the character),
        or incomprehensive happens to a character, they must roll a SANITY tests
        with DR 12. On a failure, decrease SANITY by 1.</p><p></p><p>Whenever
        your SANITY is lowered:</p><ul><li><p>If your new SANITY score is at or
        above 0, you are afraid and/or uncomfortable with something. Act
        accordingly.</p></li><li><p>If it drops below 0, you gain a new feat
        representing it. Add a
        @UUID[Compendium.zektorh-morkborg.items.Item.tBL1rtINQZ5w5Hbl]{Fear} to
        your character.</p></li><li><p>It it is at or below a -4, you gain a
        @UUID[Compendium.zektorh-morkborg.items.Item.wotUJ4TjRi4l4TnP]{Extreme
        Fear} instead.</p></li></ul><p></p><p>If you face the subject of your
        fears and win (or at least come out whole), gain 1 SANITY.</p>
