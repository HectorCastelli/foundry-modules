        <h2>Desperation</h2><p>If the players are desperate and in need of an
        Omen, but none of them have it, they can bargain with the GM.</p><p>In
        exchange for an Omen that must be used immediately, the GM rolls a
        Misery with "The end is night! (d2)" as the frequency.</p>
