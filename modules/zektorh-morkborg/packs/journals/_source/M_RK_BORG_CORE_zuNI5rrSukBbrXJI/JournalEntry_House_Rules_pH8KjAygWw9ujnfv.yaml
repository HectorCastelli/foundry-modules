  - sort: 200000
    name: Combat
    type: text
    _id: gPdCvyeARnBdSHAT
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Flanking</h2><p>When fighting in close quarters, the number of
        combatants affects how hard it is to dodge, move, and attack.</p><p>If
        two characters of the same disposition (Neutral, Friendly, Hostile) are
        nearby (melee range) and surrounding a target, it is considered
        flanked.</p><blockquote><p>To determine if the character is surrounded,
        draw a line between them, and if any line crosses the target, then it is
        considered flanked.</p><p>If multiple characters are surrounding a
        target, as long as one pair is flanking, the target is flanked for all
        of them.</p></blockquote><p>When attacking someone in melee range that
        is flanked, reduce the DR to hit by 2.</p><p>If hostile characters are
        surrounding a player, and one of them attacks the player, increase the
        DR to defend by 2.</p>
