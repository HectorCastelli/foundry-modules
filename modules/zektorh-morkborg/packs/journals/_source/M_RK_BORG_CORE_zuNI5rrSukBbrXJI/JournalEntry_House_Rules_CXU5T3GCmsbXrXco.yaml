  - sort: 187500
    name: Sanity
    type: text
    _id: 071GhlHe69UL2kKc
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Sanity Attribute</h2><p>All characters have a new SANITY attribute
        that can range from 3 to -6. Characters start at PRESENCE+[[/r 1d2]]
        SANITY.</p><h2>Restlessness</h2><p>When faced with danger, if you are
        unable to take actions, you must pass DR12 SANITY test or lose 1
        SANITY.</p><h2>Paranoia</h2><p>When resting in a dangerous or unsafe
        location, you must pass a DR12 SANITY test or lose 1 SANITY. If you do,
        also reduce the benefits of the rest by half.</p><h2>Descent into
        Madness</h2><p>Whenever your SANITY falls below 0, you add a new feat
        representing a
        @UUID[Compendium.zektorh-morkborg.items.Item.KjVBlWfchNkwcbH2]{Fear}
        associated with the situation.</p><p>If your SANITY falls below 4, you
        also gain a new
        @UUID[Compendium.zektorh-morkborg.tables.xAdS3jgI5K2mAYgu]{Bad
        Habit}.</p><h2>Recovery</h2><p>SANITY is only recovered when pressing
        forward. Triumphing or coming out unscathed from a horrific situation,
        overcoming or defeating the object of your fear, or suppressing extreme
        discomfort causes you to recover sanity.</p><p>You may only recover 1
        SANITY between each long rest.</p><h2>Catatonia</h2><p>If a characters
        SANITY reaches -6, they become Catatonic. Too afraid and useless to do
        any basic functions. Consider them dead. Time to roll a new one.</p>
