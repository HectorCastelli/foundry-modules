      content: >-
        <p>These are house rules for Mork Borg meant to tweak the core and make
        it more interesting, and a better fit for the group.</p><p>As any
        experimental change, there is a chance it doesn't work as intended.
        Don't hesitate to share feedback, suggest changes, new rules, or to even
        ask for a rule to be completely removed.</p>
