  - sort: 150000
    name: Combat
    type: text
    _id: 8eKSCr60WJHeKpLE
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Hesitation</h2><p>Players have 10 seconds to start describing what
        they want to do. If they fail to do so, their character will take a
        defensive stance (+2 DR on DEFEND rolls), and stay
        put.</p><h2>Crowds</h2><p>When multiple players or monsters gather in
        melee combat, the crowded field makes combat more deadly.</p><p>If two
        or more combatants engage a target in melee, all attacks against that
        target gain +2 to hit. ATTACK lowers the DR by 2, while DEFEND increases
        it by 2.</p><h2>Surge</h2><p>When a die is rolled to determine damage,
        if it lands on the highest possible value, you may roll the dice once
        more and add it to the final damage dealt. This can only happen once per
        attack roll.</p><h2>Cleaving</h2><p>If an attack deals more than twice
        the remaining HP of a target, you may transfer the remaining damage into
        another target in melee range. This can only happen once per
        attack.</p><h2>Cowardice</h2><p>When a side retreats from combat, they
        trigger a reaction from every enemy in melee range.</p><p>This reaction
        cannot contain movement, but may be an attack (with +2 DR to ATTACK, -2
        DR to DEFEND), snatching something (DR12 AGILITY test), or tripping the
        retreating party (DR14 AGILITY test).</p>
