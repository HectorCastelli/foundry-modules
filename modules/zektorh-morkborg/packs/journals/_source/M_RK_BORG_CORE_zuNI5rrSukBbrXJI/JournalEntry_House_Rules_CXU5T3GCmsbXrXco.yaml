  - sort: 200000
    name: Future ideas
    type: text
    _id: mubqHF4qFDhGOdR0
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>These are incomplete ideas for new rules I have in
        mind:</p><ul><li><p><s>Rot: every in-world day, roll 1d6. On a 2 or
        below, the rations spoil/rot/get infested.</s></p><ul><li><p>Resource
        management suxxxx</p></li></ul></li><li><p>Desperate strike: Reduces DR
        by 2 when attacking, but all defense rolls until the next turn have
        their DR increased by 2.</p></li><li><p>Last breath: when a character
        dies, they get one final attack roll on whoever deal the final strike;
        or, they frail wildly and everyone nearby must pass a DR12 AGILITY test
        or get hit with a d4.</p></li><li><p>Share nightmare: While resting, a
        player may decide to share a nightmare or disturbing vision with another
        (or all the party). The player sharing gains 1 SANITY. The ones
        listening must pass a DR12 test, or lose 1
        sanity.</p></li><li><p><s>Meat shield: Players can use a nearby friendly
        NPC as a meat shield. This transfers all attack damge onto them,
        ignoring armor. This makes the friendly NPC very annoyed. The friendly
        NPC may still finish the combat before turning on the offending
        player.</s></p><ul><li><p>No more incentives. We will do this
        anyways</p></li></ul></li><li><p>Salvage: When items break, they can
        still be useful. Combining two broken items during rest can make a new
        fragile tool. Fragile tools can be used once, then they break
        forever.</p><ul><li><p>Probably okay, no need to write
        down.</p></li></ul></li><li><p>Cowardice: When running from a combat,
        roll 1d6. On a 3 or below, drop one random item. Roll PRESENCE DR12 to
        notice it.</p><ul><li><p>Doesn't feel
        good</p></li></ul></li><li><p><s>Memorize: Scrolls become burn-on-use
        items. You can choose to spend a long rest memorizing it instead. This
        allows you to cast it multiple times, until you fail to cast it. When
        you memorize a scroll, you dont get the benefits of the long
        rest.</s></p><ul><li><p>Keep RAW. Must hold + read the scroll to use it.
        It doesnt burn out.</p></li></ul></li><li><p><s>Permanent initiative: At
        the start of the session, roll initiative. Keep this number until a
        change makes sense (ambush, etc). Ending a combat doesn't change
        initiative</s></p><ul><li><p>RAW Initiative: reroll every round(?), use
        group initiative</p></li></ul></li><li><p>Slower "get better": You can
        only cash-in a get better when you long rest.</p></li><li><p>Potion
        mixing: Consuming two different potions/elixirs within the same hour may
        cause a nasty reaction. Roll a table to find out what
        happens.</p><p></p></li></ul>
