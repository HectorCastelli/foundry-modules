      content: >-
        <h2>Grave Malice</h2><p>When looting graves or corpses, there is a
        1-in-6 chance of the item being cursed. Cursed items fail spectacularly
        the first time they are used, but work as intended from that point
        on.</p><h2>Inheritance</h2><p>When a player dies, their new character
        may inherit one item from their previous character if they take on a
        @UUID[Compendium.zektorh-morkborg.tables.xAdS3jgI5K2mAYgu]{Bad Habit} in
        exchange.</p>
