  - sort: 200000
    name: Carousing
    type: text
    _id: Nq63P3EhjCA1bFyu
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Why not let the PCs take a load off with a bit of carousing at their
        newfound tavern? This gives them the opportunity to spend their
        ill-gotten gains and get very little in return. Who knows, it might even
        lead right into a new adventure!</p><p></p><p>To start carousing, each
        player rolls Presence. Add the results together and multiply the sum by
        10 to get the amount of silver the group has left between them after
        carousing. If this is more than the group had to begin with, roll on
        @UUID[Compendium.zektorh-morkborg.tables.RollTable.H9sqx0zwXsQGGUjf]{What
        Was Won?}. If it is less, roll on
        @UUID[Compendium.zektorh-morkborg.tables.RollTable.o8E3SuaBzebkV3rv]{What
        Was Lost?}.</p>
