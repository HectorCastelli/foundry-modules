        <p>To create a tavern:</p><ol><li><p>Roll for the
        name</p><ol><li><p>Roll once on
        @UUID[Compendium.zektorh-morkborg.tables.RollTable.9Uv713vBjhPecaIj]{Tavern
        Names (1)} and once on
        @UUID[Compendium.zektorh-morkborg.tables.RollTable.KBN3eIJRA0A9AnSh]{Tavern
        Names (2)}; or</p></li><li><p>Roll twice on
        @UUID[Compendium.zektorh-morkborg.tables.RollTable.KBN3eIJRA0A9AnSh]{Tavern
        Names (2)}</p></li></ol></li><li><p>Roll
        @UUID[Compendium.zektorh-morkborg.tables.RollTable.G1x86zwrdHxGUdoQ]{The
